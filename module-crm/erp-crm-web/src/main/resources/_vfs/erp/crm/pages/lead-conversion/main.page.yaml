# 线索转化向导（plan 2026-08-03-1232-4 Phase 2 + plan 2026-08-29-1913-2 Phase 1）。
#
# 引导式流程驱动既有 crm Facade mutation 链（零后端 delta）：
#   ErpCrmLeadBizModel.moveStage（ErpCrmLeadMoveStageProcessor）——stageId 沿 ErpCrmStage.sequence 单向递增。
#
# 三步：① 选择线索 → ② 选择目标阶段 → ③ 确认转化。
type: page
title: "线索转化向导"
body:
  - type: text
    className: m-3
    tag: div
    tpl: '<div class="alert alert-info"><strong>线索转化三步向导</strong>：选择线索 → 选择目标漏斗阶段 → 确认转化（moveStage，stageId 单向递增）。</div>'

  # Step 1：选择线索
  - type: data-source
    name: leadsData
    action: ajax
    args:
      url: '@query:ErpCrmLead__findPage'
      method: post
      data:
        query:
          limit: 200
      selection: id code leadType expectedRevenue probability stage.id stage.stageName stage.sequence partnerId

  - type: form
    name: step1Form
    title: "Step 1 · 选择线索"
    className: m-3
    mode: normal
    body:
      - type: select
        name: leadId
        label: "选择线索"
        required: true
        clearable: true
        source: ${leadsData?.items ?? []}
        valueField: id
        labelField: "${code} · 预期收入:${expectedRevenue || 0} · 当前阶段:${stage?.stageName || '—'}"
      - type: button
        label: "下一步：选择目标阶段"
        level: primary
        icon: "fa fa-arrow-right"
        onClick:
          action: refreshSource
          targetId: stagesData
        disabledOn: "${!step1Form?.leadId}"

  # Step 2 + 3：选择目标阶段 + 确认转化
  - type: data-source
    name: stagesData
    action: ajax
    args:
      url: '@query:ErpCrmStage__findPage'
      method: post
      data:
        query:
          limit: 100
      selection: id stageName sequence isWonStage defaultProbability

  - type: container
    className: m-3
    visible: "${step1Form?.leadId}"
    body:
      - type: text
        tag: h5
        text: "Step 2 · 选择目标阶段"
      - type: form
        name: step2Form
        mode: normal
        body:
          - type: select
            name: toStageId
            label: "目标漏斗阶段"
            required: true
            source: ${stagesData?.items ?? []}
            valueField: id
            labelField: stageName
          - type: text
            tag: div
            className: text-muted
            text: "moveStage 按 ErpCrmStage.sequence 单向递增校验——目标阶段必须大于当前阶段。"
          - type: button
            label: "Step 3 · 确认转化（moveStage）"
            level: danger
            icon: "fa fa-check"
            actionType: ajax
            confirmText: "确认将线索转化到目标阶段？"
            api:
              url: '@mutation:ErpCrmLead__moveStage'
              method: post
              data:
                leadId: "${step1Form?.leadId}"
                toStageId: "${step2Form?.toStageId}"