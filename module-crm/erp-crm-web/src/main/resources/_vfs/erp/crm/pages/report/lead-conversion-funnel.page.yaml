# 线索转化漏斗表（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → html。
type: page
title: "线索转化漏斗表"
body:
  - type: form
    name: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: button
        label: "渲染报表"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        actionType: download
        api:
          url: /p/ErpCrmReport__download
          method: post
          responseType: blob
          data:
            reportName: "lead-conversion-funnel"
            renderType: "xlsx"
            data: {}
      - type: button
        label: "下载 PDF"
        actionType: download
        api:
          url: /p/ErpCrmReport__download
          method: post
          responseType: blob
          data:
            reportName: "lead-conversion-funnel"
            renderType: "pdf"
            data: {}

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpCrmReport__renderHtml'
      method: post
      data:
        reportName: "lead-conversion-funnel"
        data: {}

  - type: html
    className: m-3
    sanitize: false
    content: "${reportHtmlData ?? ''}"