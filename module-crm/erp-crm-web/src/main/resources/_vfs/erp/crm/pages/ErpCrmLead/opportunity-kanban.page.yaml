# CRM 商机看板（F13 非标准视图，plan 2026-07-22-0845-3 §Phase 1 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → 动态列渲染（按 ErpCrmStage 阶段分组）。
# 商机 = ErpCrmLead where leadType=OPPORTUNITY（CRM 不建模独立 Opportunity 实体）。
# 动态列：阶段从 ErpCrmStage 实体读取。
# 行级 row-action「移动到阶段」dialog 选目标 stage → 触发 ErpCrmLead__moveStage（既有 mutation，经 LeadProcessor 守卫 isWonStage/序列）。
# Phase 0 Explore (a) 降级裁决：不使用拖拽。isWonStage 列只读。
type: page
title: "商机看板"
remark: "商机（ErpCrmLead leadType=OPPORTUNITY 子集）按漏斗阶段（ErpCrmStage 动态列）展示。每列一个 crud，行级「移动到阶段」按钮经 ErpCrmLead__moveStage mutation 触发阶段切换。赢单阶段（isWonStage=true）列只读。"
i18nEn:
  title: "Opportunity Kanban"
  remark: "Opportunities (ErpCrmLead leadType=OPPORTUNITY subset) displayed by funnel stage (ErpCrmStage dynamic columns). One crud per column; the row-level \"Move to Stage\" button triggers stage switching via the ErpCrmLead__moveStage mutation. Columns whose stage is a won stage (isWonStage=true) are read-only."
body:
  - type: data-source
    name: stagesData
    action: ajax
    args:
      url: '@query:ErpCrmStage__findPage'
      method: post
      data:
        limit: 50
        orderBy: "sequence ASC"
      selection: id code stageName sequence isWonStage

  - type: button
    label: "刷新看板"
    i18nEn: "Refresh Kanban"
    icon: refresh-cw
    className: m-3
    onClick:
      action: refreshSource
      targetId: stagesData
      then:
        action: refreshSource
        targetId: opportunityData

  - type: data-source
    name: opportunityData
    action: ajax
    args:
      url: '@query:ErpCrmLead__findPage'
      method: post
      data:
        filter_leadType: "OPPORTUNITY"
        limit: 500
      selection: id code companyName expectedRevenue expectedCloseDate probability stageId

  - type: text
    className: m-3
    tag: div
    visibleOn: "${(stagesData?.items?.length || 0) === 0}"
    text: '<div class="alert alert-warning">尚未配置商机阶段（请先在「漏斗阶段」中维护 ErpCrmStage）</div>'
    i18nEn: '<div class="alert alert-warning">No opportunity stages configured yet (maintain ErpCrmStage under "Funnel Stages" first)</div>'

  - type: wrapper
    className: m-3
    body:
      - type: text
        tag: h4
        text: "商机看板"
        i18nEn: "Opportunity Kanban"
      - type: text
        tag: div
        className: text-muted
        text: "按 ErpCrmStage 阶段分组的商机列表。每列显示该阶段商机及操作。"
        i18nEn: "Opportunity list grouped by ErpCrmStage stage. Each column shows the opportunities of that stage with actions."

  - type: crud
    className: m-3
    title: "商机列表"
    i18nEn: "Opportunity List"
    source: ${opportunityData?.items ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: ["statistics"]
    columns:
      - name: code
        label: "商机号"
        i18nEn: "Opportunity No."
        width: 120
      - name: companyName
        label: "客户"
        i18nEn: "Customer"
        width: 160
      - name: stageId
        label: "阶段"
        i18nEn: "Stage"
        type: tpl
        tpl: "${stagesData?.items?.find(s => s.id === stageId)?.stageName || stageId}"
      - name: expectedRevenue
        label: "预期收入"
        i18nEn: "Expected Revenue"
        type: number
        kilometer: true
        precision: 2
      - name: expectedCloseDate
        label: "预期签单"
        i18nEn: "Expected Close Date"
        type: date
        format: "YYYY-MM-DD"
      - name: probability
        label: "成交概率%"
        i18nEn: "Win Probability%"
        type: tpl
        tpl: '<span class="label label-${probability >= 75 ? "success" : probability >= 50 ? "warning" : "default"}">${probability}%</span>'
      - type: operation
        label: "操作"
        i18nEn: "Actions"
        buttons:
          - type: button
            label: "移动到阶段"
            i18nEn: "Move to Stage"
            level: primary
            size: sm
            visibleOn: "${!stagesData?.items?.find(s => s.id === stageId)?.isWonStage}"
            actionType: dialog
            dialog:
              title: "移动商机到阶段"
              i18nEn: "Move Opportunity to Stage"
              body:
                type: form
                api:
                  method: post
                  url: '@mutation:ErpCrmLead__moveStage'
                  data:
                    leadId: "${id}"
                    toStageId: "${toStageId}"
                body:
                  - type: select
                    name: toStageId
                    label: "目标阶段"
                    required: true
                    source: ${stagesData?.items ?? []}
                    valueField: id
                    labelField: stageName
                    placeholder: "选择目标阶段（赢单阶段经后端守卫拒绝非法迁移）"
                    i18nEn:
                      label: "Target Stage"
                      placeholder: "Select target stage (invalid moves into won stages are rejected by the backend guard)"