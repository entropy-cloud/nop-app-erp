# CRM 活动时间线（F13 非标准视图，plan 2026-07-22-0845-3 §Phase 2 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → timeline。
# 数据源 ErpCrmActivity__findPage，按 activityDate 倒序。
# 注：实体实际字段为 activityDate（DATE），实现按真实字段名。
type: page
title: "活动时间线"
remark: "CRM 活动按活动日期（activityDate）倒序的纵向时间线。支持按 leadId 过滤。"
i18nEn:
  title: "Activity Timeline"
  remark: "Vertical timeline of CRM activities in descending activity date (activityDate) order. Supports filtering by leadId."
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: "筛选"
    i18nEn: "Filter"
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-number
        name: leadId
        label: "线索/商机ID"
        placeholder: "过滤关联线索"
        i18nEn:
          label: "Lead/Opportunity ID"
          placeholder: "Filter by related lead"
        clearable: true
      - type: button
        label: "刷新时间线"
        i18nEn: "Refresh Timeline"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: activitiesData

  - type: data-source
    name: activitiesData
    action: ajax
    args:
      url: '@query:ErpCrmActivity__findPage'
      method: post
      data:
        filter_leadId: "${filterForm?.leadId || null}"
        limit: 100
        orderBy: "activityDate DESC"
      selection: id activityType activityDate summary ownerId leadId lead.companyName

  - type: text
    className: m-3
    tag: div
    text: '<div class="text-muted">共 ${activitiesData?.total || 0} 条活动记录</div>'
    i18nEn: '<div class="text-muted">Total ${activitiesData?.total || 0} activity records</div>'

  - type: timeline
    className: m-3
    source: ${activitiesData?.items ?? []}
    items:
      - time: "${activityDate}"
        title: "${(activityType === 'CALL' ? '📞' : activityType === 'EMAIL' ? '✉️' : activityType === 'MEETING' ? '👥' : '📝')} ${lead?.companyName || ''}"
        detail: "${summary || ''}"
        color: "${activityType === 'CALL' ? '#3b82f6' : activityType === 'EMAIL' ? '#6b7280' : activityType === 'MEETING' ? '#10b981' : '#f59e0b'}"