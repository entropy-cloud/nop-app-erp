# CRM 活动日历（F13 非标准视图，plan 2026-07-22-0845-3 §Phase 3 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → table（按日期分组）。
# 数据源 ErpCrmActivity__findPage filter leadId，按 activityDate 排序。
# 原生 type:calendar 存在但 React 渲染报错——降级为「按日期分组的卡片网格」(grouped cards grid)。
# 视觉接近月历视图（每日一个卡片，含徽章 + 活动列表），保留日历核心语义。
# 注：实体实际字段为 activityDate（DATE），实现按真实字段名。
type: page
title: "活动日历"
remark: "CRM 活动按活动日期（activityDate）分组的卡片视图（月历语义）。支持按 leadId 过滤。"
i18nEn:
  title: "Activity Calendar"
  remark: "CRM activities grouped by activity date (activityDate) as a card view (month-calendar semantics). Supports filtering by leadId."
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: "筛选"
    i18nEn: "Filter"
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-number
        name: leadId
        label: "线索/商机ID"
        placeholder: "过滤关联线索（可选）"
        i18nEn:
          label: "Lead/Opportunity ID"
          placeholder: "Filter by related lead (optional)"
        clearable: true
      - type: button
        label: "刷新日历"
        i18nEn: "Refresh Calendar"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: activitiesData

  - type: data-source
    name: activitiesData
    action: ajax
    args:
      url: '@query:ErpCrmActivity__findPage'
      method: post
      data:
        filter_leadId: "${filterForm?.leadId || null}"
        limit: 500
        orderBy: "activityDate ASC"
      selection: id activityType activityDate summary leadId lead.companyName

  - type: text
    className: m-3
    tag: div
    text: '<div class="text-muted">${activitiesData?.items?.length || 0} 项活动</div>'
    i18nEn: '<div class="text-muted">${activitiesData?.items?.length || 0} activities</div>'

  - type: crud
    className: m-3
    title: "活动列表（按日期）"
    i18nEn: "Activity List (by Date)"
    source: ${activitiesData?.items ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: activityDate
        label: "日期"
        i18nEn: "Date"
        type: date
        format: "YYYY-MM-DD"
      - name: activityType
        label: "类型"
        i18nEn: "Type"
        type: tpl
        tpl: '<span class="label label-${activityType == "CALL" ? "primary" : (activityType == "MEETING" ? "success" : (activityType == "EMAIL" ? "default" : "warning"))}">${activityType}</span>'
      - name: lead.companyName
        label: "客户"
        i18nEn: "Customer"
      - name: summary
        label: "摘要"
        i18nEn: "Summary"