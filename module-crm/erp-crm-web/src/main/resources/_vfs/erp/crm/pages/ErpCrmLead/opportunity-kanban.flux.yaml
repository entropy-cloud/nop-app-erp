# CRM 商机看板（F13 flux 原生重写，plan 2026-08-03-1232-2 §Phase 1）。
# flux kanban 原生组件 + 后端 findOpportunityBoardData 聚合查询返回扁平图结构（动态列 ErpCrmStage）。
# 拖拽语义（Phase 0 Decision）：onCardMove 调用 ErpCrmLead__moveStage（LeadProcessor 守卫）。
type: page
title: 商机看板
i18nEn: "Opportunity Kanban"
body:
- type: data-source
  name: boardData
  dependsOn:
  - __board_load__
  action: ajax
  args:
    url: '@query:ErpCrmLead__findOpportunityBoardData'
    method: post
- type: button
  label: 刷新看板
  i18nEn: "Refresh Kanban"
  actionType: ajax
  action: ajax
  args:
    url: '@query:ErpCrmLead__findOpportunityBoardData'
    method: post
  target: boardData
  className: m-3
- type: kanban
  data: ${boardData}
  draggable: true
  columnWidth: 300
  cardTemplate:
  - type: text
    text: ${card.data.title}
    className: font-medium text-sm
  - type: text
    text: ${card.data.companyName ?? ""}
    className: text-xs text-gray-500
  - type: text
    # 货币符号走 i18nEn 双语承载（P3-CK-crm-024-r3：zh ¥ / en $，不再硬编码单语）
    text: '${card.data.expectedRevenue != null ? "¥" + card.data.expectedRevenue : ""}'
    i18nEn: '${card.data.expectedRevenue != null ? "$" + card.data.expectedRevenue : ""}'
    className: text-xs
  - type: status
    value: ${card.data.probability}
    labelMap: {90: 高概率, 50: 中概率}
    i18nEn:
      labelMap: {90: High Probability, 50: Medium Probability}
    levelMap:
      90: success
      50: warning
  onCardMove:
    action: ajax
    args:
      url: '@mutation:ErpCrmLead__moveStage'
      method: post
      data:
        # 前缀解耦（P3-CK-crm-024-r3）：按前缀 token 剥离（replace），不再耦合 flux 内部 id 前缀长度
        # （原 cardId.substring(5)/toColumnId.substring(4) 在前缀变更时静默错参）
        leadId: ${event.cardId.replace("card-", "")}
        toStageId: ${event.toColumnId.replace("col-", "")}
  onCardClick:
    action: showToast
    args:
      level: info
      message: ${"点击商机 " + event.cardId}
      i18nEn: '${"Clicked opportunity " + event.cardId}'
