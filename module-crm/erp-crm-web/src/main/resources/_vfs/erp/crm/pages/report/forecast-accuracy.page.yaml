# 销售预测准确率表（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → html。
type: page
title: "销售预测准确率表"
body:
  - type: form
    name: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-number
        name: forecastId
        label: "销售预测ID"
        placeholder: "输入预测方案ID（留空聚合全部）"
      - type: button
        label: "渲染报表"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        actionType: download
        api:
          url: /p/ErpCrmReport__download
          method: post
          responseType: blob
          data:
            reportName: "forecast-accuracy"
            renderType: "xlsx"
            data:
              forecastId: "${filterForm?.forecastId}"
      - type: button
        label: "下载 PDF"
        actionType: download
        api:
          url: /p/ErpCrmReport__download
          method: post
          responseType: blob
          data:
            reportName: "forecast-accuracy"
            renderType: "pdf"
            data:
              forecastId: "${filterForm?.forecastId}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpCrmReport__renderHtml'
      method: post
      data:
        reportName: "forecast-accuracy"
        data:
          forecastId: "${filterForm?.forecastId}"

  - type: html
    className: m-3
    html: "${reportHtmlData ?? ''}"