# 资产概览 dashboard（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + chart + crud。
# 数据源：ErpAstDashboard__getDashboardKpi / __getAssetCategoryDistribution / __getDashboardTrend / __findDepreciationMissingAlert。
type: page
title: "资产概览"
body:
  - type: form
    name: filterForm
    title: ""
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-text
        name: periodId
        label: "会计期间"
        placeholder: "如 2026-07，留空=本月"
        clearable: true
      - type: button
        label: "刷新"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: kpiData
          then:
            action: refreshSource
            targetId: categoryData
          then:
            action: refreshSource
            targetId: trendData
          then:
            action: refreshSource
            targetId: depreciationMissingData

  - type: data-source
    name: kpiData
    action: ajax
    args:
      url: '@query:ErpAstDashboard__getDashboardKpi'
      method: post
      data:
        periodId: "${filterForm?.periodId || null}"
      selection: originalValue accumulatedDepreciation netBookValue periodDepreciation cipBalance

  - type: grid
    className: m-3
    gap: sm
    columns: 5
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "资产原值合计"
              - type: text
                tag: span
                className: h3 text-primary
                text: "¥${ROUND((kpiData?.originalValue ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "累计折旧"
              - type: text
                tag: span
                className: h3 text-danger
                text: "¥${ROUND((kpiData?.accumulatedDepreciation ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "资产净值"
              - type: text
                tag: span
                className: h3 font-bold
                text: "¥${ROUND((kpiData?.netBookValue ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "本期折旧"
              - type: text
                tag: span
                className: h3 text-warning
                text: "¥${ROUND((kpiData?.periodDepreciation ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "在建工程余额"
              - type: text
                tag: span
                className: h3
                text: "¥${ROUND((kpiData?.cipBalance ?? 0), 2)}"

  - type: data-source
    name: categoryData
    action: ajax
    args:
      url: '@query:ErpAstDashboard__getAssetCategoryDistribution'
      selection: categoryId categoryName netBookValue

  - type: chart
    chartType: pie
    title: "资产类别分布（按净值）"
    source: ${categoryData ?? []}
    height: 300
    series:
      - { name: "净值", dataRegionKey: netBookValue, nameField: categoryName }

  - type: data-source
    name: trendData
    action: ajax
    args:
      url: '@query:ErpAstDashboard__getDashboardTrend'
      method: post
      data:
        months: 12
      selection: period depreciationAmount
  - type: chart
    chartType: line
    title: "折旧趋势（近12月）"
    source: ${trendData ?? []}
    xAxis: { dataKey: period }
    yAxis: { label: "折旧额" }
    legend: true
    height: 300
    series:
      - { name: "折旧额", dataRegionKey: depreciationAmount }

  - type: data-source
    name: depreciationMissingData
    action: ajax
    args:
      url: '@query:ErpAstDashboard__findDepreciationMissingAlert'
      selection: assetCode assetName period originalValue

  - type: crud
    className: m-3
    title: "折旧未计提预警（在用资产本期无 EXECUTED 折旧计划）"
    source: ${depreciationMissingData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: assetCode
        label: "资产编码"
      - name: assetName
        label: "资产名称"
      - name: period
        label: "期间"
      - name: originalValue
        label: "原值"