# 资产盘点工作台（plan 2026-08-03-1232-4 Phase 3）。
# 数据来源：ErpAstInventory 实体 findPage（资产盘点单）。零后端 delta。
type: page
title: "资产盘点"
body:
  - type: service
    name: kpiService
    className: m-3
    api:
      url: /graphql
      method: post
      dataType: raw
      data:
        query: "query(${'$'}lim:Int){ ErpAstInventory__findPage(query:{limit:${'$'}lim}){ items{ id status } total } }"
        variables:
          lim: 500
      adaptor: |
        const d = payload.data || {};
        const gql = d.data ? d.data : d;
        const page = gql.ErpAstInventory__findPage || { items: [], total: 0 };
        const rows = page.items || [];
        const draft = rows.filter(function(r){ return (r.status||'') === 'DRAFT'; }).length;
        const done = rows.filter(function(r){ return (r.status||'') === 'DONE'; }).length;
        return { status: 0, msg: '', data: { count: rows.length, draft: draft, done: done } };
    body:
      - type: grid
        className: m-3
        gap: 'sm'
        columns:
          - type: wrapper
            className: "border rounded p-3"
            body:
              - { type: tpl, tpl: "<div class='text-muted'>盘点单数</div>" }
              - { type: tpl, tpl: "<span class='h3'>${count}</span>" }
          - type: wrapper
            className: "border rounded p-3"
            body:
              - { type: tpl, tpl: "<div class='text-muted'>待盘点</div>" }
              - { type: tpl, tpl: "<span class='h3 text-warning'>${draft}</span>" }
          - type: wrapper
            className: "border rounded p-3"
            body:
              - { type: tpl, tpl: "<div class='text-muted'>已完成</div>" }
              - { type: tpl, tpl: "<span class='h3 text-success'>${done}</span>" }

  - type: crud
    name: stocktakeCrud
    className: m-3
    title: "资产盘点单列表"
    syncLocation: false
    api:
      url: /graphql
      method: post
      dataType: raw
      data:
        query: "query(${'$'}lim:Int){ ErpAstInventory__findPage(query:{limit:${'$'}lim}){ items{ id code name orgId status rangeDepartmentId rangeCategoryId rangeLocationId responsibleById businessDate } total } }"
        variables:
          lim: 200
      adaptor: |
        const d = payload.data || {};
        const gql = d.data ? d.data : d;
        const page = gql.ErpAstInventory__findPage || { items: [], total: 0 };
        return { status: 0, msg: '', data: { items: page.items || [], count: page.total || 0 } };
    columns:
      - { name: code, label: "单号" }
      - { name: name, label: "名称" }
      - { name: orgId, label: "所属组织" }
      - name: status
        label: "状态"
        type: tpl
        tpl: '${status == "DRAFT" ? "<span class=\"label label-default\">待盘点</span>" : (status == "IN_PROGRESS" ? "<span class=\"label label-warning\">盘点中</span>" : (status == "DONE" ? "<span class=\"label label-success\">已完成</span>" : "<span class=\"label\">" + (status||"—") + "</span>"))}'
      - { name: rangeDepartmentId, label: "盘点部门" }
      - { name: rangeCategoryId, label: "盘点类别" }
      - { name: responsibleById, label: "负责人" }
      - { name: businessDate, label: "业务日期" }
