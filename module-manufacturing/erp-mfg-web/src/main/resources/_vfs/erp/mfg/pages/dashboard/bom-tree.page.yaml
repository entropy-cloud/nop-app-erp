# BOM 多级展开树（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → tree 控件。
# 数据源：ErpMfgBom__explode(bomId, qty, useMultiLevel) 返回扁平 List<BomExplosionNode>。
# phantom（bomType=20）已被 BomExpander 在展开时合并，前端无需特殊处理。
type: page
title: "BOM 多级展开树"
remark: "BOM 多级展开树浏览。调 ErpMfgBom__explode 获取扁平 List，含 level/materialId/quantity/manufactured。"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: "展开参数"
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-number
        name: bomId
        label: "BOM ID"
        placeholder: "输入要展开的 BOM 主键"
        required: true
        clearable: true
      - type: input-number
        name: qty
        label: "期望产出量"
        placeholder: "留空=BOM 标准批量"
        clearable: true
      - type: switch
        name: useMultiLevel
        label: "多级展开"
        value: true
        onText: "是"
        offText: "否（仅单级）"
      - type: button
        label: "展开 BOM"
        icon: git-branch
        onClick:
          action: refreshSource
          targetId: explodeData

  - type: data-source
    name: explodeData
    action: ajax
    args:
      url: '@query:ErpMfgBom__explode'
      method: post
      data:
        bomId: "${filterForm?.bomId || null}"
        qty: "${filterForm?.qty || null}"
        useMultiLevel: "${filterForm?.useMultiLevel != null ? filterForm?.useMultiLevel : true}"
      selection: level materialId quantity operationId manufactured sourceBomId

  - type: text
    className: m-3
    tag: div
    visibleOn: "${!explodeData || (explodeData?.length || 0) === 0}"
    text: '<div class="text-muted p-3">请输入 BOM ID 后点击「展开 BOM」。若已点击仍无数据，可能该 BOM 无明细行或不存在。</div>'

  - type: text
    className: m-3
    tag: div
    visibleOn: "${(explodeData?.length || 0) > 0}"
    text: '<div class="text-muted m-b-sm">展开节点数：${explodeData?.length || 0}</div>'

  - type: tree
    className: m-3
    visibleOn: "${(explodeData?.length || 0) > 0}"
    title: "BOM 树"
    source: ${explodeData ?? []}
    labelField: materialId
    keyField: materialId
    childrenKey: children
    showOutline: true
    initiallyOpen: 1