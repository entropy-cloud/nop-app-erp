# CRP 负荷报表（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → html。
type: page
title: "CRP 负荷报表"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-number
        name: workcenterId
        label: "工作中心ID"
        placeholder: "留空查询全部工作中心"
      - type: input-date
        name: startDate
        label: "开始日期"
        valueFormat: YYYY-MM-DD
      - type: input-date
        name: endDate
        label: "结束日期"
        valueFormat: YYYY-MM-DD
      - type: button
        label: "渲染报表"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        actionType: download
        api:
          url: /p/ErpMfgReport__download
          method: post
          responseType: blob
          data:
            reportName: "crp-load-report"
            renderType: "xlsx"
            data:
              workcenterId: "${filterForm?.workcenterId}"
              startDate: "${filterForm?.startDate}"
              endDate: "${filterForm?.endDate}"
      - type: button
        label: "下载 PDF"
        actionType: download
        api:
          url: /p/ErpMfgReport__download
          method: post
          responseType: blob
          data:
            reportName: "crp-load-report"
            renderType: "pdf"
            data:
              workcenterId: "${filterForm?.workcenterId}"
              startDate: "${filterForm?.startDate}"
              endDate: "${filterForm?.endDate}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpMfgReport__renderHtml'
      method: post
      data:
        reportName: "crp-load-report"
        data:
          workcenterId: "${filterForm?.workcenterId}"
          startDate: "${filterForm?.startDate}"
          endDate: "${filterForm?.endDate}"

  - type: html
    className: m-3
    html: "${reportHtmlData ?? ''}"