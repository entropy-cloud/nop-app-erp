# 生产差异报表（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → html。
type: page
title: "生产差异报表"
i18nEn: "Production Variance Report"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-number
        name: workOrderId
        label: "工单ID"
        placeholder: "留空查询全部工单"
        i18nEn:
          label: "Work Order ID"
          placeholder: "blank to query all work orders"
      - type: input-date
        name: startDate
        label: "开始日期"
        i18nEn: "Start Date"
        valueFormat: YYYY-MM-DD
      - type: input-date
        name: endDate
        label: "结束日期"
        i18nEn: "End Date"
        valueFormat: YYYY-MM-DD
      - type: button
        label: "渲染报表"
        i18nEn: "Render Report"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        i18nEn: "Download XLSX"
        actionType: download
        api:
          url: /p/ErpMfgReport__download
          method: post
          responseType: blob
          data:
            reportName: "production-variance-report"
            renderType: "xlsx"
            data:
              workOrderId: "${filterForm?.workOrderId}"
              startDate: "${filterForm?.startDate}"
              endDate: "${filterForm?.endDate}"
      - type: button
        label: "下载 PDF"
        i18nEn: "Download PDF"
        actionType: download
        api:
          url: /p/ErpMfgReport__download
          method: post
          responseType: blob
          data:
            reportName: "production-variance-report"
            renderType: "pdf"
            data:
              workOrderId: "${filterForm?.workOrderId}"
              startDate: "${filterForm?.startDate}"
              endDate: "${filterForm?.endDate}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpMfgReport__renderHtml'
      method: post
      data:
        reportName: "production-variance-report"
        data:
          workOrderId: "${filterForm?.workOrderId}"
          startDate: "${filterForm?.startDate}"
          endDate: "${filterForm?.endDate}"

  - type: html
    className: m-3
    sanitize: false
    content: "${reportHtmlData ?? ''}"
