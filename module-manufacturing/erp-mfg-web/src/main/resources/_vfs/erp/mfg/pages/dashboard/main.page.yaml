# 制造概览 dashboard（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + chart + crud。
# 数据源：ErpMfgDashboard__getDashboardKpi / __getWorkOrderStatusDistribution / __getDashboardTrend
#       / __getCrpLoadChartData / __findDelayedWorkOrderAlert。
type: page
title: "制造概览"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-date
        name: startDate
        label: "开始日期"
        format: YYYY-MM-DD
        placeholder: "留空=本月1日"
        clearable: true
      - type: input-date
        name: endDate
        label: "结束日期"
        format: YYYY-MM-DD
        placeholder: "留空=今天"
        clearable: true
      - type: input-text
        name: workcenterId
        label: "工作中心ID"
        placeholder: "留空=全部"
        clearable: true
      - type: button
        label: "刷新"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: kpiData
          then:
            action: refreshSource
            targetId: statusData
          then:
            action: refreshSource
            targetId: trendData
          then:
            action: refreshSource
            targetId: crpLoadData
          then:
            action: refreshSource
            targetId: delayedWorkOrderData

  - type: data-source
    name: kpiData
    action: ajax
    args:
      url: '@query:ErpMfgDashboard__getDashboardKpi'
      method: post
      data:
        startDate: "${filterForm?.startDate || null}"
        endDate: "${filterForm?.endDate || null}"
      selection: inProcessCount periodCompletedQty onTimeRate stockPartialCount

  - type: grid
    className: m-3
    gap: sm
    columns: 4
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "在制工单数"
              - type: text
                tag: span
                className: h3 font-bold
                text: "${kpiData?.inProcessCount ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "本期完工量"
              - type: text
                tag: span
                className: h3 text-success
                text: "${ROUND((kpiData?.periodCompletedQty ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "工单准时率"
              - type: text
                tag: span
                className: h3 text-primary
                text: "${ROUND((kpiData?.onTimeRate ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "齐套待产"
              - type: text
                tag: span
                className: h3 text-warning
                text: "${kpiData?.stockPartialCount ?? 0}"

  - type: data-source
    name: statusData
    action: ajax
    args:
      url: '@query:ErpMfgDashboard__getWorkOrderStatusDistribution'
      selection: status count

  - type: chart
    chartType: pie
    title: "工单状态分布"
    source: ${statusData ?? []}
    height: 300
    series:
      - { name: "工单数", dataRegionKey: count, nameField: status }

  - type: data-source
    name: trendData
    action: ajax
    args:
      url: '@query:ErpMfgDashboard__getDashboardTrend'
      method: post
      data:
        months: 12
      selection: month completedQty

  - type: chart
    chartType: line
    title: "产成品产出趋势（近12月）"
    source: ${trendData ?? []}
    xAxis: { dataKey: month }
    yAxis: { label: "完工量" }
    legend: true
    height: 300
    series:
      - { name: "完工量", dataRegionKey: completedQty }

  - type: data-source
    name: crpLoadData
    action: ajax
    args:
      url: '@query:ErpMfgDashboard__getCrpLoadChartData'
      method: post
      data:
        workcenterId: "${filterForm?.workcenterId || null}"
        dateFrom: "${filterForm?.dateFrom || null}"
        dateTo: "${filterForm?.dateTo || null}"
      selection: overallLoadRate series

  - type: chart
    chartType: bar
    title: "CRP 负荷/产能对比图"
    source: ${crpLoadData?.series ?? []}
    xAxis: { dataKey: loadDate }
    yAxis: { label: "工时" }
    legend: true
    height: 300
    series:
      - { name: "负荷工时", dataRegionKey: loadHours }
      - { name: "产能工时", dataRegionKey: capacityHours }

  - type: data-source
    name: delayedWorkOrderData
    action: ajax
    args:
      url: '@query:ErpMfgDashboard__findDelayedWorkOrderAlert'
      selection: workOrderCode plannedEndDate docStatus overdueDays

  - type: crud
    className: m-3
    title: "工单延期预警（计划完成日 < 今天 且 未完工）"
    source: ${delayedWorkOrderData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: workOrderCode
        label: "工单编码"
      - name: plannedEndDate
        label: "计划完成日"
      - name: docStatus
        label: "状态"
      - name: overdueDays
        label: "逾期(天)"