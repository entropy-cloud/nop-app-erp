# 预测差异报表（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → html。
type: page
title: "预测差异报表"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-number
        name: materialId
        label: "物料ID"
        placeholder: "留空查询全部物料"
      - type: input-date
        name: periodStart
        label: "区间起"
        valueFormat: YYYY-MM-DD
      - type: input-date
        name: periodEnd
        label: "区间止"
        valueFormat: YYYY-MM-DD
      - type: button
        label: "渲染报表"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        actionType: download
        api:
          url: /p/ErpMfgReport__download
          method: post
          responseType: blob
          data:
            reportName: "forecast-variance-report"
            renderType: "xlsx"
            data:
              materialId: "${filterForm?.materialId}"
              periodStart: "${filterForm?.periodStart}"
              periodEnd: "${filterForm?.periodEnd}"
      - type: button
        label: "下载 PDF"
        actionType: download
        api:
          url: /p/ErpMfgReport__download
          method: post
          responseType: blob
          data:
            reportName: "forecast-variance-report"
            renderType: "pdf"
            data:
              materialId: "${filterForm?.materialId}"
              periodStart: "${filterForm?.periodStart}"
              periodEnd: "${filterForm?.periodEnd}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpMfgReport__renderHtml'
      method: post
      data:
        reportName: "forecast-variance-report"
        data:
          materialId: "${filterForm?.materialId}"
          periodStart: "${filterForm?.periodStart}"
          periodEnd: "${filterForm?.periodEnd}"

  - type: html
    className: m-3
    html: "${reportHtmlData ?? ''}"