# drp 净需求计算报表（F16 P2 复杂页面，plan 2026-07-22-1400-2 §Phase 3 + plan 2026-08-29-1913-1 Phase 1）。
# flux 原生重写：data-source → table（明细）+ 派生汇总（formula 派生）。
# 数据源：ErpDrpLine__findPage filter planId + ErpDrpPlan__get。
# 字段名经实时仓库核实：ErpDrpLine 全部正确（planId/materialId/safetyStock/forecastDemand/currentStock/
# allocatedQty/onOrderQty/netRequirement/suggestedQty/replenishmentType）。ErpDrpPlan.code（非 planCode）。
# Σ 公式：safetyStock + forecastDemand − currentStock + allocatedQty − onOrderQty = netRequirement
type: page
title: "净需求计算报表"
remark: "选择 DRP 计划后，展示 ErpDrpLine 净需求明细。每行包含 Σ 公式字段 + 建议补货量（suggestedQty）+ 补货类型（replenishmentType）。"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: "计划选择"
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-number
        name: planId
        label: "DRP计划ID"
        placeholder: "输入 DRP 计划主键"
        required: true
        clearable: true
      - type: button
        label: "加载净需求"
        icon: calculator
        onClick:
          action: refreshSource
          targetId: linesData
          then:
            action: refreshSource
            targetId: planInfo

  - type: data-source
    name: planInfo
    action: ajax
    args:
      url: '@query:ErpDrpPlan__get'
      method: post
      data:
        id: "${filterForm?.planId || null}"
      selection: id code planName status periodFrom periodTo

  - type: data-source
    name: linesData
    action: ajax
    args:
      url: '@query:ErpDrpLine__findPage'
      method: post
      data:
        query:
          limit: 5000
          filter:
            planId: "${filterForm?.planId || null}"
      selection: id planId materialId warehouseId safetyStock forecastDemand currentStock allocatedQty onOrderQty netRequirement suggestedQty replenishmentType status

  - type: text
    className: m-3
    tag: div
    visibleOn: "${planInfo}"
    text: '<div class="panel panel-default"><div class="panel-body"><strong>${planInfo?.code || "—"}</strong> · ${planInfo?.planName || ""} · 状态: ${planInfo?.status || "—"} · 周期: ${planInfo?.periodFrom || "—"} ~ ${planInfo?.periodTo || "—"}</div></div>'

  - type: text
    className: m-3
    tag: div
    visibleOn: "${!linesData?.items?.length}"
    text: '<div class="text-muted p-3">请输入有效的 DRP 计划ID 后点击「加载净需求」。若无数据，说明该计划尚未运行 DrpEngine.runDrp 计算。</div>'

  - type: crud
    className: m-3
    title: "净需求明细"
    source: ${linesData?.items ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: materialId
        label: "物料ID"
      - name: warehouseId
        label: "仓库"
      - name: safetyStock
        label: "安全库存"
        type: number
        precision: 2
      - name: forecastDemand
        label: "预测需求"
        type: number
        precision: 2
      - name: currentStock
        label: "当前库存"
        type: number
        precision: 2
      - name: allocatedQty
        label: "已分配"
        type: number
        precision: 2
      - name: onOrderQty
        label: "在途"
        type: number
        precision: 2
      - name: netRequirement
        label: "净需求"
        type: tpl
        tpl: '<span class="label label-${netRequirement > 0 ? "danger" : "success"}">${netRequirement}</span>'
      - name: suggestedQty
        label: "建议补货量"
        type: number
        precision: 2
      - name: replenishmentType
        label: "补货类型"
        type: tpl
        tpl: '<span class="label label-${replenishmentType == "PURCHASE" ? "primary" : "info"}">${replenishmentType == "PURCHASE" ? "采购" : (replenishmentType == "TRANSFER" ? "调拨" : replenishmentType)}</span>'
      - name: status
        label: "状态"