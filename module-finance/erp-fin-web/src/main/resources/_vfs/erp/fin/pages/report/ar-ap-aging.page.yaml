# 应收应付账龄（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → html。
type: page
title: "应收应付账龄"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-date
        name: asOfDate
        label: "账龄基准日"
        value: "${NOW()}"
        valueFormat: "YYYY-MM-DD"
      - type: button
        label: "渲染报表"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        actionType: download
        api:
          url: /p/ErpFinReport__download
          method: post
          responseType: blob
          data:
            reportName: "ar-ap-aging"
            renderType: "xlsx"
            data:
              asOfDate: "${filterForm?.asOfDate}"
      - type: button
        label: "下载 PDF"
        actionType: download
        api:
          url: /p/ErpFinReport__download
          method: post
          responseType: blob
          data:
            reportName: "ar-ap-aging"
            renderType: "pdf"
            data:
              asOfDate: "${filterForm?.asOfDate}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpFinReport__renderHtml'
      method: post
      data:
        reportName: "ar-ap-aging"
        data:
          asOfDate: "${filterForm?.asOfDate}"

  - type: html
    className: m-3
    html: "${reportHtmlData ?? ''}"