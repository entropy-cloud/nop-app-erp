# 银行对账单工作台（plan 2026-08-03-1232-4 Phase 1 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + crud。
# 数据来源：ErpFinBankStatement 实体 findPage。零后端 delta。
type: page
title: "银行对账单"
body:
  - type: data-source
    name: statementData
    action: ajax
    args:
      url: '@query:ErpFinBankStatement__findPage'
      method: post
      data:
        query:
          limit: 200
      selection: id code orgId fundAccountId statementDate beginningBalance endingBalance totalDebit totalCredit docStatus

  - type: grid
    className: m-3
    gap: sm
    columns: 3
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "对账单数"
              - type: text
                tag: span
                className: h3
                text: "${statementData?.items?.length ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "借方合计"
              - type: text
                tag: span
                className: h3 text-success
                text: "¥${ROUND(((statementData?.items ?? []).reduce((s, r) => s + (Number(r.totalDebit) || 0), 0) ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "贷方合计"
              - type: text
                tag: span
                className: h3 text-danger
                text: "¥${ROUND(((statementData?.items ?? []).reduce((s, r) => s + (Number(r.totalCredit) || 0), 0) ?? 0), 2)}"

  - type: crud
    name: statementCrud
    className: m-3
    title: "对账单列表"
    source: ${statementData?.items ?? []}
    syncLocation: false
    columns:
      - { name: code, label: "单号" }
      - { name: orgId, label: "业务组织" }
      - { name: fundAccountId, label: "资金账户" }
      - { name: statementDate, label: "对账单日期" }
      - { name: beginningBalance, label: "期初余额" }
      - { name: endingBalance, label: "期末余额" }
      - { name: totalDebit, label: "借方合计" }
      - { name: totalCredit, label: "贷方合计" }
      - { name: docStatus, label: "状态" }