# 财务概览 dashboard（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + chart + crud。
# 数据源：ErpFinDashboard__getDashboardKpi / __getDashboardTrend / __findCashFlowAlert。
type: page
title: "财务概览"
i18nEn: "Finance Overview"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    wrapWithPanel: false
    className: m-3 erp-dashboard-filter
    body:
      - type: input-number
        name: periodId
        label: "会计期间ID"
        placeholder: "留空=全部期间"
        i18nEn:
          label: "Accounting Period ID"
          placeholder: "Blank = all periods"
        clearable: true
        size: sm
        style:
          maxWidth: 240px
      - type: button
        label: "刷新"
        i18nEn: "Refresh"
        icon: refresh-cw
        level: primary
        size: sm
        onClick:
          action: refreshSource
          targetId: kpiData
          then:
            action: refreshSource
            targetId: trendData
          then:
            action: refreshSource
            targetId: cashFlowData
        style:
          marginLeft: 8px

  - type: data-source
    name: kpiData
    action: ajax
    args:
      url: '@query:ErpFinDashboard__getDashboardKpi'
      method: post
      data:
        periodId: "${filterForm?.periodId || null}"
      selection: revenue expense netProfit bankBalance arBalance apBalance

  - type: grid
    className: m-3
    gap: sm
    columns: 6
    items:
      - colSpan: 1
        body:
          - type: card
            className: bg-white border rounded shadow-sm p-3 erp-kpi-card
            body:
              - type: text
                tag: div
                className: text-muted
                text: "本期收入"
                i18nEn: "Revenue (Period)"
              - type: text
                tag: div
                className: h3 m-t-xs m-b-0 text-success
                text: "¥${ROUND((kpiData?.revenue ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: bg-white border rounded shadow-sm p-3 erp-kpi-card
            body:
              - type: text
                tag: div
                className: text-muted
                text: "本期支出"
                i18nEn: "Expense (Period)"
              - type: text
                tag: div
                className: h3 m-t-xs m-b-0 text-danger
                text: "¥${ROUND((kpiData?.expense ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: bg-white border rounded shadow-sm p-3 erp-kpi-card
            body:
              - type: text
                tag: div
                className: text-muted
                text: "本期净利润"
                i18nEn: "Net Profit (Period)"
              - type: text
                tag: div
                className: h3 m-t-xs m-b-0 font-bold
                text: "¥${ROUND((kpiData?.netProfit ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: bg-white border rounded shadow-sm p-3 erp-kpi-card
            body:
              - type: text
                tag: div
                className: text-muted
                text: "银行存款余额"
                i18nEn: "Bank Balance"
              - type: text
                tag: div
                className: h3 m-t-xs m-b-0
                text: "¥${ROUND((kpiData?.bankBalance ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: bg-white border rounded shadow-sm p-3 erp-kpi-card
            body:
              - type: text
                tag: div
                className: text-muted
                text: "应收余额"
                i18nEn: "AR Balance"
              - type: text
                tag: div
                className: h3 m-t-xs m-b-0 text-primary
                text: "¥${ROUND((kpiData?.arBalance ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: bg-white border rounded shadow-sm p-3 erp-kpi-card
            body:
              - type: text
                tag: div
                className: text-muted
                text: "应付余额"
                i18nEn: "AP Balance"
              - type: text
                tag: div
                className: h3 m-t-xs m-b-0 text-warning
                text: "¥${ROUND((kpiData?.apBalance ?? 0), 2)}"

  - type: data-source
    name: trendData
    action: ajax
    args:
      url: '@query:ErpFinDashboard__getDashboardTrend'
      method: post
      data:
        months: 12
      selection: month revenue expense netProfit
  - type: chart
    chartType: line
    title: "收支与利润趋势（近12月）"
    source: ${trendData ?? []}
    xAxis: { dataKey: month }
    yAxis: { label: "金额" }
    i18nEn:
      title: "Income/Expense & Profit Trend (Last 12 Months)"
      yAxis: "Amount"
    legend: true
    height: 300
    series:
      - dataRegionKey: revenue
        name: "收入"
        i18nEn: "Revenue"
      - dataRegionKey: expense
        name: "支出"
        i18nEn: "Expense"
      - dataRegionKey: netProfit
        name: "净利润"
        i18nEn: "Net Profit"

  - type: data-source
    name: cashFlowData
    action: ajax
    args:
      url: '@query:ErpFinDashboard__findCashFlowAlert'
      method: post
      selection: alertType bankBalance threshold shortfall
  - type: crud
    className: m-3 erp-alert-card
    title: "现金流预警"
    i18nEn: "Cash Flow Alert"
    source: ${cashFlowData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: alertType
        label: "预警类型"
        i18nEn: "Alert Type"
      - name: bankBalance
        label: "银行余额"
        i18nEn: "Bank Balance"
      - name: threshold
        label: "阈值"
        i18nEn: "Threshold"
      - name: shortfall
        label: "缺口"
        i18nEn: "Shortfall"