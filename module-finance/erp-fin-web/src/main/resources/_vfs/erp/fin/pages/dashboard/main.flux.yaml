# 财务概览 dashboard（plan 2026-08-28-1600-1 Phase 1）。
# flux 原生重写：service → data-source + chart（recharts declarative）+ crud。
# 数据源：ErpFinDashboard__getDashboardKpi / __getDashboardTrend / __findCashFlowAlert。
type: page
title: 财务概览
body:
- type: form
  name: filterForm
  valuesPath: filterForm
  title: ""
  mode: inline
  wrapWithPanel: false
  className: m-3
  body:
  - type: input-number
    name: periodId
    label: 会计期间ID
    placeholder: 留空=全部期间
    clearable: true
    size: sm
    style:
      maxWidth: 240px
  - type: button
    label: 刷新
    icon: refresh-cw
    level: primary
    size: sm
    onClick:
      action: refreshSource
      targetId: kpiData
      then:
        action: refreshSource
        targetId: trendData
        then:
          action: refreshSource
          targetId: cashFlowData
    style:
      marginLeft: 8px
- type: data-source
  name: kpiData
  action: ajax
  args:
    url: '@query:ErpFinDashboard__getDashboardKpi'
    method: post
    data:
      periodId: "${filterForm?.periodId || null}"
    selection: revenue expense netProfit bankBalance arBalance apBalance
- type: grid
  className: m-3
  gap: sm
  columns: 6
  items:
  - colSpan: 1
    body:
    - type: card
      className: bg-white border rounded shadow-sm p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 本期收入
      - type: text
        tag: h3
        className: m-t-xs m-b-0 text-success
        text: "¥${ROUND((kpiData?.revenue ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: bg-white border rounded shadow-sm p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 本期支出
      - type: text
        tag: h3
        className: m-t-xs m-b-0 text-danger
        text: "¥${ROUND((kpiData?.expense ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: bg-white border rounded shadow-sm p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 本期净利润
      - type: text
        tag: h3
        className: m-t-xs m-b-0 font-bold
        text: "¥${ROUND((kpiData?.netProfit ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: bg-white border rounded shadow-sm p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 银行存款余额
      - type: text
        tag: h3
        className: m-t-xs m-b-0
        text: "¥${ROUND((kpiData?.bankBalance ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: bg-white border rounded shadow-sm p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 应收余额
      - type: text
        tag: h3
        className: m-t-xs m-b-0 text-primary
        text: "¥${ROUND((kpiData?.arBalance ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: bg-white border rounded shadow-sm p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 应付余额
      - type: text
        tag: h3
        className: m-t-xs m-b-0 text-warning
        text: "¥${ROUND((kpiData?.apBalance ?? 0), 2)}"
- type: data-source
  name: trendData
  action: ajax
  args:
    url: '@query:ErpFinDashboard__getDashboardTrend'
    method: post
    data:
      months: 12
    selection: month revenue expense netProfit
- type: chart
  chartType: line
  title: 收支与利润趋势（近12月）
  source: ${trendData ?? []}
  xAxis: { dataKey: month }
  yAxis: { label: 金额 }
  legend: true
  height: 300
  series:
  - { name: 收入, dataRegionKey: revenue }
  - { name: 支出, dataRegionKey: expense }
  - { name: 净利润, dataRegionKey: netProfit }
- type: data-source
  name: cashFlowData
  action: ajax
  args:
    url: '@query:ErpFinDashboard__findCashFlowAlert'
    method: post
    selection: alertType bankBalance threshold shortfall
- type: crud
  title: 现金流预警
  source: ${cashFlowData}
  syncLocation: false
  headerToolbar: []
  footerToolbar: []
  columns:
  - name: alertType
    label: 预警类型
  - name: bankBalance
    label: 银行余额
    type: number
    precision: 2
  - name: threshold
    label: 阈值
    type: number
    precision: 2
  - name: shortfall
    label: 缺口
    type: number
    precision: 2
