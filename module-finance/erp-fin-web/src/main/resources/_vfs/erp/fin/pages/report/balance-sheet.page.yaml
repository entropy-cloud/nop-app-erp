# 资产负债表（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → html。
# 数据源：ErpFinReport__renderHtml。
# 下载按钮保留 /p/{ErpFinReport__download} 路径（plan 2026-07-12-0413-1 已修复）。
type: page
title: "资产负债表"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-number
        name: periodId
        label: "会计期间ID"
        placeholder: "输入期间ID"
        value: 1
      - type: button
        label: "渲染报表"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        actionType: download
        api:
          url: /p/ErpFinReport__download
          method: post
          responseType: blob
          data:
            reportName: "balance-sheet"
            renderType: "xlsx"
            data:
              periodId: "${filterForm?.periodId}"
      - type: button
        label: "下载 PDF"
        actionType: download
        api:
          url: /p/ErpFinReport__download
          method: post
          responseType: blob
          data:
            reportName: "balance-sheet"
            renderType: "pdf"
            data:
              periodId: "${filterForm?.periodId}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpFinReport__renderHtml'
      method: post
      data:
        reportName: "balance-sheet"
        data:
          periodId: "${filterForm?.periodId}"

  - type: html
    className: m-3
    sanitize: false
    content: "${reportHtmlData ?? ''}"