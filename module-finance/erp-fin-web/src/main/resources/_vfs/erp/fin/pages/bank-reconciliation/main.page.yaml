# 余额调节表工作台（plan 2026-08-03-1232-4 Phase 1 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + crud。
# 数据来源：ErpFinBankReconciliation 实体 findPage（generate/post/reverse 链已实现）。零后端 delta。
type: page
title: "余额调节表"
i18nEn: "Bank Reconciliation"
body:
  - type: data-source
    name: reconData
    action: ajax
    args:
      url: '@query:ErpFinBankReconciliation__findPage'
      method: post
      data:
        query:
          limit: 200
      selection: id code orgId fundAccountId reconciliationDate bookBalance statementBalance unreconciledDiff isBalanced docStatus

  - type: grid
    className: m-3
    gap: sm
    columns: 3
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "调节表数"
                i18nEn: "Reconciliations"
              - type: text
                tag: span
                className: h3
                text: "${reconData?.items?.length ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "已平衡"
                i18nEn: "Balanced"
              - type: text
                tag: span
                className: h3 text-success
                text: "${(reconData?.items ?? []).filter(item => item.isBalanced === true).length ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "未平衡"
                i18nEn: "Unbalanced"
              - type: text
                tag: span
                className: h3 text-danger
                text: "${(reconData?.items?.length ?? 0) - ((reconData?.items ?? []).filter(item => item.isBalanced === true).length ?? 0)}"

  - type: crud
    name: reconCrud
    className: m-3
    title: "调节表列表"
    i18nEn: "Reconciliation List"
    source: ${reconData?.items ?? []}
    syncLocation: false
    columns:
      - name: code
        label: "单号"
        i18nEn: "Doc No"
      - name: orgId
        label: "业务组织"
        i18nEn: "Business Org"
      - name: fundAccountId
        label: "资金账户"
        i18nEn: "Cash Account"
      - name: reconciliationDate
        label: "调节日期"
        i18nEn: "Reconciliation Date"
      - name: bookBalance
        label: "账面余额"
        i18nEn: "Book Balance"
      - name: statementBalance
        label: "对账单余额"
        i18nEn: "Statement Balance"
      - name: unreconciledDiff
        label: "未调节差异"
        i18nEn: "Unreconciled Difference"
      - name: isBalanced
        label: "已平衡"
        type: tpl
        tpl: '${isBalanced ? "<span class=\"label label-success\">已平衡</span>" : "<span class=\"label label-danger\">未平衡</span>"}'
        i18nEn:
          label: "Balanced"
          tpl: '${isBalanced ? "<span class=\"label label-success\">Balanced</span>" : "<span class=\"label label-danger\">Unbalanced</span>"}'
      - name: docStatus
        label: "状态"
        i18nEn: "Status"