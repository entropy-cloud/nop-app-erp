# 余额调节表工作台（plan 2026-08-03-1232-4 Phase 1）。
# 数据来源：ErpFinBankReconciliation 实体 findPage（generate/post/reverse 链已实现）。零后端 delta。
type: page
title: "余额调节表"
body:
  - type: service
    name: kpiService
    className: m-3
    api:
      url: /graphql
      method: post
      dataType: raw
      data:
        query: "query(${'$'}lim:Int){ ErpFinBankReconciliation__findPage(query:{limit:${'$'}lim}){ items{ id bookBalance statementBalance unreconciledDiff isBalanced docStatus } total } }"
        variables:
          lim: 500
      adaptor: |
        const d = payload.data || {};
        const gql = d.data ? d.data : d;
        const page = gql.ErpFinBankReconciliation__findPage || { items: [], total: 0 };
        const rows = page.items || [];
        const balanced = rows.filter(function(r){ return r.isBalanced === true; }).length;
        const unbalanced = rows.length - balanced;
        return { status: 0, msg: '', data: { total: rows.length, balanced: balanced, unbalanced: unbalanced } };
    body:
      - type: grid
        className: m-3
        gap: 'sm'
        columns:
          - type: wrapper
            className: "border rounded p-3"
            body:
              - { type: tpl, tpl: "<div class='text-muted'>调节表数</div>" }
              - { type: tpl, tpl: "<span class='h3'>${total}</span>" }
          - type: wrapper
            className: "border rounded p-3"
            body:
              - { type: tpl, tpl: "<div class='text-muted'>已平衡</div>" }
              - { type: tpl, tpl: "<span class='h3 text-success'>${balanced}</span>" }
          - type: wrapper
            className: "border rounded p-3"
            body:
              - { type: tpl, tpl: "<div class='text-muted'>未平衡</div>" }
              - { type: tpl, tpl: "<span class='h3 text-danger'>${unbalanced}</span>" }

  - type: crud
    name: reconCrud
    className: m-3
    title: "调节表列表"
    syncLocation: false
    api:
      url: /graphql
      method: post
      dataType: raw
      data:
        query: "query(${'$'}lim:Int){ ErpFinBankReconciliation__findPage(query:{limit:${'$'}lim}){ items{ id code orgId fundAccountId reconciliationDate bookBalance statementBalance unreconciledDiff isBalanced docStatus } total } }"
        variables:
          lim: 200
      adaptor: |
        const d = payload.data || {};
        const gql = d.data ? d.data : d;
        const page = gql.ErpFinBankReconciliation__findPage || { items: [], total: 0 };
        return { status: 0, msg: '', data: { items: page.items || [], count: page.total || 0 } };
    columns:
      - { name: code, label: "单号" }
      - { name: orgId, label: "业务组织" }
      - { name: fundAccountId, label: "资金账户" }
      - { name: reconciliationDate, label: "调节日期" }
      - { name: bookBalance, label: "账面余额" }
      - { name: statementBalance, label: "对账单余额" }
      - { name: unreconciledDiff, label: "未调节差异" }
      - name: isBalanced
        label: "已平衡"
        type: tpl
        tpl: '${isBalanced ? "<span class=\"label label-success\">已平衡</span>" : "<span class=\"label label-danger\">未平衡</span>"}'
      - { name: docStatus, label: "状态" }
