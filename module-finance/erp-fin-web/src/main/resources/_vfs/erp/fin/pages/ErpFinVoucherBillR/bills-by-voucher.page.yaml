# 凭证→源业务单据反向跳转页（plan 2026-07-23-1408-2 Phase 2 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → table（formula 派生 link）。
# 数据源：ErpFinVoucherBillR__findPage filter voucherId。
# Phase 0 Decision 2 方案 a：静态 billType→目标实体路由映射表（编译期确定）。
# cleanCode：剥离已知后缀（-PV/-MI/-SI/-SR/-SF/-ML）、#period、前缀（COMMITMENT-/BUDGET-/INTERCOMPANY-/ELIMINATION-），
# 使 ?filter_code= 精确命中目标实体 code。
# 系统生成凭证（PERIOD_CLOSE/EXCHANGE_GAIN_LOSS/PROFIT_TO_RETAINED_EARNINGS/BAD_DEBT_RESERVE/BAD_DEBT_RELEASE）无源单据，link='' 不显示跳转。
type: page
title: "源单据"
i18nEn: "Source Bills"
body:
  - type: data-source
    name: sourceBillData
    action: ajax
    args:
      url: '@query:ErpFinVoucherBillR__findPage'
      method: post
      data:
        query:
          offset: 0
          limit: 50
          filter:
            $type: eq
            name: voucherId
            value: "${voucherId || 0}"
      selection: id billType billCode businessType

  # 派生字段（flux formula，无 regex/encodeURIComponent，用 SPLIT+REPLACE 等价剥离）：
  # cleanCode = 去 #period 后缀 + 系统前缀 + 版本后缀；linkPrefix = billType 路由前缀。
  - type: data-source
    name: sourceBills
    formula: '${ARRAYMAP(sourceBillData?.items ?? [], (it) => ({ id: it.id, billType: it.billType, billCode: it.billCode, businessType: it.businessType, cleanCode: REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(SPLIT(it.billCode ?? '''', ''#'')[0], ''COMMITMENT-'', ''''), ''BUDGET-'', ''''), ''INTERCOMPANY-'', ''''), ''ELIMINATION-'', ''''), ''-PV'', ''''), ''-MI'', ''''), ''-SI'', ''''), ''-SR'', ''''), ''-SF'', ''''), ''-ML'', ''''), linkPrefix: it.billType == ''AP_INVOICE'' ? ''/ErpPurInvoice-main?filter_code='' : it.billType == ''PAYMENT'' ? ''/ErpPurPayment-main?filter_code='' : it.billType == ''PURCHASE_RETURN'' ? ''/ErpPurReturn-main?filter_code='' : '''' }))}'
  - type: text
    className: m-3
    tag: div
    text: '<div class="text-muted">共 ${sourceBillData?.total || 0} 条源单据关联</div>'
    i18nEn: '<div class="text-muted">${sourceBillData?.total || 0} source bill links in total</div>'

  - type: crud
    className: m-3
    title: "源单据列表"
    i18nEn: "Source Bill List"
    source: ${sourceBills ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: billType
        label: "单据类型"
        i18nEn: "Doc Type"
      - name: billCode
        label: "单据编号"
        i18nEn: "Doc Code"
      - name: businessType
        label: "业务类型"
        i18nEn: "Business Type"
      - type: operation
        label: "操作"
        i18nEn: "Actions"
        buttons:
          - type: button
            label: "跳转源单据"
            i18nEn: "Go to source bill"
            level: primary
            size: sm
            icon: fa fa-external-link
            actionType: link
            link: "${linkPrefix + cleanCode}"
            visibleOn: "${billType === 'AP_INVOICE' || billType === 'PAYMENT' || billType === 'PURCHASE_RETURN'}"