# 预算方案工作台（plan 2026-08-03-1232-4 Phase 1 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + crud。
# 数据来源：ErpFinBudgetScenario 实体 findPage。零后端 delta。
type: page
title: "预算方案"
body:
  - type: data-source
    name: scenarioData
    action: ajax
    args:
      url: '@query:ErpFinBudgetScenario__findPage'
      method: post
      data:
        query:
          limit: 200
      selection: id code name fiscalYear scenarioType budgetGroupCode amountFunctional controlLevel docStatus approveStatus

  - type: grid
    className: m-3
    gap: sm
    columns: 3
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "方案总数"
              - type: text
                tag: span
                className: h3
                text: "${scenarioData?.items?.length ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "预算总额(本位币)"
              - type: text
                tag: span
                className: h3 text-primary
                text: "¥${ROUND(((scenarioData?.items ?? []).reduce((s, r) => s + (Number(r.amountFunctional) || 0), 0) ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "已批准方案"
              - type: text
                tag: span
                className: h3 text-success
                text: "${(scenarioData?.items ?? []).filter(item => item.approveStatus === 'APPROVED').length ?? 0}"

  - type: crud
    name: scenarioCrud
    className: m-3
    title: "预算方案列表"
    source: ${scenarioData?.items ?? []}
    syncLocation: false
    columns:
      - { name: code, label: "方案编码" }
      - { name: name, label: "方案名称" }
      - { name: fiscalYear, label: "预算年度" }
      - { name: scenarioType, label: "方案类型" }
      - { name: budgetGroupCode, label: "预算组" }
      - { name: amountFunctional, label: "预算金额(本位币)" }
      - { name: controlLevel, label: "控制级别" }
      - { name: docStatus, label: "方案状态" }
      - name: approveStatus
        label: "审核状态"
        type: tpl
        tpl: '${approveStatus == "APPROVED" ? "<span class=\"label label-success\">已批准</span>" : (approveStatus == "REJECTED" ? "<span class=\"label label-danger\">已驳回</span>" : "<span class=\"label label-default\">" + (approveStatus || "—") + "</span>")}'