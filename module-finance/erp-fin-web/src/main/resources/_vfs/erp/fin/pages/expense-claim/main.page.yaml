# 费用报销单工作台（plan 2026-08-03-1232-4 Phase 1 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + crud。
# 数据来源：ErpFinExpenseClaim 实体 findPage。零后端 delta。
type: page
title: "费用报销单"
i18nEn: "Expense Claim"
body:
  - type: data-source
    name: claimData
    action: ajax
    args:
      url: '@query:ErpFinExpenseClaim__findPage'
      method: post
      data:
        query:
          limit: 200
      selection: id code claimantId departmentId businessDate paymentMode amountWithTax settleAdvance reason docStatus approveStatus

  - type: grid
    className: m-3
    gap: sm
    columns: 4
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "报销单总数"
                i18nEn: "Total Claims"
              - type: text
                tag: span
                className: h3
                text: "${claimData?.items?.length ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "报销总额"
                i18nEn: "Total Claimed"
              - type: text
                tag: span
                className: h3 text-primary
                text: "¥${ROUND(((claimData?.items ?? []).reduce((s, r) => s + (Number(r.amountWithTax) || 0), 0) ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "待提交"
                i18nEn: "Pending Submit"
              - type: text
                tag: span
                className: h3 text-warning
                text: "${(claimData?.items ?? []).filter(item => item.docStatus === 'DRAFT').length ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "已审核"
                i18nEn: "Audited"
              - type: text
                tag: span
                className: h3 text-success
                text: "${(claimData?.items ?? []).filter(item => item.approveStatus === 'APPROVED').length ?? 0}"

  - type: crud
    name: claimCrud
    className: m-3
    title: "报销单列表"
    i18nEn: "Expense Claim List"
    source: ${claimData?.items ?? []}
    syncLocation: false
    columns:
      - name: code
        label: "单号"
        i18nEn: "Doc No"
      - name: claimantId
        label: "报销人"
        i18nEn: "Reimburser"
      - name: departmentId
        label: "部门"
        i18nEn: "Department"
      - name: businessDate
        label: "业务日期"
        i18nEn: "Business Date"
      - name: paymentMode
        label: "付款方式"
        i18nEn: "Payment Mode"
      - name: amountWithTax
        label: "含税金额"
        i18nEn: "Amount with Tax"
      - name: settleAdvance
        label: "抵扣借款"
        i18nEn: "Offset Loan"
      - name: docStatus
        label: "单据状态"
        i18nEn: "Doc Status"
      - name: approveStatus
        label: "审核状态"
        type: tpl
        tpl: '${approveStatus == "APPROVED" ? "<span class=\"label label-success\">已审核</span>" : (approveStatus == "REJECTED" ? "<span class=\"label label-danger\">已驳回</span>" : "<span class=\"label label-default\">" + (approveStatus || "—") + "</span>")}'
        i18nEn:
          label: "Audit Status"
          tpl: '${approveStatus == "APPROVED" ? "<span class=\"label label-success\">Audited</span>" : (approveStatus == "REJECTED" ? "<span class=\"label label-danger\">Rejected</span>" : "<span class=\"label label-default\">" + (approveStatus || "—") + "</span>")}'
      - name: reason
        label: "事由"
        i18nEn: "Reason"