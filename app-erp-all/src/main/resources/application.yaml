
nop:
  debug: true
  auth:
    jwt:
      enc-key: ${JWT_ENC_KEY:3b0ff92c103f4e2faf4d1e7d3efa3ea9}
    login:
      allow-create-default-user: false
    site-map:
      static-config-path: /nop/main/auth/app.action-auth.xml
      cache-timeout: 1s
      support-debug: true
  web:
    validate-page-model: true
    render-mode: flux
  orm:
    init-database-schema: true
    init-database-data: true
  datasource:
    driver-class-name: org.h2.Driver
    jdbc-url: jdbc:h2:./db/erp
    username: sa
    password:
  graphql:
    schema-introspection:
      enabled: false

quarkus:
  devservices:
    enabled: false
  datasource:
    devservices:
      enabled: false
  http:
    host: 0.0.0.0
    cors: true
    port: 8011
  log:
    level: INFO
    category:
      "io.nop":
        level: INFO
  dev:
    watch:
      enabled: false
  live-reload:
    enabled: false

"%dev":
   nop:
     auth:
       login:
         allow-create-default-user: true
       enable-action-auth: false
       enable-data-auth: false
       skip-check-for-admin: true
   erp:
     data-auth:
       role-row-filter-enabled: false
     audit:
       field-read:
         enabled: false
"%test":
   nop:
     auth:
       enable-action-auth: true
       enable-data-auth: true
       skip-check-for-admin: true
       use-user-id-for-audit-fields: true
       # USC-03 操作级审计 %test 同批启用经实测回退（plan 2026-10-01-0723-1 执行期勘误）：
       # enable-audit=true 时 dry-run-impact E2E 系统性 15s 超时（连接层悬挂，平台 GraphQLWebService
       # 层问题登记 successor）；测试态覆盖由 TestErpAuditProductionPath（@NopTestProperty 自供）承载。
       graphql:
         enable-audit: false
         audit-mutation-patterns: "*__approve,*__reverseApprove,*__reverse*,*__cancel*,*__writeOff,*__void*,*__closePeriod,*__reverseClose,*__post*"
   erp:
     data-auth:
       role-row-filter-enabled: true
     audit:
       field-read:
         enabled: true
   erp-common:
     sod-enabled: false
"%prod":
   nop:
     auth:
       # USC-02a 生产灰度翻转（plan 2026-10-01-0313-1，双独立子代理批准）：action-auth ON。
       # 部署语义：全操作（含查询）经 enforcement 检查 + query/mutation FNPT 零种子 = 业务角色「菜单壳」
       # （菜单可见、数据 403，已验收语义非故障）；skip-check-for-admin 保持省略继承平台默认 false（DR-1e），
       # 平台 admin 可见面 = erp-sys + notify（可见 ≠ 可用：平台实体零权限点）；B 类 crm/cs/drp 零种子 fail-closed。
       # USC-02b 精化（plan 2026-10-01-0523-1）：实体级窄种子豁免面 = sal ErpSalOrder:query /
       # qa ErpQaInspection:query+save / qa RiskRegister:query / mnt ErpMntVisit:query / md ErpMdCurrency:query。
       enable-action-auth: true
       # USC-02b data-auth 三开关同批翻转（行过滤 enabler 依赖：use-user-id-for-audit-fields=false 时
       # createdBy 戳为 sys-user-name，eq(createdBy,userId) 永不命中——E2.1 实证）。
       # 已知语义：creator 过滤规则下被过滤角色经 GraphQL 无法自建行（save-under-creator-filter，
       # B-1 实证，successor 登记）；正反馈 = SoDGuard createdBy==userId 比较开始实际生效。
       enable-data-auth: true
       use-user-id-for-audit-fields: true
       # USC-03 操作级审计增量启用（plan 2026-10-01-0723-1，双独立子代理批准）：
       # 高危 mutation 族 9 patterns（命中 ≈179 项；写 NopAuthOpLog 仅操作名+结果+身份，无业务载荷）。
       graphql:
         enable-audit: true
         audit-mutation-patterns: "*__approve,*__reverseApprove,*__reverse*,*__cancel*,*__writeOff,*__void*,*__closePeriod,*__reverseClose,*__post*"
   # skip-check-for-admin 省略 → 继承平台默认 false（DR-1e 安全姿态）
   erp:
     data-auth:
       role-row-filter-enabled: true
     audit:
       field-read:
         # USC-03 E4.2 保密字段读审计 %prod 翻转（唯一 %test ON/%prod OFF 审计键收口）。
         enabled: true
