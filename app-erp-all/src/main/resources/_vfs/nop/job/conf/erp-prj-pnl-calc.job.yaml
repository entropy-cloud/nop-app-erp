jobName: erp-prj-pnl-calc
enabled: "@cfg:nop.job.erp-prj-pnl-calc.enabled|false"
displayName: Projects PnL Aggregation
description: 每日凌晨扫描活跃项目批量汇总损益（Billing 收入 + CostCollection 四类成本）；nop-batch chunk 按 ErpPrjProject(active) 逐项目经 ErpPrjProjectPnlCalcHelper 调 refreshPnl（REQUIRES_NEW 单条失败隔离 + erp-prj.pnl-auto-calc-enabled / erp-prj.pnl-calc-cron 业务键双层门控，plan 2026-08-14-2304-3）
jobGroup: erp-prj
trigger:
  cronExpr: "@cfg:erp-prj.pnl-calc-cron|0 0 1 * * ?"
invoker:
  bean: nopBatchTaskRunner
  method: executeAsync
params:
  taskPath: /nop/batch-task/prj/pnl-calc.batch.xml
  params: {}
