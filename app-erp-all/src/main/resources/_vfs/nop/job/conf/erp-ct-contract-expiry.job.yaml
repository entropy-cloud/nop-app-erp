jobName: erp-ct-contract-expiry
enabled: "@cfg:nop.job.erp-ct-contract-expiry.enabled|false"
displayName: Contract Expiry Scan
description: 每日 01:00 扫描到期前 30/15/7 天合同派发分级提醒（30/15 天通知经办人，7 天升级通知经办人上级）+ 批量推进已过期合同 ACTIVE→EXPIRED（含未完成开票先完成 + config-gated 自动创建续期草稿）；cron 经 erp-ct.contract-expiry-cron 配置门控（单键模式）
jobGroup: erp-ct
trigger:
  cronExpr: "@cfg:erp-ct.contract-expiry-cron|0 0 1 * * ?"
invoker:
  bean: erpCtContractExpiryJob
  method: execute
