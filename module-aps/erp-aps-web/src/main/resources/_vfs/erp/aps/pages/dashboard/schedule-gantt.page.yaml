# APS 排产甘特图（plan 2026-08-03-1232-3 Phase 0 + plan 2026-08-29-1913-1 Phase 1）。
# flux 原生重写：data-source → form → gantt。
# 数据源：ErpApsOperationOrder__findPage（按 plannedStartDateT 排序）。
# 字段名经实时仓库核实：id/code/workOrderId/operationName/machineId/priority/plannedStartDateT/plannedEndDateT/qty/totalDuration/status。
# 状态颜色编码：scheduling.md §8.2（DRAFT=灰/PLANNED=蓝/IN_PROGRESS=黄/FINISHED=绿/CANCELLED=红）。
# 拖拽持久化端点：ErpApsOperationOrder__updateSchedule(opOrderId, start, end)（plan 2026-08-03-1232-3 Phase 0 Decision）。
type: page
title: "排产甘特图"
remark: "按 ErpApsOperationOrder 的 plannedStartDateT→plannedEndDateT 渲染甘特条，颜色编码 status。可拖拽修改排程时间（持久化至 ErpApsOperationOrder__updateSchedule）。工作中心分组显示。"
body:
  - type: form
    name: filterForm
    title: "筛选条件"
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-number
        name: machineId
        label: "工作中心ID"
        placeholder: "留空=全部工作中心"
        clearable: true
      - type: select
        name: status
        label: "状态"
        placeholder: "留空=全部状态"
        clearable: true
        options:
          - label: "草稿"
            value: "DRAFT"
          - label: "已计划"
            value: "PLANNED"
          - label: "进行中"
            value: "IN_PROGRESS"
          - label: "已完成"
            value: "FINISHED"
          - label: "已取消"
            value: "CANCELLED"
      - type: input-date
        name: startDate
        label: "开始日期"
        format: "YYYY-MM-DD"
        placeholder: "留空=不限"
        clearable: true
      - type: input-date
        name: endDate
        label: "结束日期"
        format: "YYYY-MM-DD"
        placeholder: "留空=不限"
        clearable: true
      - type: button
        label: "查询"
        icon: "search"
        onClick:
          action: refreshSource
          targetId: ganttData

  - type: data-source
    name: ganttData
    action: ajax
    args:
      url: '@query:ErpApsOperationOrder__findPage'
      method: post
      data:
        query:
          limit: 500
          orderBy:
            - name: "plannedStartDateT"
              desc: false
      selection: id code workOrderId operationName machineId priority plannedStartDateT plannedEndDateT qty totalDuration status

  - type: gantt
    className: m-3
    title: "排产甘特图（${ganttData?.items?.length || 0} 道工序）"
    tasks: ${ganttData?.items ?? []}
    draggable: true
    editable: true
    linkable: false
    defaultZoom: "week"
    columns:
      - { name: code, label: "工序编码" }
      - { name: operationName, label: "工序名" }
      - { name: machineId, label: "工作中心" }
      - { name: status, label: "状态" }
    onTaskDragEnd:
      - action: callApi
        args:
          url: '@mutation:ErpApsOperationOrder__updateSchedule'
          method: post
          data:
            opOrderId: "${event.id}"
            start: "${event.start}"
            end: "${event.end}"
        then:
          action: refreshSource
          targetId: ganttData