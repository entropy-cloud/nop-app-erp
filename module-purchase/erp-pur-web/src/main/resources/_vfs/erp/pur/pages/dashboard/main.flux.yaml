# 采购概览 dashboard（plan 2026-08-28-1600-1 Phase 1）。
# flux 原生重写：service → data-source + chart（recharts declarative）+ crud。
# 数据源：ErpPurDashboard__getDashboardKpi / __getDashboardTrend / __findVendorTopN / __findThreeWayMatchDiffAlert / __findApOverdueAlert。
type: page
title: 采购概览
i18nEn: "Purchase Overview"
body:
- type: form
  name: filterForm
  valuesPath: filterForm
  title: ""
  mode: inline
  wrapWithPanel: false
  className: m-3
  body:
  - type: input-date
    name: startDate
    label: 开始日期
    format: YYYY-MM-DD
    placeholder: 留空=本月1日
    i18nEn:
      label: "Start Date"
      placeholder: "Blank = first day of this month"
    clearable: true
  - type: input-date
    name: endDate
    label: 结束日期
    format: YYYY-MM-DD
    placeholder: 留空=今天
    i18nEn:
      label: "End Date"
      placeholder: "Blank = today"
    clearable: true
  - type: button
    label: 刷新
    i18nEn: "Refresh"
    icon: refresh-cw
    onClick:
      action: refreshSource
      targetId: kpiData
      then:
        action: refreshSource
        targetId: trendData
        then:
          action: refreshSource
          targetId: topNVendorData
          then:
            action: refreshSource
            targetId: threeWayMatchData
            then:
              action: refreshSource
              targetId: apOverdueData
- type: data-source
  name: kpiData
  action: ajax
  args:
    url: '@query:ErpPurDashboard__getDashboardKpi'
    method: post
    data:
      startDate: "${filterForm?.startDate || null}"
      endDate: "${filterForm?.endDate || null}"
    selection: purchaseAmount orderCount apBalance onTimeRate
- type: grid
  className: m-3
  gap: sm
  columns: 4
  items:
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 本期采购额
        i18nEn: "Purchase Amount (Current Period)"
      - type: text
        tag: h3
        className: text-primary
        text: "¥${ROUND((kpiData?.purchaseAmount ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 本期订单量
        i18nEn: "Order Count (Current Period)"
      - type: text
        tag: h3
        className: font-bold
        text: "${kpiData?.orderCount ?? 0}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 应付余额
        i18nEn: "AP Balance"
      - type: text
        tag: h3
        className: text-warning
        text: "¥${ROUND((kpiData?.apBalance ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 到货及时率
        i18nEn: "On-Time Arrival Rate"
      - type: text
        tag: h3
        className: text-success
        text: "${ROUND((kpiData?.onTimeRate ?? 0), 2)}"
- type: data-source
  name: trendData
  action: ajax
  args:
    url: '@query:ErpPurDashboard__getDashboardTrend'
    method: post
    data:
      months: 12
    selection: month purchaseAmount
- type: chart
  chartType: line
  title: 采购趋势（近12月）
  i18nEn: "Purchase Trend (Last 12 Months)"
  source: ${trendData ?? []}
  xAxis: { dataKey: month }
  yAxis:
    label: 金额
    i18nEn: "Amount"
  legend: true
  height: 300
  series:
  - dataRegionKey: purchaseAmount
    name: 采购额
    i18nEn: "Purchase Amount"
- type: data-source
  name: topNVendorData
  action: ajax
  args:
    url: '@query:ErpPurDashboard__findVendorTopN'
    method: post
    data:
      limit: 10
    selection: supplierId supplierName purchaseAmount
- type: chart
  chartType: pie
  title: 供应商 TOP10 采购占比
  i18nEn: "Top 10 Suppliers by Purchase Share"
  source: ${topNVendorData ?? []}
  height: 300
- type: data-source
  name: threeWayMatchData
  action: ajax
  args:
    url: '@query:ErpPurDashboard__findThreeWayMatchDiffAlert'
    method: post
    selection: invoiceCode supplierName varianceType
- type: crud
  title: 三单匹配价格差异预警
  i18nEn: "Three-Way Match Price Variance Alert"
  source: ${threeWayMatchData}
  syncLocation: false
  headerToolbar: []
  footerToolbar: []
  columns:
  - name: invoiceCode
    label: 发票号
    i18nEn: "Invoice No."
  - name: supplierName
    label: 供应商
    i18nEn: "Supplier"
  - name: varianceType
    label: 差异类型
    i18nEn: "Variance Type"
    type: status
    labelMap:
      PRICE: 价格差异
      i18nEn:
        PRICE: Price Variance
    levelMap:
      PRICE: error
- type: data-source
  name: apOverdueData
  action: ajax
  args:
    url: '@query:ErpPurDashboard__findApOverdueAlert'
    method: post
    selection: partnerName sourceBillCode openAmount ageDays
- type: crud
  title: 应付超期预警
  i18nEn: "AP Overdue Alert"
  source: ${apOverdueData}
  syncLocation: false
  headerToolbar: []
  footerToolbar: []
  columns:
  - name: partnerName
    label: 供应商
    i18nEn: "Supplier"
  - name: sourceBillCode
    label: 单据号
    i18nEn: "Document No."
  - name: openAmount
    label: 未结金额
    i18nEn: "Open Amount"
    type: number
    precision: 2
  - name: ageDays
    label: 账龄(天)
    i18nEn: "Aging (Days)"
    type: number
