# 采购概览 dashboard（plan 2026-08-29-1913-1 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + chart（趋势/TOP10 供应商）+ crud（三单匹配/应付超期预警）。
# 数据源：ErpPurDashboard__getDashboardKpi / __getDashboardTrend / __findVendorTopN / __findThreeWayMatchDiffAlert / __findApOverdueAlert。
type: page
title: "采购概览"
body:
  - type: form
    name: filterForm
    title: ""
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-date
        name: startDate
        label: "开始日期"
        format: YYYY-MM-DD
        placeholder: "留空=本月1日"
        clearable: true
      - type: input-date
        name: endDate
        label: "结束日期"
        format: YYYY-MM-DD
        placeholder: "留空=今天"
        clearable: true
      - type: button
        label: "刷新"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: kpiData
          then:
            action: refreshSource
            targetId: trendData
            then:
              action: refreshSource
              targetId: topNVendorData
              then:
                action: refreshSource
                targetId: threeWayMatchData
                then:
                  action: refreshSource
                  targetId: apOverdueData

  - type: data-source
    name: kpiData
    action: ajax
    args:
      url: '@query:ErpPurDashboard__getDashboardKpi'
      method: post
      data:
        startDate: "${filterForm?.startDate || null}"
        endDate: "${filterForm?.endDate || null}"
      selection: purchaseAmount orderCount apBalance onTimeRate

  - type: grid
    className: m-3
    gap: sm
    columns: 4
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 本期采购额
              - type: text
                tag: span
                className: h3 text-primary
                text: "¥${kpiData?.purchaseAmount ?? 0 | round:2}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 本期订单量
              - type: text
                tag: span
                className: h3 font-bold
                text: "${kpiData?.orderCount ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 应付余额
              - type: text
                tag: span
                className: h3 text-warning
                text: "¥${kpiData?.apBalance ?? 0 | round:2}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 到货及时率
              - type: text
                tag: span
                className: h3 text-success
                text: "${kpiData?.onTimeRate ?? 0 | round:2}"

  - type: data-source
    name: trendData
    action: ajax
    args:
      url: '@query:ErpPurDashboard__getDashboardTrend'
      method: post
      data:
        months: 12
      selection: month purchaseAmount
  - type: chart
    chartType: line
    title: "采购趋势（近12月）"
    source: ${trendData ?? []}
    xAxis: { dataKey: month }
    yAxis: { label: "采购额" }
    legend: true
    height: 300
    series:
      - { name: "采购额", dataRegionKey: purchaseAmount }

  - type: data-source
    name: topNVendorData
    action: ajax
    args:
      url: '@query:ErpPurDashboard__findVendorTopN'
      method: post
      data:
        limit: 10
      selection: supplierId supplierName purchaseAmount
  - type: chart
    chartType: pie
    title: "供应商 TOP10 采购占比"
    source: ${topNVendorData ?? []}
    height: 300
    series:
      - { name: "采购额", dataRegionKey: purchaseAmount, nameField: supplierName }

  - type: data-source
    name: threeWayMatchData
    action: ajax
    args:
      url: '@query:ErpPurDashboard__findThreeWayMatchDiffAlert'
      method: post
      selection: invoiceCode supplierName varianceType
  - type: crud
    name: threeWayMatchCrud
    className: m-3
    title: "三单匹配价格差异预警（阈值经 erp-pur.match-price-tolerance 配置）"
    source: ${threeWayMatchData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: invoiceCode
        label: "发票号"
      - name: supplierName
        label: "供应商"
      - name: varianceType
        label: "差异类型"

  - type: data-source
    name: apOverdueData
    action: ajax
    args:
      url: '@query:ErpPurDashboard__findApOverdueAlert'
      method: post
      selection: partnerName sourceBillCode openAmount ageDays
  - type: crud
    name: apOverdueCrud
    className: m-3
    title: "应付超期预警（阈值经 erp-dash.pur-ap-overdue-days 配置）"
    source: ${apOverdueData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: partnerName
        label: "供应商"
      - name: sourceBillCode
        label: "单据号"
      - name: openAmount
        label: "未结金额"
      - name: ageDays
        label: "账龄(天)"