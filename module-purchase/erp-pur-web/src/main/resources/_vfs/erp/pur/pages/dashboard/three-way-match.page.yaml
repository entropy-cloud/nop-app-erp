# 采购三单匹配联查（F16 P2 复杂页面，plan 2026-07-22-1400-2 §Phase 3 + plan 2026-08-29-1913-1 Phase 1）。
# flux 原生重写：data-source → form → crud（差异预警 + PO/Receive/Invoice 三表）。
# 数据源：ErpPurDashboard__findThreeWayMatchDiffAlert + ErpPurOrder__findPage + ErpPurReceive__findPage + ErpPurInvoice__findPage。
# 顶部差异预警由 ErpPurDashboard__findThreeWayMatchDiffAlert 检测发票单价 vs 订单单价差异超容差（erp-pur.match-price-tolerance 配置，默认 5%）。
# 下方三表按 supplierId 过滤并列展示，便于人工比对数量/单价。
type: page
title: "三单匹配联查"
remark: "采购订单 ↔ 入库单 ↔ 发票 三表并列联查。顶部差异预警由 ErpPurDashboard__findThreeWayMatchDiffAlert 检测发票单价 vs 订单单价差异超容差（erp-pur.match-price-tolerance 配置，默认 5%）的发票。下方三表按供应商过滤并列展示，便于人工比对数量/单价。"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: "筛选条件"
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-number
        name: supplierId
        label: "供应商ID"
        placeholder: "输入供应商ID过滤三表"
        clearable: true
      - type: button
        label: "刷新联查"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: diffAlertData
          then:
            action: refreshSource
            targetId: poData
            then:
              action: refreshSource
              targetId: receiveData
              then:
                action: refreshSource
                targetId: invoiceData

  - type: data-source
    name: diffAlertData
    action: ajax
    args:
      url: '@query:ErpPurDashboard__findThreeWayMatchDiffAlert'
      method: post
      selection: invoiceId invoiceCode supplierId supplierName varianceType

  - type: crud
    name: threeWayMatchCrud
    className: m-3
    title: "① 差异预警（发票单价 vs 订单单价超容差）"
    source: ${diffAlertData ?? []}
    headerToolbar: []
    footerToolbar: []
    syncLocation: false
    columns:
      - name: invoiceCode
        label: "发票号"
      - name: supplierName
        label: "供应商"
      - name: varianceType
        label: "差异类型"
        type: tpl
        tpl: '<span class="label label-danger">${varianceType == "PRICE" ? "价格差异" : varianceType}</span>'
      - type: tpl
        label: "容差可视化"
        tpl: '<div style="display:flex;align-items:center;gap:6px;"><span style="display:inline-block;width:100%;max-width:120px;height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden;position:relative;"><span style="display:block;width:5%;height:100%;background:#5cb85c;"></span></span><span class="text-muted">阈值 5% (erp-pur.match-price-tolerance)</span></div>'

  - type: data-source
    name: poData
    action: ajax
    args:
      url: '@query:ErpPurOrder__findPage'
      method: post
      data:
        filter_supplierId: "${filterForm?.supplierId || null}"
        limit: 20
      selection: id code businessDate deliveryDate totalAmount docStatus approveStatus

  - type: crud
    name: poCrud
    className: m-3
    title: "② 采购订单"
    source: ${poData?.items ?? []}
    headerToolbar: []
    footerToolbar: ["statistics"]
    syncLocation: false
    columns:
      - name: code
        label: "订单号"
      - name: businessDate
        label: "订单日期"
        type: date
        format: "YYYY-MM-DD"
      - name: deliveryDate
        label: "交货日期"
        type: date
        format: "YYYY-MM-DD"
      - name: totalAmount
        label: "订单金额"
        type: number
        kilometer: true
        precision: 2
      - name: docStatus
        label: "状态"
        type: tpl
        tpl: '<span class="label label-${docStatus == "ACTIVE" ? "primary" : "default"}">${docStatus}</span>'

  - type: data-source
    name: receiveData
    action: ajax
    args:
      url: '@query:ErpPurReceive__findPage'
      method: post
      data:
        filter_supplierId: "${filterForm?.supplierId || null}"
        limit: 20
      selection: id code businessDate totalAmount docStatus approveStatus

  - type: crud
    name: receiveCrud
    className: m-3
    title: "③ 采购入库单"
    source: ${receiveData?.items ?? []}
    headerToolbar: []
    footerToolbar: ["statistics"]
    syncLocation: false
    columns:
      - name: code
        label: "入库单号"
      - name: businessDate
        label: "入库日期"
        type: date
        format: "YYYY-MM-DD"
      - name: totalAmount
        label: "入库金额"
        type: number
        kilometer: true
        precision: 2
      - name: docStatus
        label: "状态"
        type: tpl
        tpl: '<span class="label label-${docStatus == "ACTIVE" ? "primary" : "default"}">${docStatus}</span>'

  - type: data-source
    name: invoiceData
    action: ajax
    args:
      url: '@query:ErpPurInvoice__findPage'
      method: post
      data:
        filter_supplierId: "${filterForm?.supplierId || null}"
        limit: 20
      selection: id code businessDate totalAmount docStatus approveStatus

  - type: crud
    name: invoiceCrud
    className: m-3
    title: "④ 采购发票"
    source: ${invoiceData?.items ?? []}
    headerToolbar: []
    footerToolbar: ["statistics"]
    syncLocation: false
    columns:
      - name: code
        label: "发票号"
      - name: businessDate
        label: "发票日期"
        type: date
        format: "YYYY-MM-DD"
      - name: totalAmount
        label: "发票金额"
        type: number
        kilometer: true
        precision: 2
      - name: docStatus
        label: "状态"
        type: tpl
        tpl: '<span class="label label-${docStatus == "ACTIVE" ? "primary" : "default"}">${docStatus}</span>'