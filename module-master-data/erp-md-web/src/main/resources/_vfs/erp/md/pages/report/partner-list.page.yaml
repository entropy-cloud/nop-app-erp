# 往来单位清单（plan 2026-08-29-1913-1 Phase 1）。
# flux 原生重写：data-source → form → html。
# 数据源：ErpMdReport__renderHtml（报表渲染）。
# 下载按钮保留 /p/{ErpMdReport__download} 路径（plan 2026-07-12-0413-1 已修复）。
type: page
title: "往来单位清单"
i18nEn: "Partner List"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-text
        name: partnerType
        label: "往来单位类型"
        placeholder: "CUSTOMER=客户 / SUPPLIER=供应商（留空查全部）"
        i18nEn:
          label: "Business Partner Type"
          placeholder: "CUSTOMER=Customer / SUPPLIER=Supplier (blank = all)"
      - type: button
        label: "渲染报表"
        i18nEn: "Render Report"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        i18nEn: "Download XLSX"
        actionType: download
        api:
          url: /p/ErpMdReport__download
          method: post
          responseType: blob
          data:
            reportName: "partner-list"
            renderType: "xlsx"
            data:
              partnerType: "${filterForm?.partnerType}"
      - type: button
        label: "下载 PDF"
        i18nEn: "Download PDF"
        actionType: download
        api:
          url: /p/ErpMdReport__download
          method: post
          responseType: blob
          data:
            reportName: "partner-list"
            renderType: "pdf"
            data:
              partnerType: "${filterForm?.partnerType}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpMdReport__renderHtml'
      method: post
      data:
        reportName: "partner-list"
        data:
          partnerType: "${filterForm?.partnerType}"

  - type: html
    className: m-3
    sanitize: false
    content: "${reportHtmlData ?? ''}"