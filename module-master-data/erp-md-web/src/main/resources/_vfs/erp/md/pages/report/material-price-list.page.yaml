# 物料价格清单（plan 2026-08-29-1913-1 Phase 1）。
# flux 原生重写：data-source → form → html。
# 数据源：ErpMdReport__renderHtml（报表渲染）。
# 下载按钮保留 /p/{ErpMdReport__download} 路径（plan 2026-07-12-0413-1 已修复）。
type: page
title: "物料价格清单"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-text
        name: materialCode
        label: "物料编码"
        placeholder: "按物料编码精确过滤（留空查全部）"
      - type: button
        label: "渲染报表"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        actionType: download
        api:
          url: /p/ErpMdReport__download
          method: post
          responseType: blob
          data:
            reportName: "material-price-list"
            renderType: "xlsx"
            data:
              materialCode: "${filterForm?.materialCode}"
      - type: button
        label: "下载 PDF"
        actionType: download
        api:
          url: /p/ErpMdReport__download
          method: post
          responseType: blob
          data:
            reportName: "material-price-list"
            renderType: "pdf"
            data:
              materialCode: "${filterForm?.materialCode}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpMdReport__renderHtml'
      method: post
      data:
        reportName: "material-price-list"
        data:
          materialCode: "${filterForm?.materialCode}"

  - type: html
    className: m-3
    sanitize: false
    content: "${reportHtmlData ?? ''}"