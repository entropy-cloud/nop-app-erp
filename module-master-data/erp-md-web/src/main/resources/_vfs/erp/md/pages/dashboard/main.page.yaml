# 主数据概览 dashboard（plan 2026-08-29-1913-1 Phase 1）。
# flux 原生重写：data-source → service（KPI 卡） + crud（数据质量预警）。
# 数据源：ErpMdDashboard__getDashboardKpi / __findMaterialWithoutSkuAlert / __findSkuWithoutPriceAlert。
type: page
title: "主数据概览"
i18nEn: "Master Data Overview"
body:
  - type: button
    label: "刷新"
    i18nEn: "Refresh"
    icon: "refresh-cw"
    onClick:
      action: refreshSource
      targetId: kpiData
      then:
        action: refreshSource
        targetId: materialAlertData
        then:
          action: refreshSource
          targetId: skuAlertData
    className: m-3

  - type: data-source
    name: kpiData
    action: ajax
    args:
      url: '@query:ErpMdDashboard__getDashboardKpi'
      method: post
      selection: materialCount customerCount vendorCount inactiveMaterialCount inactivePartnerCount

  - type: grid
    className: m-3
    gap: sm
    columns: 5
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 物料总数
                i18nEn: "Total Materials"
              - type: text
                tag: span
                className: h3 font-bold
                text: "${kpiData?.materialCount ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 客户数
                i18nEn: "Customer Count"
              - type: text
                tag: span
                className: h3 text-primary
                text: "${kpiData?.customerCount ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 供应商数
                i18nEn: "Supplier Count"
              - type: text
                tag: span
                className: h3 text-success
                text: "${kpiData?.vendorCount ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 停用物料数
                i18nEn: "Inactive Material Count"
              - type: text
                tag: span
                className: h3 text-warning
                text: "${kpiData?.inactiveMaterialCount ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 停用往来单位数
                i18nEn: "Inactive Business Partner Count"
              - type: text
                tag: span
                className: h3 text-danger
                text: "${kpiData?.inactivePartnerCount ?? 0}"

  - type: data-source
    name: materialAlertData
    action: ajax
    args:
      url: '@query:ErpMdDashboard__findMaterialWithoutSkuAlert'
      method: post
      selection: materialCode materialName status
  - type: crud
    name: materialWithoutSkuCrud
    className: m-3
    title: "无 SKU 物料预警（数据质量）"
    i18nEn: "Material Without SKU Alert (Data Quality)"
    source: ${materialAlertData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: materialCode
        label: "物料编码"
        i18nEn: "Material Code"
      - name: materialName
        label: "物料名称"
        i18nEn: "Material Name"
      - name: status
        label: "状态"
        i18nEn: "Status"

  - type: data-source
    name: skuAlertData
    action: ajax
    args:
      url: '@query:ErpMdDashboard__findSkuWithoutPriceAlert'
      method: post
      selection: skuCode materialId
  - type: crud
    name: skuWithoutPriceCrud
    className: m-3
    title: "无价格 SKU 预警（数据质量）"
    i18nEn: "SKU Without Price Alert (Data Quality)"
    source: ${skuAlertData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: skuCode
        label: "SKU 编码"
        i18nEn: "SKU Code"
      - name: materialId
        label: "物料ID"
        i18nEn: "Material ID"