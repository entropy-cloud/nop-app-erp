# 全仓库首例手写 picker.page.yaml（plan 2026-07-21-0827-2 Phase 2 + plan 2026-08-29-1913-1 Phase 1）。
# 结构上与 `_vfs/erp/md/pages/dashboard/main.page.yaml` 既有手写非实体 page.yaml 同构 ——
# BizModel 非实体（ErpPartyBizModel），无法走 codegen `<web:GenPage view="Xxx.view.xml" page="picker"/>` 模板。
#
# 触发条件：BizModel 非实体 + 需要 picker 交互 → 手写 picker.page.yaml（owner doc §5）。
#
# onSelect 回填：父表单字段 partyType + partyId + displayName（+ 可选 phone/email）。
# 父页面经 `/erp/md/pages/party-search/main.picker.page.yaml` 引用本文件。
type: page
title: "选择 Party（联合检索）"
i18nEn: "Select Party (Combined Search)"
body:
  - type: form
    name: partyFilter
    valuesPath: partyFilter
    title: "过滤条件"
    i18nEn: "Filter Conditions"
    mode: inline
    submitOnChange: true
    submitOnInit: true
    wrapWithPanel: false
    controls:
      - type: text
        name: keyword
        label: "关键字"
        placeholder: "编码 / 名称 / 电话 / 邮箱（≥2 字符）"
        i18nEn:
          label: "Keyword"
          placeholder: "Code / Name / Phone / Email (≥2 chars)"
        value: ""
      - type: tag
        name: partyTypes
        label: "Party 类型"
        i18nEn: "Party Type"
        value: ["PARTNER", "EMPLOYEE", "ORGANIZATION"]
        options:
          - value: "PARTNER"
            label: "往来单位"
            i18nEn: "Business Partner"
          - value: "EMPLOYEE"
            label: "职员"
            i18nEn: "Employee"
          - value: "ORGANIZATION"
            label: "组织"
            i18nEn: "Organization"
        displayMode: normal

  - type: data-source
    name: partyData
    action: ajax
    args:
      url: '@query:ErpParty__findParties'
      method: post
      data:
        keyword: "${partyFilter?.keyword || ''}"
        partyTypes: "${partyFilter?.partyTypes || ['PARTNER', 'EMPLOYEE', 'ORGANIZATION']}"
        limit: 50
      selection: partyType partyId code name phone email status displayName

  - type: crud
    name: partyCrud
    className: m-3
    title: "Party 列表"
    i18nEn: "Party List"
    source: ${partyData ?? []}
    syncLocation: false
    headerToolbar: []
    rowKey: partyId
    columns:
      - name: partyType
        label: "类型"
        i18nEn: "Type"
        type: mapping
        map:
          PARTNER: "<span class='label label-info'>往来单位</span>"
          EMPLOYEE: "<span class='label label-success'>职员</span>"
          ORGANIZATION: "<span class='label label-warning'>组织</span>"
          i18nEn:
            PARTNER: "<span class='label label-info'>Business Partner</span>"
            EMPLOYEE: "<span class='label label-success'>Employee</span>"
            ORGANIZATION: "<span class='label label-warning'>Organization</span>"
      - name: code
        label: "编码"
        i18nEn: "Code"
      - name: name
        label: "名称"
        i18nEn: "Name"
      - name: phone
        label: "电话"
        i18nEn: "Phone"
        placeholder: "-"
      - name: email
        label: "邮箱"
        i18nEn: "Email"
        placeholder: "-"
      - name: status
        label: "状态"
        i18nEn: "Status"
        type: mapping
        map:
          ACTIVE: "<span class='label label-success'>启用</span>"
          INACTIVE: "<span class='label label-default'>停用</span>"
          i18nEn:
            ACTIVE: "<span class='label label-success'>Active</span>"
            INACTIVE: "<span class='label label-default'>Inactive</span>"
