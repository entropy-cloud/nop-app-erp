# 客服绩效看板（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + chart + crud。
# 数据源：ErpCsQualityDashboard__getDashboardKpi / __getTeamSlaRanking / __getAgentCsatBreakdown。
type: page
title: "客服绩效看板"
i18nEn: "Customer Service Performance Dashboard"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-date
        name: startDate
        label: "开始日期"
        i18nEn: "Start Date"
        format: YYYY-MM-DD
        clearable: true
      - type: input-date
        name: endDate
        label: "结束日期"
        i18nEn: "End Date"
        format: YYYY-MM-DD
        clearable: true
      - type: button
        label: "刷新"
        i18nEn: "Refresh"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: kpiData
          then:
            action: refreshSource
            targetId: teamRankingData
          then:
            action: refreshSource
            targetId: agentCsatData

  - type: data-source
    name: kpiData
    action: ajax
    args:
      url: '@query:ErpCsQualityDashboard__getDashboardKpi'
      method: post
      data:
        startDate: "${filterForm?.startDate || null}"
        endDate: "${filterForm?.endDate || null}"
      selection: slaCompletionRate avgResolutionHours slaBreachedCount totalTickets avgFirstResponseHours

  - type: grid
    className: m-3
    gap: sm
    columns: 5
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "SLA 达标率"
                i18nEn: "SLA Compliance Rate"
              - type: text
                tag: span
                className: h3 text-success
                text: "${kpiData?.slaCompletionRate != null ? (ROUND(kpiData.slaCompletionRate * 100, 1)) + '%' : '-'}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "平均解决时长(小时)"
                i18nEn: "Avg Resolution Hours"
              - type: text
                tag: span
                className: h3
                text: "${kpiData?.avgResolutionHours ?? '-'}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "超时工单数"
                i18nEn: "SLA Breached Tickets"
              - type: text
                tag: span
                className: h3 text-danger
                text: "${kpiData?.slaBreachedCount ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "已关闭工单数"
                i18nEn: "Closed Tickets"
              - type: text
                tag: span
                className: h3
                text: "${kpiData?.totalTickets ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "平均首次响应时长(小时)"
                i18nEn: "Avg First Response Hours"
              - type: text
                tag: span
                className: h3
                text: "${kpiData?.avgFirstResponseHours ?? '-'}"

  - type: data-source
    name: teamRankingData
    action: ajax
    args:
      url: '@query:ErpCsQualityDashboard__getTeamSlaRanking'
      method: post
      data:
        startDate: "${filterForm?.startDate || null}"
        endDate: "${filterForm?.endDate || null}"
      selection: teamName slaCompletionRate totalTickets

  - type: chart
    chartType: bar
    title: "团队 SLA 达标率排名"
    i18nEn: "Team SLA Compliance Ranking"
    source: ${teamRankingData ?? []}
    xAxis: { dataKey: teamName }
    yAxis:
      label: "达标率/工单数"
      i18nEn: "Compliance Rate / Tickets"
    legend: true
    height: 300
    series:
      - dataRegionKey: slaCompletionRate
        name: "SLA达标率"
        i18nEn: "SLA Compliance Rate"
      - dataRegionKey: totalTickets
        name: "工单数"
        i18nEn: "Ticket Count"

  - type: data-source
    name: agentCsatData
    action: ajax
    args:
      url: '@query:ErpCsQualityDashboard__getAgentCsatBreakdown'
      method: post
      data:
        startDate: "${filterForm?.startDate || null}"
        endDate: "${filterForm?.endDate || null}"
      selection: agentId ticketCount surveyCount avgCsat avgNps avgCes

  - type: crud
    className: m-3
    title: "客服 CSAT/NPS/CES 明细"
    i18nEn: "Agent CSAT/NPS/CES Detail"
    source: ${agentCsatData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: agentId
        label: "客服ID"
        i18nEn: "Agent ID"
      - name: ticketCount
        label: "工单数"
        i18nEn: "Ticket Count"
      - name: surveyCount
        label: "调查回复数"
        i18nEn: "Survey Responses"
      - name: avgCsat
        label: "平均CSAT"
        i18nEn: "Avg CSAT"
      - name: avgNps
        label: "平均NPS"
        i18nEn: "Avg NPS"
      - name: avgCes
        label: "平均CES"
        i18nEn: "Avg CES"
