# 工单 SLA/CSAT 综合统计表（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → html。
type: page
title: "工单 SLA/CSAT 综合统计表"
i18nEn: "Ticket SLA/CSAT Summary Report"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-text
        name: ticketType
        label: "工单类型"
        placeholder: "按工单类型过滤（留空查全部）"
        i18nEn:
          label: "Ticket Type"
          placeholder: "Filter by ticket type (blank = all)"
      - type: button
        label: "渲染报表"
        i18nEn: "Render Report"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        i18nEn: "Download XLSX"
        actionType: download
        api:
          url: /p/ErpCsReport__download
          method: post
          responseType: blob
          data:
            reportName: "ticket-sla-csat-summary"
            renderType: "xlsx"
            data:
              ticketType: "${filterForm?.ticketType}"
      - type: button
        label: "下载 PDF"
        i18nEn: "Download PDF"
        actionType: download
        api:
          url: /p/ErpCsReport__download
          method: post
          responseType: blob
          data:
            reportName: "ticket-sla-csat-summary"
            renderType: "pdf"
            data:
              ticketType: "${filterForm?.ticketType}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpCsReport__renderHtml'
      method: post
      data:
        reportName: "ticket-sla-csat-summary"
        data:
          ticketType: "${filterForm?.ticketType}"

  - type: html
    className: m-3
    sanitize: false
    content: "${reportHtmlData ?? ''}"
