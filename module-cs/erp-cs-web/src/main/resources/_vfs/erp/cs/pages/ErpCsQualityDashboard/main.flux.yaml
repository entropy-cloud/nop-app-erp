# 客服绩效看板 dashboard（plan 2026-08-28-1600-1 Phase 1）。
# flux 原生重写：service → data-source + chart + crud。
# 数据源：ErpCsQualityDashboard__getDashboardKpi / __getTeamSlaRanking / __getAgentCsatBreakdown。
type: page
title: 客服绩效看板
body:
- type: form
  name: filterForm
  valuesPath: filterForm
  title: ""
  mode: inline
  wrapWithPanel: false
  className: m-3
  body:
  - type: input-date
    name: startDate
    label: 开始日期
    format: YYYY-MM-DD
    clearable: true
  - type: input-date
    name: endDate
    label: 结束日期
    format: YYYY-MM-DD
    clearable: true
  - type: button
    label: 刷新
    icon: refresh-cw
    onClick:
      action: refreshSource
      targetId: kpiData
      then:
        action: refreshSource
        targetId: teamRankingData
        then:
          action: refreshSource
          targetId: agentCsatData
- type: data-source
  name: kpiData
  action: ajax
  args:
    url: '@query:ErpCsQualityDashboard__getDashboardKpi'
    method: post
    data:
      startDate: "${filterForm?.startDate || null}"
      endDate: "${filterForm?.endDate || null}"
    selection: slaCompletionRate avgResolutionHours slaBreachedCount totalTickets avgFirstResponseHours
- type: grid
  className: m-3
  gap: sm
  columns: 5
  items:
  - colSpan: 1
    body:
    - type: container
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: SLA 达标率
      - type: text
        tag: h3
        className: text-success
        text: "${kpiData?.slaCompletionRate != null ? (kpiData.slaCompletionRate * 100).toFixed(1) + '%' : '-'}"
  - colSpan: 1
    body:
    - type: container
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 平均解决时长(小时)
      - type: text
        tag: h3
        text: "${kpiData?.avgResolutionHours ?? '-'}"
  - colSpan: 1
    body:
    - type: container
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 超时工单数
      - type: text
        tag: h3
        className: text-danger
        text: "${kpiData?.slaBreachedCount ?? 0}"
  - colSpan: 1
    body:
    - type: container
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 已关闭工单数
      - type: text
        tag: h3
        text: "${kpiData?.totalTickets ?? 0}"
  - colSpan: 1
    body:
    - type: container
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 平均首次响应时长(小时)
      - type: text
        tag: h3
        text: "${kpiData?.avgFirstResponseHours ?? '-'}"
- type: data-source
  name: teamRankingData
  action: ajax
  args:
    url: '@query:ErpCsQualityDashboard__getTeamSlaRanking'
    method: post
    data:
      startDate: "${filterForm?.startDate || null}"
      endDate: "${filterForm?.endDate || null}"
    selection: teamName slaCompletionRate totalTickets
- type: chart
  chartType: bar
  title: 团队 SLA 达标率排名
  source: ${teamRankingData ?? []}
  xAxis: { dataKey: teamName }
  yAxis:
  - { label: 达标率, position: left }
  - { label: 工单数, position: right }
  legend: true
  height: 300
  series:
  - { name: SLA达标率, dataRegionKey: slaCompletionRate, yAxisId: 0 }
  - { name: 工单数, dataRegionKey: totalTickets, type: bar, yAxisId: 1 }
- type: data-source
  name: agentCsatData
  action: ajax
  args:
    url: '@query:ErpCsQualityDashboard__getAgentCsatBreakdown'
    method: post
    data:
      startDate: "${filterForm?.startDate || null}"
      endDate: "${filterForm?.endDate || null}"
    selection: agentId ticketCount surveyCount avgCsat avgNps avgCes
- type: crud
  title: 客服 CSAT/NPS/CES 明细
  source: ${agentCsatData}
  syncLocation: false
  headerToolbar: []
  footerToolbar: []
  columns:
  - name: agentId
    label: 客服ID
  - name: ticketCount
    label: 工单数
  - name: surveyCount
    label: 调查回复数
  - name: avgCsat
    label: 平均CSAT
  - name: avgNps
    label: 平均NPS
  - name: avgCes
    label: 平均CES
