# CS 工单看板（F13 非标准视图，plan 2026-07-22-0845-3 §Phase 1 + plan 2026-08-29-1913-2 Phase 1）。
# 6 列 crud（按 erp-cs/ticket-status 字典：NEW/ASSIGNED/IN_PROGRESS/RESOLVED/CLOSED/CANCELLED）
# + 行级状态机 row-action（Phase 0 Explore (a) 降级裁决）。
# 经既有 @BizMutation：assign / start / resolve / close / reopen / cancel（ErpCsTicketBizModel）。
# SLA 超时卡片 🔴 标记（deadlineDateTime < now 且 isSlaCompleted=false）。
type: page
title: "工单看板"
remark: "6 列状态看板。行级按钮经 ErpCsTicket 状态机 mutation 触发迁移。SLA 超时卡片以 🔴 标记。"
i18nEn:
  title: "Ticket Kanban"
  remark: "6-column status board. Row-level buttons trigger transitions via the ErpCsTicket state machine mutations. SLA-breached cards are marked with 🔴."
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: "筛选"
    i18nEn: "Filter"
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-number
        name: customerId
        label: "客户ID"
        placeholder: "过滤客户"
        i18nEn:
          label: "Customer ID"
          placeholder: "Filter by customer"
        clearable: true
      - type: button
        label: "刷新看板"
        i18nEn: "Refresh Board"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: newData
          then:
            action: refreshSource
            targetId: assignedData
          then:
            action: refreshSource
            targetId: inProgressData
          then:
            action: refreshSource
            targetId: resolvedData
          then:
            action: refreshSource
            targetId: closedData
          then:
            action: refreshSource
            targetId: cancelledData

  # 6 个 data-source
  - type: data-source
    name: newData
    action: ajax
    args:
      url: '@query:ErpCsTicket__findPage'
      method: post
      data:
        filter_status: "NEW"
        filter_customerId: "${filterForm?.customerId || null}"
        limit: 50
      selection: id code subject priority status assignedToId deadlineDateTime isSlaCompleted customerId

  - type: data-source
    name: assignedData
    action: ajax
    args:
      url: '@query:ErpCsTicket__findPage'
      method: post
      data:
        filter_status: "ASSIGNED"
        filter_customerId: "${filterForm?.customerId || null}"
        limit: 50
      selection: id code subject priority status assignedToId deadlineDateTime isSlaCompleted customerId

  - type: data-source
    name: inProgressData
    action: ajax
    args:
      url: '@query:ErpCsTicket__findPage'
      method: post
      data:
        filter_status: "IN_PROGRESS"
        filter_customerId: "${filterForm?.customerId || null}"
        limit: 50
      selection: id code subject priority status assignedToId deadlineDateTime isSlaCompleted customerId

  - type: data-source
    name: resolvedData
    action: ajax
    args:
      url: '@query:ErpCsTicket__findPage'
      method: post
      data:
        filter_status: "RESOLVED"
        filter_customerId: "${filterForm?.customerId || null}"
        limit: 50
      selection: id code subject priority status assignedToId deadlineDateTime isSlaCompleted customerId

  - type: data-source
    name: closedData
    action: ajax
    args:
      url: '@query:ErpCsTicket__findPage'
      method: post
      data:
        filter_status: "CLOSED"
        filter_customerId: "${filterForm?.customerId || null}"
        limit: 50
      selection: id code subject priority status assignedToId deadlineDateTime isSlaCompleted customerId

  - type: data-source
    name: cancelledData
    action: ajax
    args:
      url: '@query:ErpCsTicket__findPage'
      method: post
      data:
        filter_status: "CANCELLED"
        filter_customerId: "${filterForm?.customerId || null}"
        limit: 50
      selection: id code subject priority status assignedToId deadlineDateTime isSlaCompleted customerId

  - type: grid
    className: m-3
    columns:
      # ① NEW
      - type: crud
        name: colNew
        title: "① 新建 (NEW)"
        i18nEn: "① New (NEW)"
        headerToolbar: []
        footerToolbar: ["statistics"]
        syncLocation: false
        className: bg-warning-subtle
        source: ${newData?.items ?? []}
        columns:
          - name: code
            label: "单号"
            i18nEn: "Doc No"
            width: 130
          - name: subject
            label: "主题"
            i18nEn: "Subject"
            width: 200
          - name: priority
            label: "优先级"
            i18nEn: "Priority"
            type: tpl
            tpl: '<span class="label label-${priority == "URGENT" || priority == "HIGH" ? "danger" : priority == "MEDIUM" ? "warning" : "default"}">${priority}</span>'
          - name: deadlineDateTime
            label: "SLA"
            type: tpl
            tpl: '<span class="${deadlineDateTime && !isSlaCompleted ? "text-danger" : "text-muted"}">${deadlineDateTime ? deadlineDateTime : "—"}</span>'
          - type: operation
            label: "操作"
            i18nEn: "Actions"
            buttons:
              - type: button
                label: "分派"
                i18nEn: "Assign"
                level: primary
                size: sm
                actionType: dialog
                dialog:
                  title: "分派工单"
                  i18nEn: "Assign Ticket"
                  body:
                    type: form
                    api:
                      method: post
                      url: '@mutation:ErpCsTicket__assign'
                      data:
                        ticketId: "${id}"
                        assignedToId: "${assignedToId}"
                    body:
                      - type: input-text
                        name: assignedToId
                        label: "处理人用户ID"
                        placeholder: "分配给处理人（用户ID）"
                        i18nEn:
                          label: "Assignee User ID"
                          placeholder: "Assign to handler (user ID)"

      # ② ASSIGNED
      - type: crud
        name: colAssigned
        title: "② 已分派 (ASSIGNED)"
        i18nEn: "② Assigned (ASSIGNED)"
        headerToolbar: []
        footerToolbar: ["statistics"]
        syncLocation: false
        source: ${assignedData?.items ?? []}
        columns:
          - name: code
            label: "单号"
            i18nEn: "Doc No"
            width: 130
          - name: subject
            label: "主题"
            i18nEn: "Subject"
            width: 200
          - name: priority
            label: "优先级"
            i18nEn: "Priority"
            type: tpl
            tpl: '<span class="label label-${priority == "URGENT" || priority == "HIGH" ? "danger" : priority == "MEDIUM" ? "warning" : "default"}">${priority}</span>'
          - name: deadlineDateTime
            label: "SLA"
            type: tpl
            tpl: '<span class="${deadlineDateTime && !isSlaCompleted ? "text-danger" : "text-muted"}">${deadlineDateTime ? deadlineDateTime : "—"}</span>'
          - type: operation
            label: "操作"
            i18nEn: "Actions"
            buttons:
              - type: button
                label: "开始"
                level: primary
                size: sm
                confirmText: "确认开始处理？"
                i18nEn:
                  label: "Start"
                  confirmText: "Confirm starting processing?"
                api:
                  method: post
                  url: '@mutation:ErpCsTicket__start'
                  data:
                    ticketId: "${id}"

      # ③ IN_PROGRESS
      - type: crud
        name: colInProgress
        title: "③ 处理中 (IN_PROGRESS)"
        i18nEn: "③ In Progress (IN_PROGRESS)"
        headerToolbar: []
        footerToolbar: ["statistics"]
        syncLocation: false
        source: ${inProgressData?.items ?? []}
        columns:
          - name: code
            label: "单号"
            i18nEn: "Doc No"
            width: 130
          - name: subject
            label: "主题"
            i18nEn: "Subject"
            width: 200
          - name: priority
            label: "优先级"
            i18nEn: "Priority"
            type: tpl
            tpl: '<span class="label label-${priority == "URGENT" || priority == "HIGH" ? "danger" : priority == "MEDIUM" ? "warning" : "default"}">${priority}</span>'
          - name: deadlineDateTime
            label: "SLA"
            type: tpl
            tpl: '<span class="${deadlineDateTime && !isSlaCompleted ? "text-danger" : "text-muted"}">${deadlineDateTime ? deadlineDateTime : "—"} ${deadlineDateTime && !isSlaCompleted ? "🔴" : ""}</span>'
          - type: operation
            label: "操作"
            i18nEn: "Actions"
            buttons:
              - type: button
                label: "解决"
                i18nEn: "Resolve"
                level: success
                size: sm
                actionType: dialog
                dialog:
                  title: "标记工单解决"
                  i18nEn: "Mark Ticket Resolved"
                  body:
                    type: form
                    api:
                      method: post
                      url: '@mutation:ErpCsTicket__resolve'
                      data:
                        ticketId: "${id}"
                        resolution: "${resolution}"
                    body:
                      - type: textarea
                        name: resolution
                        label: "解决说明"
                        placeholder: "可选：记录解决方案"
                        i18nEn:
                          label: "Resolution"
                          placeholder: "Optional: record the resolution"

      # ④ RESOLVED
      - type: crud
        name: colResolved
        title: "④ 已解决 (RESOLVED)"
        i18nEn: "④ Resolved (RESOLVED)"
        headerToolbar: []
        footerToolbar: ["statistics"]
        syncLocation: false
        source: ${resolvedData?.items ?? []}
        columns:
          - name: code
            label: "单号"
            i18nEn: "Doc No"
            width: 130
          - name: subject
            label: "主题"
            i18nEn: "Subject"
            width: 200
          - name: priority
            label: "优先级"
            i18nEn: "Priority"
            type: tpl
            tpl: '<span class="label label-${priority == "URGENT" || priority == "HIGH" ? "danger" : priority == "MEDIUM" ? "warning" : "default"}">${priority}</span>'
          - type: operation
            label: "操作"
            i18nEn: "Actions"
            buttons:
              - type: button
                label: "关闭"
                level: success
                size: sm
                confirmText: "确认关闭工单？"
                i18nEn:
                  label: "Close"
                  confirmText: "Confirm closing this ticket?"
                api:
                  method: post
                  url: '@mutation:ErpCsTicket__close'
                  data:
                    ticketId: "${id}"
              - type: button
                label: "重开"
                level: warning
                size: sm
                confirmText: "确认驳回重开？将退回「处理中」"
                i18nEn:
                  label: "Reopen"
                  confirmText: "Confirm reject-and-reopen? It will move back to \"In Progress\""
                api:
                  method: post
                  url: '@mutation:ErpCsTicket__reopen'
                  data:
                    ticketId: "${id}"

      # ⑤ CLOSED
      - type: crud
        name: colClosed
        title: "⑤ 已关闭 (CLOSED)"
        i18nEn: "⑤ Closed (CLOSED)"
        headerToolbar: []
        footerToolbar: ["statistics"]
        syncLocation: false
        source: ${closedData?.items ?? []}
        columns:
          - name: code
            label: "单号"
            i18nEn: "Doc No"
            width: 130
          - name: subject
            label: "主题"
            i18nEn: "Subject"
            width: 200
          - name: priority
            label: "优先级"
            i18nEn: "Priority"
            type: tpl
            tpl: '<span class="label label-default">${priority}</span>'

      # ⑥ CANCELLED
      - type: crud
        name: colCancelled
        title: "⑥ 已取消 (CANCELLED)"
        i18nEn: "⑥ Cancelled (CANCELLED)"
        headerToolbar: []
        footerToolbar: ["statistics"]
        syncLocation: false
        source: ${cancelledData?.items ?? []}
        columns:
          - name: code
            label: "单号"
            i18nEn: "Doc No"
            width: 130
          - name: subject
            label: "主题"
            i18nEn: "Subject"
            width: 200
          - name: priority
            label: "优先级"
            i18nEn: "Priority"
            type: tpl
            tpl: '<span class="label label-default">${priority}</span>'
