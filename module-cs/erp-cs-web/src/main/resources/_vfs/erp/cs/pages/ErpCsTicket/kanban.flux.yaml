# CS 工单看板（F13 flux 原生重写，plan 2026-08-03-1232-2 §Phase 1）。
# flux kanban 原生组件 + 后端 findBoardData 聚合查询返回扁平图结构（6 列 + SLA 标记）。
# 拖拽语义（Phase 0 Decision）：onCardMove 按目标列路由 mutation（assign/start/resolve/close/reopen）。
type: page
title: 工单看板
i18nEn: Ticket Kanban
body:
- type: data-source
  name: boardData
  dependsOn:
  - __board_load__
  action: ajax
  args:
    url: '@query:ErpCsTicket__findBoardData'
    method: post
    data:
      customerId: ${customerId ?? null}
- type: form
  submitScope: surface
  body:
  - type: grid
    columns: 6
    items:
    - colSpan: 4
      body:
      - type: input-number
        name: customerId
        label: 客户ID
        placeholder: 过滤客户
        i18nEn:
          label: Customer ID
          placeholder: Filter by customer
        clearable: true
    - colSpan: 2
      body:
      - type: button
        label: 刷新看板
        i18nEn: Refresh Board
        actionType: ajax
        action: ajax
        args:
          url: '@query:ErpCsTicket__findBoardData'
          method: post
          data:
            customerId: ${customerId ?? null}
        target: boardData
- type: kanban
  data: ${boardData}
  draggable: true
  columnWidth: 280
  cardTemplate:
  - type: text
    text: ${card.data.title}
    className: font-medium text-sm
  - type: status
    value: ${card.data.priority}
    labelMap:
      URGENT: 紧急
      HIGH: 高
      MEDIUM: 中
      LOW: 低
      i18nEn:
        URGENT: Urgent
        HIGH: High
        MEDIUM: Medium
        LOW: Low
    levelMap:
      URGENT: error
      HIGH: error
      MEDIUM: warning
      LOW: default
  - type: text
    text: '${card.data.deadlineDateTime && !card.data.isSlaCompleted ? "🔴 SLA超时 " + card.data.deadlineDateTime : (card.data.deadlineDateTime ? card.data.deadlineDateTime : "")}'
    i18nEn: '${card.data.deadlineDateTime && !card.data.isSlaCompleted ? "🔴 SLA breached " + card.data.deadlineDateTime : (card.data.deadlineDateTime ? card.data.deadlineDateTime : "")}'
    className: text-xs text-red-500
    visible: ${card.data.deadlineDateTime && !card.data.isSlaCompleted}
  onCardMove:
    action: ajax
    args:
      # cs-026-r3：路由条件式覆盖全部 6 列——col-CANCELLED 补 cancel 分支（状态机 cancel:
      # NEW/ASSIGNED/IN_PROGRESS/RESOLVED→CANCELLED）；col-NEW 无合法迁移边（状态机无回 NEW 边）
      # 落空 url 拒绝拖拽（禁拖语义），替换旧 fallback start 必错路由。
      url: '${event.toColumnId === "col-ASSIGNED" ? "@mutation:ErpCsTicket__assign" : event.toColumnId === "col-IN_PROGRESS" ? (event.fromColumnId === "col-RESOLVED" ? "@mutation:ErpCsTicket__reopen" : "@mutation:ErpCsTicket__start") : event.toColumnId === "col-RESOLVED" ? "@mutation:ErpCsTicket__resolve" : event.toColumnId === "col-CLOSED" ? "@mutation:ErpCsTicket__close" : event.toColumnId === "col-CANCELLED" ? "@mutation:ErpCsTicket__cancel" : ""}'
      method: post
      data:
        ticketId: ${event.cardId.substring(5)}
  onCardClick:
    action: showToast
    args:
      level: info
      message: ${"点击工单 " + event.cardId}
      i18nEn: ${"Ticket clicked " + event.cardId}
