name: Compliance Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CI: true

jobs:
  compliance:
    name: Anti-pattern regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run nop-compliance-checker
        run: |
          bash docs/audits/nop-compliance-checker.sh > checker-output.txt 2>&1
          echo "===== checker output ====="
          cat checker-output.txt
      - name: Enforce baseline gate
        # Phase 1 Decision: option (b) — gate logic lives in CI, checker script stays a pure reporter.
        # Parses the checker summary table and compares each rule's actual count against the
        # machine-readable baseline block in docs/audits/compliance-baseline.md.
        # Gate direction: one-way tightening. actual > baseline => fail. actual <= baseline => pass.
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          repo = pathlib.Path('.')
          out_text = (repo / 'checker-output.txt').read_text(encoding='utf-8', errors='replace')
          base_text = (repo / 'docs/audits/compliance-baseline.md').read_text(encoding='utf-8', errors='replace')

          # --- Parse checker summary: lines like "R1a    dao().saveEntity ... 0" => R1a=0 ---
          actual = {}
          rule_re = re.compile(r'^\s*(R\d+[a-d]?)\b.*?(\d+)\s*$', re.UNICODE)
          in_summary = False
          for line in out_text.splitlines():
              if '汇总' in line or 'Summary' in line:
                  in_summary = True
              if not in_summary:
                  continue
              m = rule_re.match(line)
              if m:
                  rule, count = m.group(1), int(m.group(2))
                  # ignore the "------" separator (no digit) and header rows
                  actual[rule] = count

          # --- Parse baseline YAML block between ```yaml ... ``` in baseline doc ---
          baseline = {}
          m = re.search(r'```yaml\n(.*?)\n```', base_text, re.DOTALL)
          if not m:
              print('ERROR: cannot locate ```yaml baseline block in docs/audits/compliance-baseline.md')
              sys.exit(2)
          for row in m.group(1).splitlines():
              row = row.strip()
              if not row or row.startswith('#'):
                  continue
              if ':' in row:
                  k, v = row.split(':', 1)
                  baseline[k.strip()] = int(v.strip())

          # --- Compare (one-way tightening) ---
          regressions = []
          improvements = []
          missing_actual = []
          for rule, base in sorted(baseline.items()):
              act = actual.get(rule)
              if act is None:
                  missing_actual.append(rule)
                  continue
              if act > base:
                  regressions.append((rule, base, act))
              elif act < base:
                  improvements.append((rule, base, act))

          print('===== baseline gate result =====')
          print(f'baseline rules: {len(baseline)} | parsed actual rules: {len(actual)}')
          if missing_actual:
              print(f'WARN: rules in baseline but missing from checker output: {missing_actual}')
          if improvements:
              print('improvements (actual < baseline, encouraged, non-blocking):')
              for r, b, a in improvements:
                  print(f'  {r}: baseline {b} -> actual {a}')
          if regressions:
              print('REGRESSIONS (actual > baseline => FAIL):')
              for r, b, a in regressions:
                  print(f'  {r}: baseline {b} -> actual {a}  (+{a-b})')
              print('')
              print('To raise a baseline, open an independent plan and adjudicate each new hit')
              print('(see docs/audits/compliance-baseline.md "回归门控规则").')
              sys.exit(1)
          print('OK: no rule exceeds baseline. Gate PASSED.')
          PY
      - name: Upload checker output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-checker-output
          path: checker-output.txt
          retention-days: 30

  web-pages-validation:
    name: app-erp-all web pages validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # Phase 2 Decision: option (a) — reuse the existing non-@Disabled aggregate test
      # ErpAllWebPagesTest (PAGE_ERROR_COUNT=0 assertion) instead of assembling 19 domain
      # full-app tag tests. The 19 domain-level tests are un-@Disabled (tag-gated) to clear
      # the suppression count; CI enforcement reuses this single aggregate test.
      - name: Run ErpAllWebPagesTest in app-erp-all
        run: mvn -B -pl app-erp-all -am test -Dtest=ErpAllWebPagesTest
