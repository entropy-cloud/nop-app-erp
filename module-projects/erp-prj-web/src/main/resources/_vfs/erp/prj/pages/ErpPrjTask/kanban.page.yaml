# Project 任务看板（F13 非标准视图，plan 2026-07-22-0845-3 §Phase 1 + plan 2026-08-29-1913-2 Phase 1）。
# 4 列 crud（TODO/IN_PROGRESS/DONE/BLOCKED）+ 行级状态机 row-action。
# 经 Phase 0 Explore (a) 降级裁决：不使用拖拽，行级按钮触发既有 @BizMutation
#   startTask / completeTask / blockTask(blockReason) / unblockTask（task-dag.md §4）。
# 优先级颜色（erp-prj/priority 字典）+ BLOCKED 卡片 blockReason 显示。
type: page
title: "任务看板"
remark: "4 列状态看板（待开始 / 进行中 / 已完成 / 阻塞）。行级按钮经 ErpPrjTask 状态机 mutation 触发迁移。DONE 列只读。"
body:
  - type: form
    name: filterForm
    title: "筛选"
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-number
        name: projectId
        label: "项目ID"
        placeholder: "过滤项目"
        clearable: true
      - type: button
        label: "刷新看板"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: todoData
          then:
            action: refreshSource
            targetId: inProgressData
          then:
            action: refreshSource
            targetId: doneData
          then:
            action: refreshSource
            targetId: blockedData

  - type: data-source
    name: todoData
    action: ajax
    args:
      url: '@query:ErpPrjTask__findPage'
      method: post
      data:
        filter_status: "TODO"
        filter_projectId: "${filterForm?.projectId || null}"
        limit: 50
      selection: id title priority blockReason plannedEndDate assigneeId status

  - type: data-source
    name: inProgressData
    action: ajax
    args:
      url: '@query:ErpPrjTask__findPage'
      method: post
      data:
        filter_status: "IN_PROGRESS"
        filter_projectId: "${filterForm?.projectId || null}"
        limit: 50
      selection: id title priority blockReason plannedEndDate assigneeId status

  - type: data-source
    name: doneData
    action: ajax
    args:
      url: '@query:ErpPrjTask__findPage'
      method: post
      data:
        filter_status: "DONE"
        filter_projectId: "${filterForm?.projectId || null}"
        limit: 50
      selection: id title priority plannedEndDate actualEndDate assigneeId status

  - type: data-source
    name: blockedData
    action: ajax
    args:
      url: '@query:ErpPrjTask__findPage'
      method: post
      data:
        filter_status: "BLOCKED"
        filter_projectId: "${filterForm?.projectId || null}"
        limit: 50
      selection: id title priority blockReason plannedEndDate assigneeId status

  - type: grid
    className: m-3
    columns:
      # ① TODO 待开始
      - type: crud
        name: colTodo
        title: "① 待开始 (TODO)"
        headerToolbar: []
        footerToolbar: ["statistics"]
        syncLocation: false
        source: ${todoData?.items ?? []}
        columns:
          - name: title
            label: "任务标题"
            width: 200
          - name: priority
            label: "优先级"
            type: tpl
            tpl: '<span class="label label-${priority == "HIGH" || priority == "URGENT" ? "danger" : priority == "MEDIUM" ? "warning" : "default"}">${priority}</span>'
          - name: plannedEndDate
            label: "计划结束"
            type: date
            format: YYYY-MM-DD
          - type: operation
            label: "操作"
            buttons:
              - type: button
                label: "开始"
                level: primary
                size: sm
                confirmText: "确认开始任务？将迁移到「进行中」"
                api:
                  method: post
                  url: '@mutation:ErpPrjTask__startTask'
                  data:
                    taskId: "${id}"
                onEvent:
                  after-success:
                    action: refreshSource
                    targetId: todoData
                    then:
                      action: refreshSource
                      targetId: inProgressData

      # ② IN_PROGRESS 进行中
      - type: crud
        name: colInProgress
        title: "② 进行中 (IN_PROGRESS)"
        headerToolbar: []
        footerToolbar: ["statistics"]
        syncLocation: false
        source: ${inProgressData?.items ?? []}
        columns:
          - name: title
            label: "任务标题"
            width: 200
          - name: priority
            label: "优先级"
            type: tpl
            tpl: '<span class="label label-${priority == "HIGH" || priority == "URGENT" ? "danger" : priority == "MEDIUM" ? "warning" : "default"}">${priority}</span>'
          - name: plannedEndDate
            label: "计划结束"
            type: date
            format: YYYY-MM-DD
          - type: operation
            label: "操作"
            buttons:
              - type: button
                label: "完成"
                level: success
                size: sm
                confirmText: "确认完成任务？将迁移到「已完成」"
                api:
                  method: post
                  url: '@mutation:ErpPrjTask__completeTask'
                  data:
                    taskId: "${id}"
                onEvent:
                  after-success:
                    action: refreshSource
                    targetId: inProgressData
                    then:
                      action: refreshSource
                      targetId: doneData
              - type: button
                label: "阻塞"
                level: danger
                size: sm
                actionType: dialog
                dialog:
                  title: "标记任务阻塞"
                  body:
                    type: form
                    api:
                      method: post
                      url: '@mutation:ErpPrjTask__blockTask'
                      data:
                        taskId: "${id}"
                        blockReason: "${blockReason}"
                    body:
                      - type: textarea
                        name: blockReason
                        label: "阻塞原因"
                        required: true
                        placeholder: "必填：阻塞原因"

      # ③ DONE 已完成（只读）
      - type: crud
        name: colDone
        title: "③ 已完成 (DONE)"
        headerToolbar: []
        footerToolbar: ["statistics"]
        syncLocation: false
        source: ${doneData?.items ?? []}
        columns:
          - name: title
            label: "任务标题"
            width: 200
          - name: priority
            label: "优先级"
            type: tpl
            tpl: '<span class="label label-default">${priority}</span>'
          - name: actualEndDate
            label: "实际完成"
            type: date
            format: YYYY-MM-DD

      # ④ BLOCKED 阻塞
      - type: crud
        name: colBlocked
        title: "④ 阻塞 (BLOCKED)"
        headerToolbar: []
        footerToolbar: ["statistics"]
        syncLocation: false
        source: ${blockedData?.items ?? []}
        columns:
          - name: title
            label: "任务标题"
            width: 200
          - name: priority
            label: "优先级"
            type: tpl
            tpl: '<span class="label label-${priority == "HIGH" || priority == "URGENT" ? "danger" : priority == "MEDIUM" ? "warning" : "default"}">${priority}</span>'
          - name: blockReason
            label: "阻塞原因"
            type: tpl
            tpl: '<span class="text-danger">⚠ ${blockReason}</span>'
          - type: operation
            label: "操作"
            buttons:
              - type: button
                label: "解除阻塞"
                level: warning
                size: sm
                confirmText: "确认解除阻塞？将迁移回「进行中」"
                api:
                  method: post
                  url: '@mutation:ErpPrjTask__unblockTask'
                  data:
                    taskId: "${id}"
                onEvent:
                  after-success:
                    action: refreshSource
                    targetId: blockedData
                    then:
                      action: refreshSource
                      targetId: inProgressData