# 项目结算单工作台（plan 2026-08-03-1232-4 Phase 3 + plan 2026-08-29-1913-2 Phase 1）。
# 数据来源：ErpPrjProjectSettlement 实体 findPage（createSettlement→approve→posted 链已实现）。零后端 delta。
type: page
title: "项目结算单"
i18nEn: "Project Settlement"
body:
  - type: data-source
    name: settlementData
    action: ajax
    args:
      url: '@query:ErpPrjProjectSettlement__findPage'
      method: post
      data:
        query:
          limit: 200
      selection: id code projectId customerId businessDate settlementType finalRevenue finalCost finalProfit docStatus

  - type: grid
    className: m-3
    gap: sm
    columns: 4
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "结算单数"
                i18nEn: "Settlements"
              - type: text
                tag: span
                className: h3
                text: "${settlementData?.items?.length ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "最终收入"
                i18nEn: "Final Revenue"
              - type: text
                tag: span
                className: h3 text-success
                text: "¥${ROUND(((settlementData?.items ?? []).reduce((s, r) => s + (Number(r.finalRevenue) || 0), 0) ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "最终成本"
                i18nEn: "Final Cost"
              - type: text
                tag: span
                className: h3 text-danger
                text: "¥${ROUND(((settlementData?.items ?? []).reduce((s, r) => s + (Number(r.finalCost) || 0), 0) ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "最终利润"
                i18nEn: "Final Profit"
              - type: text
                tag: span
                className: h3 text-primary
                text: "¥${ROUND(((settlementData?.items ?? []).reduce((s, r) => s + (Number(r.finalProfit) || 0), 0) ?? 0), 2)}"

  - type: crud
    className: m-3
    title: "结算单列表"
    i18nEn: "Settlement List"
    source: ${settlementData?.items ?? []}
    syncLocation: false
    columns:
      - name: code
        label: "单号"
        i18nEn: "Doc No"
      - name: projectId
        label: "项目"
        i18nEn: "Project"
      - name: customerId
        label: "客户"
        i18nEn: "Customer"
      - name: businessDate
        label: "业务日期"
        i18nEn: "Business Date"
      - name: settlementType
        label: "结算类型"
        i18nEn: "Settlement Type"
      - name: finalRevenue
        label: "最终收入"
        i18nEn: "Final Revenue"
      - name: finalCost
        label: "最终成本"
        i18nEn: "Final Cost"
      - name: finalProfit
        label: "最终利润"
        i18nEn: "Final Profit"
      - name: docStatus
        label: "状态"
        i18nEn: "Status"