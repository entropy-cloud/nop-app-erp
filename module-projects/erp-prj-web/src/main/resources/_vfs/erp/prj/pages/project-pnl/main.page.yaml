# 项目损益汇总工作台（plan 2026-08-03-1232-4 Phase 3 + plan 2026-08-29-1913-2 Phase 1）。
# 数据来源：ErpPrjProjectPnl 实体 findPage。零后端 delta。
type: page
title: "项目损益汇总"
body:
  - type: data-source
    name: pnlData
    action: ajax
    args:
      url: '@query:ErpPrjProjectPnl__findPage'
      method: post
      data:
        query:
          limit: 200
      selection: id code projectId periodFrom periodTo revenueAmount totalCost grossProfit grossMarginPct calcStatus

  - type: grid
    className: m-3
    gap: sm
    columns: 4
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "损益记录数"
              - type: text
                tag: span
                className: h3
                text: "${pnlData?.items?.length ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "总收入"
              - type: text
                tag: span
                className: h3 text-success
                text: "¥${(pnlData?.items ?? []).reduce((s, r) => s + (Number(r.revenueAmount) || 0), 0) ?? 0 | round:2}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "总成本"
              - type: text
                tag: span
                className: h3 text-danger
                text: "¥${(pnlData?.items ?? []).reduce((s, r) => s + (Number(r.totalCost) || 0), 0) ?? 0 | round:2}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "总毛利"
              - type: text
                tag: span
                className: h3 text-primary
                text: "¥${(pnlData?.items ?? []).reduce((s, r) => s + (Number(r.grossProfit) || 0), 0) ?? 0 | round:2}"

  - type: crud
    className: m-3
    title: "损益记录列表"
    source: ${pnlData?.items ?? []}
    syncLocation: false
    columns:
      - { name: code, label: "单号" }
      - { name: projectId, label: "项目" }
      - { name: periodFrom, label: "起始期间" }
      - { name: periodTo, label: "结束期间" }
      - { name: revenueAmount, label: "收入" }
      - { name: totalCost, label: "成本" }
      - { name: grossProfit, label: "毛利" }
      - { name: grossMarginPct, label: "毛利率" }
      - { name: calcStatus, label: "计算状态" }