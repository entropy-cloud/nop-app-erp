# 项目概览 dashboard（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + chart + 2 crud。
# 数据源：ErpPrjDashboard__getDashboardKpi / __getProjectGrossMargin / __getProjectStatusDistribution
#       / __findCostOverrunAlert / __findDelayedProjectAlert。
type: page
title: "项目概览"
i18nEn: "Project Overview"
body:
  - type: button
    label: "刷新"
    i18nEn: "Refresh"
    icon: refresh-cw
    className: m-3
    onClick:
      action: refreshSource
      targetId: kpiData
      then:
        action: refreshSource
        targetId: grossMarginData
      then:
        action: refreshSource
        targetId: statusData
      then:
        action: refreshSource
        targetId: costOverrunData
      then:
        action: refreshSource
        targetId: delayedProjectData

  - type: data-source
    name: kpiData
    action: ajax
    args:
      url: '@query:ErpPrjDashboard__getDashboardKpi'
      selection: openProjectCount totalBudget incurredCost executionRate

  - type: grid
    className: m-3
    gap: sm
    columns: 4
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "在手项目数"
                i18nEn: "Open Projects"
              - type: text
                tag: span
                className: h3 font-bold
                text: "${kpiData?.openProjectCount ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "项目总预算"
                i18nEn: "Total Budget"
              - type: text
                tag: span
                className: h3 text-primary
                text: "¥${ROUND((kpiData?.totalBudget ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "已发生成本"
                i18nEn: "Incurred Cost"
              - type: text
                tag: span
                className: h3 text-danger
                text: "¥${ROUND((kpiData?.incurredCost ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "预算执行率"
                i18nEn: "Budget Execution Rate"
              - type: text
                tag: span
                className: h3 text-warning
                text: "${ROUND((kpiData?.executionRate ?? 0), 2)}"

  - type: data-source
    name: grossMarginData
    action: ajax
    args:
      url: '@query:ErpPrjDashboard__getProjectGrossMargin'
      method: post
      data:
        projectId: "${filterForm?.projectId || null}"
      selection: projectCount totalRevenue totalCost grossMarginPct

  - type: grid
    className: m-3
    gap: sm
    columns: 4
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "项目损益汇总数"
                i18nEn: "Projects in P&L Summary"
              - type: text
                tag: span
                className: h3 font-bold
                text: "${grossMarginData?.projectCount ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "收入合计"
                i18nEn: "Total Revenue"
              - type: text
                tag: span
                className: h3 text-primary
                text: "¥${ROUND((grossMarginData?.totalRevenue ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "成本合计"
                i18nEn: "Total Cost"
              - type: text
                tag: span
                className: h3 text-danger
                text: "¥${ROUND((grossMarginData?.totalCost ?? 0), 2)}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "整体毛利率"
                i18nEn: "Overall Gross Margin"
              - type: text
                tag: span
                className: h3 text-success
                text: "${ROUND((grossMarginData?.grossMarginPct ?? 0), 4)}"

  - type: data-source
    name: statusData
    action: ajax
    args:
      url: '@query:ErpPrjDashboard__getProjectStatusDistribution'
      selection: status count

  - type: chart
    chartType: pie
    title: "项目状态分布"
    i18nEn: "Project Status Distribution"
    source: ${statusData ?? []}
    height: 300
    series:
      - dataRegionKey: count
        name: "项目数"
        i18nEn: "Projects"
        nameField: status

  - type: data-source
    name: costOverrunData
    action: ajax
    args:
      url: '@query:ErpPrjDashboard__findCostOverrunAlert'
      selection: projectCode projectName budget incurredCost overrunAmount

  - type: crud
    className: m-3
    title: "成本超支项目预警"
    i18nEn: "Cost Overrun Alert"
    source: ${costOverrunData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: projectCode
        label: "项目编码"
        i18nEn: "Project Code"
      - name: projectName
        label: "项目名称"
        i18nEn: "Project Name"
      - name: budget
        label: "预算"
        i18nEn: "Budget"
      - name: incurredCost
        label: "已发生成本"
        i18nEn: "Incurred Cost"
      - name: overrunAmount
        label: "超支金额"
        i18nEn: "Overrun Amount"

  - type: data-source
    name: delayedProjectData
    action: ajax
    args:
      url: '@query:ErpPrjDashboard__findDelayedProjectAlert'
      selection: projectCode projectName endDate status overdueDays

  - type: crud
    className: m-3
    title: "项目延期预警（计划完成日 < 今天 且 未 COMPLETED）"
    i18nEn: "Delayed Project Alert (planned end < today and not COMPLETED)"
    source: ${delayedProjectData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: projectCode
        label: "项目编码"
        i18nEn: "Project Code"
      - name: projectName
        label: "项目名称"
        i18nEn: "Project Name"
      - name: endDate
        label: "计划完成日"
        i18nEn: "Planned End Date"
      - name: status
        label: "状态"
        i18nEn: "Status"
      - name: overdueDays
        label: "逾期(天)"
        i18nEn: "Overdue (Days)"