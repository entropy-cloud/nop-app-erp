# HR 组织架构图（F16 P2 复杂页面，plan 2026-07-22-1400-2 §Phase 1 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → tree 控件。
# 数据来源：ErpHrDepartment__findPage（parentId 层级）+ ErpHrEmployee__findPage。
# 原 AMIS type:tree 渲染器在 Nop bundle 中不存在，flux tree 控件原生支持。
# 字段名经实时仓库核实：ErpHrDepartment.name/managerId/parentId/code；ErpHrEmployee.fullName/code/departmentId。
type: page
title: "组织架构图"
remark: "部门层级（ErpHrDepartment parent→children 嵌套）。每节点含员工数（ErpHrEmployee 按 departmentId 聚合）+ 负责人(managerId)。"
body:
  - type: data-source
    name: deptData
    action: ajax
    args:
      url: '@query:ErpHrDepartment__findPage'
      method: post
      data:
        query:
          limit: 5000
      selection: id parentId name code managerId

  - type: data-source
    name: empData
    action: ajax
    args:
      url: '@query:ErpHrEmployee__findPage'
      method: post
      data:
        query:
          limit: 5000
      selection: id departmentId fullName code positionId

  - type: tree
    className: m-3
    title: "组织架构"
    source: ${deptData?.items ?? []}
    labelField: name
    keyField: id
    childrenKey: children
    options:
      - { value: empCount, label: "员工数" }
      - { value: managerId, label: "负责人" }
      - { value: empNames, label: "成员" }