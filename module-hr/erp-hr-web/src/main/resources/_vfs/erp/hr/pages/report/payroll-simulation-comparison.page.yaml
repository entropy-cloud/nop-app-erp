# 薪酬模拟对比报表（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → html。
type: page
title: "薪酬模拟对比报表"
i18nEn: "Payroll Simulation Comparison Report"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-number
        name: simulationId
        label: "薪酬模拟ID"
        placeholder: "输入模拟方案ID"
        i18nEn:
          label: "Payroll Simulation ID"
          placeholder: "Enter simulation scenario ID"
        value: 1
      - type: button
        label: "渲染报表"
        i18nEn: "Render Report"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        i18nEn: "Download XLSX"
        actionType: download
        api:
          url: /p/ErpHrReport__download
          method: post
          responseType: blob
          data:
            reportName: "payroll-simulation-comparison"
            renderType: "xlsx"
            data:
              simulationId: "${filterForm?.simulationId}"
      - type: button
        label: "下载 PDF"
        i18nEn: "Download PDF"
        actionType: download
        api:
          url: /p/ErpHrReport__download
          method: post
          responseType: blob
          data:
            reportName: "payroll-simulation-comparison"
            renderType: "pdf"
            data:
              simulationId: "${filterForm?.simulationId}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpHrReport__renderHtml'
      method: post
      data:
        reportName: "payroll-simulation-comparison"
        data:
          simulationId: "${filterForm?.simulationId}"

  - type: html
    className: m-3
    sanitize: false
    content: "${reportHtmlData ?? ''}"