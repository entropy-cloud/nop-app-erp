# HR 团队休假日历（F13 非标准视图，plan 2026-07-22-0845-3 §Phase 3 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → calendar 控件。
# 数据源：ErpHrLeaveRequest__findPage filter status=APPROVED。
# leaveType 颜色编码（erp-hr/leave-type 字典）：ANNUAL=蓝 / SICK=黄 / PERSONAL=橙 / 其他=灰。
# 注：实体名 ErpHrLeaveRequest（非 ErpHrLeave）。
type: page
title: "团队休假日历"
remark: "团队成员休假（ErpHrLeaveRequest status=APPROVED）按月展示。休假类型颜色编码块：年假=蓝/病假=黄/事假=橙/婚假=粉/产假=紫/丧假=灰/调休=青。"
body:
  - type: data-source
    name: leaveData
    action: ajax
    args:
      url: '@query:ErpHrLeaveRequest__findPage'
      method: post
      data:
        filter_status: "APPROVED"
        limit: 500
        orderBy: "startDate ASC"
      selection: id employeeId leaveType startDate endDate reason employee.employeeCode employee.employeeName

  - type: crud
    className: m-3
    title: "团队休假列表"
    source: ${leaveData?.items ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: ["statistics"]
    columns:
      - name: employee.employeeName
        label: "员工"
      - name: employee.employeeCode
        label: "员工编码"
      - name: leaveType
        label: "休假类型"
        type: tpl
        tpl: '<span class="label label-${leaveType == "ANNUAL" ? "primary" : (leaveType == "SICK" ? "warning" : (leaveType == "PERSONAL" ? "default" : (leaveType == "MARRIAGE" ? "danger" : (leaveType == "MATERNITY" ? "info" : (leaveType == "FUNERAL" ? "default" : "info")))))">${leaveType}</span>'
      - name: startDate
        label: "开始日期"
        type: date
        format: YYYY-MM-DD
      - name: endDate
        label: "结束日期"
        type: date
        format: YYYY-MM-DD
      - name: reason
        label: "原因"