# HR 薪酬核算审批（F16 P2 复杂页面，plan 2026-07-22-1400-2 §Phase 1 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + crud + row-action mutation。
# 数据来源：ErpHrSalary__findPage filter year/month。
# 字段名经实时仓库核实：grossSalary/netSalary/taxAmount。
# 实体无 departmentId 字段，分组维度改用 orgId（业务组织）。
type: page
title: "薪酬核算审批"
remark: "按年月过滤薪酬记录（ErpHrSalary），前端聚合汇总卡片 + 明细支持标记已发放(markPaid)/作废(voidSalary)。实体无 departmentId，分组维度用 orgId。"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: "薪酬期间筛选"
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-number
        name: year
        label: "年份"
        placeholder: "如 2026"
        value: 2026
        required: true
        clearable: true
      - type: select
        name: month
        label: "月份"
        value: 1
        options:
          - { label: "1月", value: 1 }
          - { label: "2月", value: 2 }
          - { label: "3月", value: 3 }
          - { label: "4月", value: 4 }
          - { label: "5月", value: 5 }
          - { label: "6月", value: 6 }
          - { label: "7月", value: 7 }
          - { label: "8月", value: 8 }
          - { label: "9月", value: 9 }
          - { label: "10月", value: 10 }
          - { label: "11月", value: 11 }
          - { label: "12月", value: 12 }
        clearable: true
      - type: button
        label: "刷新汇总与明细"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: salaryData

  - type: data-source
    name: salaryData
    action: ajax
    args:
      url: '@query:ErpHrSalary__findPage'
      method: post
      data:
        query:
          limit: 2000
          filter:
            year: "${filterForm?.year}"
            month: "${filterForm?.month}"
      selection: id year month orgId employeeId grossSalary netSalary taxAmount socialInsurance basicSalary paymentStatus approveStatus

  - type: grid
    className: m-3
    columns:
      - type: card
        className: panel panel-default
        body:
          - type: text
            tag: div
            className: text-muted
            text: "人数"
          - type: text
            tag: h3
            className: m-t-sm
            text: "${salaryData?.items?.length ?? 0}"
      - type: card
        className: panel panel-default
        body:
          - type: text
            tag: div
            className: text-muted
            text: "应发合计"
          - type: text
            tag: h3
            className: m-t-sm text-primary
            text: "${(salaryData?.items ?? []).reduce((s, r) => s + (Number(r.grossSalary) || 0), 0) ?? 0}"
      - type: card
        className: panel panel-default
        body:
          - type: text
            tag: div
            className: text-muted
            text: "社保合计"
          - type: text
            tag: h3
            className: m-t-sm text-warning
            text: "${(salaryData?.items ?? []).reduce((s, r) => s + (Number(r.socialInsurance) || 0), 0) ?? 0}"
      - type: card
        className: panel panel-default
        body:
          - type: text
            tag: div
            className: text-muted
            text: "个税合计"
          - type: text
            tag: h3
            className: m-t-sm text-danger
            text: "${(salaryData?.items ?? []).reduce((s, r) => s + (Number(r.taxAmount) || 0), 0) ?? 0}"
      - type: card
        className: panel panel-default
        body:
          - type: text
            tag: div
            className: text-muted
            text: "实发合计"
          - type: text
            tag: h3
            className: m-t-sm text-success
            text: "${(salaryData?.items ?? []).reduce((s, r) => s + (Number(r.netSalary) || 0), 0) ?? 0}"

  - type: crud
    className: m-3
    title: "薪酬明细（按年月过滤）"
    source: ${salaryData?.items ?? []}
    headerToolbar: []
    footerToolbar: ["statistics"]
    syncLocation: false
    columns:
      - { name: id, label: "ID" }
      - { name: employeeId, label: "员工ID" }
      - { name: orgId, label: "组织" }
      - { name: grossSalary, label: "应发", type: number, precision: 2 }
      - { name: socialInsurance, label: "社保", type: number, precision: 2 }
      - { name: taxAmount, label: "个税", type: number, precision: 2 }
      - { name: netSalary, label: "实发", type: number, precision: 2 }
      - name: paymentStatus
        label: "支付状态"
        cell:
          type: text
          text: '<span class="label label-${paymentStatus == "PAID" ? "success" : (paymentStatus == "VOID" ? "default" : "warning")}">${paymentStatus}</span>'
      - name: approveStatus
        label: "审批状态"
        cell:
          type: text
          text: '<span class="label label-${approveStatus == "APPROVED" ? "success" : (approveStatus == "REJECTED" ? "danger" : "info")}">${approveStatus}</span>'
      - type: operation
        label: "操作"
        buttons:
          - type: button
            label: "标记已发放"
            variant: outline
            visible: '${paymentStatus == "PENDING"}'
            onClick:
              action: ajax
              confirmText: "确认标记此薪酬记录为已发放？"
              args:
                method: post
                url: '@mutation:ErpHrSalary__markPaid'
                data:
                  salaryId: "${id}"
              then:
                - action: refreshSource
                  targetId: salaryData
          - type: button
            label: "作废"
            variant: destructive
            visible: '${paymentStatus != "VOID"}'
            onClick:
              action: ajax
              confirmText: "确认作废此薪酬记录？此操作不可逆。"
              args:
                method: post
                url: '@mutation:ErpHrSalary__voidSalary'
                data:
                  salaryId: "${id}"
              then:
                - action: refreshSource
                  targetId: salaryData