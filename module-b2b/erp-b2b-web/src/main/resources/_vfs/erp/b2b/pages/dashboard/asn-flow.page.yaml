# b2b ASN 流程条（F16 P2 复杂页面，plan 2026-07-22-1400-2 §Phase 2 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → crud + dialog 流程详情。
# 字典 erp-b2b/asn-status 实际 4 值 RECEIVED/MATCHED/RECEIVED_TO_STOCK/CANCELLED。
# 字段名经实时仓库核实：ErpB2bAsn.code/status/partnerId；明细行 quantity vs shippedQty。
type: page
title: "ASN 流程跟踪"
remark: "提前发货通知（ErpB2bAsn）列表 + 流程条跟踪。三活跃阶段 RECEIVED→MATCHED→RECEIVED_TO_STOCK + CANCELLED 终态。"
body:
  - type: form
    name: filterForm
    title: "筛选条件"
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: select
        name: statusFilter
        label: "状态"
        clearable: true
        options:
          - { label: "已接收 (RECEIVED)", value: "RECEIVED" }
          - { label: "已匹配 (MATCHED)", value: "MATCHED" }
          - { label: "已入库 (RECEIVED_TO_STOCK)", value: "RECEIVED_TO_STOCK" }
          - { label: "已取消 (CANCELLED)", value: "CANCELLED" }
      - type: button
        label: "刷新"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: asnData

  - type: data-source
    name: asnData
    action: ajax
    args:
      url: '@query:ErpB2bAsn__findPage'
      method: post
      data:
        query:
          limit: 200
          filter:
            status: "${filterForm?.statusFilter || null}"
      selection: id code status partnerId sourceEdiDocId shipmentDate estimatedArrivalDate trackingNo relatedBillType relatedBillCode businessDate

  - type: crud
    className: m-3
    title: "ASN 列表"
    source: ${asnData?.items ?? []}
    headerToolbar: []
    footerToolbar: ["statistics"]
    syncLocation: false
    columns:
      - { name: code, label: "ASN编号" }
      - { name: status, label: "状态", type: tpl, tpl: '<span class="label label-${status == "RECEIVED_TO_STOCK" ? "success" : (status == "MATCHED" ? "primary" : (status == "CANCELLED" ? "default" : "warning"))}">${status}</span>' }
      - { name: partnerId, label: "合作伙伴" }
      - { name: shipmentDate, label: "发货日期", type: date, format: "YYYY-MM-DD" }
      - { name: estimatedArrivalDate, label: "预计到货", type: date, format: "YYYY-MM-DD" }
      - { name: trackingNo, label: "追踪号" }
      - type: operation
        label: "操作"
        buttons:
          - type: button
            label: "查看流程"
            level: primary
            actionType: dialog
            dialog:
              title: "ASN 流程详情 - ${code}"
              size: lg
              actions: []
              body:
                - type: data-source
                  name: asnDetail
                  action: ajax
                  args:
                    url: '@query:ErpB2bAsn__get'
                    method: post
                    data:
                      id: "${id}"
                    selection: id code status partnerId shipmentDate estimatedArrivalDate trackingNo relatedBillType relatedBillCode
                - type: data-source
                  name: asnLinesData
                  action: ajax
                  args:
                    url: '@query:ErpB2bAsnLine__findPage'
                    method: post
                    data:
                      query:
                        limit: 5000
                        filter:
                          asnId: "${id}"
                      selection: id asnId lineNo materialId supplierPartNo quantity shippedQty
                - type: text
                  tag: div
                  className: m-b
                  text: "<strong>${asnDetail?.code}</strong> · 合作伙伴: ${asnDetail?.partnerId} · 追踪号: ${asnDetail?.trackingNo || '—'} · 发货: ${asnDetail?.shipmentDate || '—'} · 预计到货: ${asnDetail?.estimatedArrivalDate || '—'}"
                - type: text
                  tag: div
                  className: alert alert-warning
                  visibleOn: "${asnDetail?.status == 'CANCELLED'}"
                  text: "该 ASN 已取消（CANCELLED 终态），流程未完成。"
                - type: steps
                  items:
                    - { key: "RECEIVED", label: "已接收", status: "${(asnDetail?.status === 'RECEIVED' || asnDetail?.status === 'MATCHED' || asnDetail?.status === 'RECEIVED_TO_STOCK') ? 'finish' : (asnDetail?.status === 'CANCELLED' ? 'wait' : 'process')}" }
                    - { key: "MATCHED", label: "已匹配", status: "${(asnDetail?.status === 'MATCHED' || asnDetail?.status === 'RECEIVED_TO_STOCK') ? 'finish' : (asnDetail?.status === 'CANCELLED' ? 'wait' : (asnDetail?.status === 'RECEIVED' ? 'process' : 'wait'))}" }
                    - { key: "RECEIVED_TO_STOCK", label: "已入库", status: "${asnDetail?.status === 'RECEIVED_TO_STOCK' ? 'finish' : 'wait'}" }
                - type: crud
                  title: "明细行匹配状态（quantity vs shippedQty）"
                  source: ${asnLinesData?.items ?? []}
                  syncLocation: false
                  headerToolbar: []
                  footerToolbar: []
                  columns:
                    - { name: lineNo, label: "行号" }
                    - { name: materialId, label: "物料" }
                    - { name: supplierPartNo, label: "供应商料号" }
                    - { name: quantity, label: "订单数量", type: number, precision: 2 }
                    - { name: shippedQty, label: "发货数量", type: number, precision: 2 }
                    - name: matchState
                      label: "匹配状态"
                      type: tpl
                      tpl: '<span class="label label-${(shippedQty >= quantity && quantity > 0) ? "success" : (shippedQty > 0 && shippedQty < quantity) ? "warning" : "default"}">${(shippedQty >= quantity && quantity > 0) ? "已发足" : (shippedQty > 0 && shippedQty < quantity) ? "部分发货" : "未发货"}</span>'