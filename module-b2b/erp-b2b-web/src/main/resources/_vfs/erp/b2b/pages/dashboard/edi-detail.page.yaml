# b2b EDI 事务详情（F16 P2 复杂页面，plan 2026-07-22-1400-2 §Phase 2 + plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → timeline + 双栏报文。
# 数据源：ErpB2bEdiLog__findPage filter ediDocId + ErpB2bEdiDoc__get。
# 字段名经实时仓库核实：ErpB2bEdiDoc.state/code；ErpB2bEdiLog.ediDocId/direction/resultCode 等。
type: page
title: "EDI 事务详情"
remark: "选择 EDI 文档后，按 ErpB2bEdiLog 展示状态时间线（direction/resultCode/logTime），并双栏查看 requestPayload/responsePayload 报文（纯文本）。"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: "EDI 文档选择"
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-number
        name: ediDocId
        label: "EDI文档ID"
        placeholder: "输入 EDI 文档主键"
        required: true
        clearable: true
      - type: switch
        name: showPayload
        label: "展开报文"
        value: false
        onText: "是"
        offText: "否"
      - type: button
        label: "查询详情"
        icon: file-text
        onClick:
          action: refreshSource
          targetId: ediDocData
          then:
            action: refreshSource
            targetId: ediLogsData

  - type: data-source
    name: ediDocData
    action: ajax
    args:
      url: '@query:ErpB2bEdiDoc__get'
      method: post
      data:
        id: "${filterForm?.ediDocId || null}"
      selection: id code state relatedBillType relatedBillCode formatId error retryCount sentAt acknowledgedAt

  - type: data-source
    name: ediLogsData
    action: ajax
    args:
      url: '@query:ErpB2bEdiLog__findPage'
      method: post
      data:
        query:
          limit: 5000
          filter:
            ediDocId: "${filterForm?.ediDocId || null}"
      selection: id ediDocId direction resultCode resultMsg requestPayload responsePayload logTime

  - type: text
    className: m-3
    tag: div
    visibleOn: "${ediDocData?.id}"
    text: '<div class="panel panel-default"><div class="panel-body"><strong>${ediDocData?.code || "—"}</strong> · 状态: <span class="label label-info">${ediDocData?.state || "—"}</span> · 关联单据: ${ediDocData?.relatedBillType || "—"} / ${ediDocData?.relatedBillCode || "—"} · 重试次数: ${ediDocData?.retryCount || 0} · 发送: ${ediDocData?.sentAt || "—"} · 确认: ${ediDocData?.acknowledgedAt || "—"}</div></div>'

  - type: text
    className: m-3
    tag: div
    visibleOn: "${!ediDocData?.id}"
    text: '<div class="text-muted p-3">请输入有效的 EDI 文档ID 后点击「查询详情」。</div>'

  - type: text
    className: m-3
    tag: div
    visibleOn: "${(ediLogsData?.items?.length || 0) > 0}"
    text: '<div class="text-muted m-b-sm">交互日志数：${ediLogsData?.items?.length || 0}（按 logTime 倒序）</div>'

  - type: timeline
    className: m-3
    visibleOn: "${(ediLogsData?.items?.length || 0) > 0}"
    source: ${ediLogsData?.items ?? []}
    items:
      - time: "${logTime}"
        title: "${'[' + (direction || '?') + '] · ' + (resultCode || '')}"
        detail: "${resultMsg || ''}"
        color: "${(resultCode === 'OK' || resultCode === 'SUCCESS' || resultCode === '0') ? (direction === 'OUTBOUND' ? '#3b82f6' : direction === 'INBOUND' ? '#22c55e' : '#8b5cf6') : '#ef4444'}"

  - type: text
    className: m-3
    tag: div
    visibleOn: "${filterForm?.showPayload && (ediLogsData?.items?.length || 0) > 0}"
    text: '<hr/><h4 class="m-t-md">报文详情（requestPayload / responsePayload）</h4><div class="text-muted">纯文本展示。</div>'

  - type: crud
    className: m-3
    visibleOn: "${filterForm?.showPayload}"
    title: "报文列表"
    source: ${ediLogsData?.items ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: direction
        label: "方向"
      - name: resultCode
        label: "结果码"
      - name: logTime
        label: "日志时间"
      - name: requestPayload
        label: "请求报文"
        type: tpl
        tpl: '<pre style="max-height:200px;overflow:auto;background:#f6f8fa;padding:8px;border-radius:4px;font-size:12px;white-space:pre-wrap;word-break:break-all;">${requestPayload || "（无）"}</pre>'
      - name: responsePayload
        label: "响应报文"
        type: tpl
        tpl: '<pre style="max-height:200px;overflow:auto;background:#f6f8fa;padding:8px;border-radius:4px;font-size:12px;white-space:pre-wrap;word-break:break-all;">${responsePayload || "（无）"}</pre>'