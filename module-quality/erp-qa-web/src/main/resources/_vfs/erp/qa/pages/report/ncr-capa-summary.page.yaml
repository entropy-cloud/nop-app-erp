# NCR-CAPA 统计表（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → html。
type: page
title: "NCR-CAPA 统计表"
i18nEn: "NCR-CAPA Summary"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-date
        name: startDate
        label: "开始日期"
        i18nEn: "Start Date"
        valueFormat: YYYY-MM-DD
      - type: input-date
        name: endDate
        label: "结束日期"
        i18nEn: "End Date"
        valueFormat: YYYY-MM-DD
      - type: button
        label: "渲染报表"
        i18nEn: "Render Report"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        i18nEn: "Download XLSX"
        actionType: download
        api:
          url: /p/ErpQaReport__download
          method: post
          responseType: blob
          data:
            reportName: "ncr-capa-summary"
            renderType: "xlsx"
            data:
              startDate: "${filterForm?.startDate}"
              endDate: "${filterForm?.endDate}"
      - type: button
        label: "下载 PDF"
        i18nEn: "Download PDF"
        actionType: download
        api:
          url: /p/ErpQaReport__download
          method: post
          responseType: blob
          data:
            reportName: "ncr-capa-summary"
            renderType: "pdf"
            data:
              startDate: "${filterForm?.startDate}"
              endDate: "${filterForm?.endDate}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpQaReport__renderHtml'
      method: post
      data:
        reportName: "ncr-capa-summary"
        data:
          startDate: "${filterForm?.startDate}"
          endDate: "${filterForm?.endDate}"

  - type: html
    className: m-3
    sanitize: false
    content: "${reportHtmlData ?? ''}"