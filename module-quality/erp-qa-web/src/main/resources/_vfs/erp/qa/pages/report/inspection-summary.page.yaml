# 质检合格率统计表（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → form → html。
type: page
title: "质检合格率统计表"
body:
  - type: form
    name: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-number
        name: materialId
        label: "物料ID"
        placeholder: "留空查询全部物料"
      - type: input-date
        name: startDate
        label: "开始日期"
        valueFormat: YYYY-MM-DD
      - type: input-date
        name: endDate
        label: "结束日期"
        valueFormat: YYYY-MM-DD
      - type: button
        label: "渲染报表"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        actionType: download
        api:
          url: /p/ErpQaReport__download
          method: post
          responseType: blob
          data:
            reportName: "inspection-summary"
            renderType: "xlsx"
            data:
              materialId: "${filterForm?.materialId}"
              startDate: "${filterForm?.startDate}"
              endDate: "${filterForm?.endDate}"
      - type: button
        label: "下载 PDF"
        actionType: download
        api:
          url: /p/ErpQaReport__download
          method: post
          responseType: blob
          data:
            reportName: "inspection-summary"
            renderType: "pdf"
            data:
              materialId: "${filterForm?.materialId}"
              startDate: "${filterForm?.startDate}"
              endDate: "${filterForm?.endDate}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpQaReport__renderHtml'
      method: post
      data:
        reportName: "inspection-summary"
        data:
          materialId: "${filterForm?.materialId}"
          startDate: "${filterForm?.startDate}"
          endDate: "${filterForm?.endDate}"

  - type: html
    className: m-3
    html: "${reportHtmlData ?? ''}"