# SPC 控制图可视化页（plan 2026-08-03-1232-4 Phase 1）。
#
# 数据来源：ErpQaDashboard__getSpcControlChartData（ErpQaDashboardBizModel:241）——返回
# chartCode/chartName/chartType + cl/ucl/lcl 三控制限 + samples[]（subgroupNo/mean/
# defectRate/defectCount/inspectedCount/isOutOfControl/violatedRules）。
# 图表：line（样本均值/缺陷率）+ markLine（UCL/LCL/CL 参考线）+ 失控点红色高亮。
# 样本列表：失控样本明细 + 违规规则。零后端 delta，仅消费既有 @BizQuery。
type: page
title: "SPC 控制图"
body:
  - type: form
    name: filterForm
    title: ""
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: select
        name: chartId
        label: "控制图"
        clearable: true
        placeholder: "留空=最近一张控制图"
        source:
          url: /graphql
          method: post
          dataType: raw
          data:
            query: "query(${'$'}lim:Int){ ErpQaSpcChart__findPage(query:{limit:${'$'}lim}){ items{ id code name chartType } total } }"
            variables:
              lim: 200
          adaptor: |
            const d = payload.data || {};
            const gql = d.data ? d.data : d;
            const page = gql.ErpQaSpcChart__findPage || { items: [], total: 0 };
            const opts = (page.items || []).map(function(c){
              return { label: (c.code || '') + ' · ' + (c.name || '') + ' (' + (c.chartType || '') + ')', value: c.id };
            });
            return { options: opts };
      - type: button
        label: "刷新"
        icon: "refresh-cw"
        actionType: reload
        target: "spcChart,sampleCrud"

  - type: chart
    name: spcChart
    className: m-3
    api:
      url: /graphql
      method: post
      dataType: raw
      data:
        query: "query(${'$'}chartId:Long){ ErpQaDashboard__getSpcControlChartData(chartId:${'$'}chartId) }"
        variables:
          chartId: "${chartId || null}"
      adaptor: |
        const d = payload.data || {};
        const gql = d.data ? d.data : d;
        const result = gql.ErpQaDashboard__getSpcControlChartData || {};
        const samples = result.samples || [];
        const ucl = result.ucl;
        const lcl = result.lcl;
        const cl = result.cl;
        const chartType = result.chartType || '';
        const isAttributes = chartType === 'P' || chartType === 'NP' || chartType === 'C' || chartType === 'U';
        const seriesData = samples.map(function(s){
          var v = isAttributes
            ? (s.defectRate != null ? s.defectRate : (s.inspectedCount ? s.defectCount / s.inspectedCount : 0))
            : s.mean;
          return { value: v, itemStyle: s.isOutOfControl ? {color: 'red'} : undefined };
        });
        const markLines = [];
        if (ucl != null) markLines.push({ yAxis: ucl, name: 'UCL', lineStyle: {color: 'red', type: 'dashed'}, label: {position: 'end', formatter: 'UCL=' + ucl} });
        if (lcl != null) markLines.push({ yAxis: lcl, name: 'LCL', lineStyle: {color: 'red', type: 'dashed'}, label: {position: 'end', formatter: 'LCL=' + lcl} });
        if (cl != null)  markLines.push({ yAxis: cl,  name: 'CL',  lineStyle: {color: 'green'}, label: {position: 'end', formatter: 'CL=' + cl} });
        const series = { type: 'line', data: seriesData };
        if (markLines.length > 0) series.markLine = { symbol: 'none', data: markLines };
        const yAxisName = isAttributes ? '缺陷率' : '均值';
        return {
          status: 0,
          msg: '',
          data: {
            title: { text: 'SPC 控制图：' + (result.chartName || '') + ' (' + chartType + ')' },
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', name: '子组号', data: samples.map(function(s){return s.subgroupNo;}) },
            yAxis: { type: 'value', name: yAxisName },
            series: [series]
          }
        };

  - type: crud
    name: sampleCrud
    className: m-3
    title: "样本明细"
    syncLocation: false
    headerToolbar: []
    api:
      url: /graphql
      method: post
      dataType: raw
      data:
        query: "query(${'$'}chartId:Long,${'$'}lim:Int){ ErpQaSpcSample__findPage(query:{limit:${'$'}lim,filter:{eq:{chartId:${{'$'}}chartId}}}){ items{ id chartId subgroupNo sampleTime mean range stdDev defectCount inspectedCount defectRate isOutOfControl violatedRules } total } }"
        variables:
          chartId: "${chartId || null}"
          lim: 200
      adaptor: |
        const d = payload.data || {};
        const gql = d.data ? d.data : d;
        const page = gql.ErpQaSpcSample__findPage || { items: [], total: 0 };
        return { status: 0, msg: '', data: { items: page.items || [], count: page.total || 0 } };
    columns:
      - name: subgroupNo
        label: "子组号"
      - name: sampleTime
        label: "采样时间"
      - name: mean
        label: "均值"
      - name: range
        label: "极差"
      - name: defectCount
        label: "缺陷数"
      - name: inspectedCount
        label: "检验数"
      - name: isOutOfControl
        label: "失控"
        type: tpl
        tpl: '${isOutOfControl ? "<span class=\"label label-danger\">失控</span>" : "<span class=\"label label-success\">正常</span>"}'
      - name: violatedRules
        label: "违规规则"
