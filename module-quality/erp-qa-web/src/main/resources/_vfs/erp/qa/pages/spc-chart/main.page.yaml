# SPC 控制图可视化页（plan 2026-08-03-1232-4 Phase 1 + plan 2026-08-29-1913-2 Phase 1）。
#
# 数据来源：ErpQaDashboard__getSpcControlChartData（ErpQaDashboardBizModel:241）——返回
# chartCode/chartName/chartType + cl/ucl/lcl 三控制限 + samples[]（subgroupNo/mean/
# defectRate/defectCount/inspectedCount/isOutOfControl/violatedRules）。
# 图表：line（样本均值/缺陷率）+ markLine（UCL/LCL/CL 参考线）+ 失控点红色高亮。
# 样本列表：失控样本明细 + 违规规则。零后端 delta，仅消费既有 @BizQuery。
type: page
title: "SPC 控制图"
i18nEn: "SPC Control Chart"
body:
  - type: data-source
    name: chartsData
    action: ajax
    args:
      url: '@query:ErpQaSpcChart__findPage'
      method: post
      data:
        query:
          limit: 200
      selection: id code name chartType

  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: select
        name: chartId
        label: "控制图"
        clearable: true
        placeholder: "留空=最近一张控制图"
        i18nEn:
          label: "Control Chart"
          placeholder: "Blank = most recent control chart"
        source: ${chartsData?.items ?? []}
        valueField: id
        labelField: "${code || ''} · ${name || ''} (${chartType || ''})"
      - type: button
        label: "刷新"
        i18nEn: "Refresh"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: spcChartData
          then:
            action: refreshSource
            targetId: sampleData

  - type: data-source
    name: spcChartData
    action: ajax
    args:
      url: '@query:ErpQaDashboard__getSpcControlChartData'
      method: post
      data:
        chartId: "${filterForm?.chartId || null}"
      selection: chartName chartType samples ucl lcl cl

  - type: chart
    chartType: line
    title: "SPC 控制图"
    i18nEn: "SPC Control Chart"
    source: ${spcChartData?.samples ?? []}
    xAxis: { dataKey: subgroupNo }
    yAxis:
      label: "${(spcChartData?.chartType === 'P' || spcChartData?.chartType === 'NP' || spcChartData?.chartType === 'C' || spcChartData?.chartType === 'U') ? '缺陷率' : '均值'}"
      i18nEn: "${(spcChartData?.chartType === 'P' || spcChartData?.chartType === 'NP' || spcChartData?.chartType === 'C' || spcChartData?.chartType === 'U') ? 'Defect Rate' : 'Mean'}"
    legend: true
    height: 300
    series:
      - dataRegionKey: mean
        name: "样本值"
        i18nEn: "Sample Value"

  - type: data-source
    name: sampleData
    action: ajax
    args:
      url: '@query:ErpQaSpcSample__findPage'
      method: post
      data:
        query:
          limit: 200
          filter:
            chartId: "${filterForm?.chartId || null}"
      selection: id chartId subgroupNo sampleTime mean range stdDev defectCount inspectedCount defectRate isOutOfControl violatedRules

  - type: crud
    className: m-3
    title: "样本明细"
    i18nEn: "Sample Details"
    source: ${sampleData?.items ?? []}
    syncLocation: false
    headerToolbar: []
    columns:
      - name: subgroupNo
        label: "子组号"
        i18nEn: "Subgroup No."
      - name: sampleTime
        label: "采样时间"
        i18nEn: "Sample Time"
      - name: mean
        label: "均值"
        i18nEn: "Mean"
      - name: range
        label: "极差"
        i18nEn: "Range"
      - name: defectCount
        label: "缺陷数"
        i18nEn: "Defect Count"
      - name: inspectedCount
        label: "检验数"
        i18nEn: "Inspected Count"
      - name: isOutOfControl
        label: "失控"
        type: tpl
        tpl: '${isOutOfControl ? "<span class=\"label label-danger\">失控</span>" : "<span class=\"label label-success\">正常</span>"}'
        i18nEn:
          label: "Out of Control"
          tpl: '${isOutOfControl ? "<span class=\"label label-danger\">Out of Control</span>" : "<span class=\"label label-success\">Normal</span>"}'
      - name: violatedRules
        label: "违规规则"
        i18nEn: "Violated Rules"