# SPC 样本数据页（plan 2026-08-03-1232-4 Phase 1 + plan 2026-08-29-1913-2 Phase 1）。
#
# 数据来源：ErpQaSpcSample 实体（CRUD findPage）——subgroupNo/sampleTime/mean/range/
# stdDev/defectCount/inspectedCount/defectRate/isOutOfControl/violatedRules。
# 样本趋势图：line chart 按子组号展示均值趋势。零后端 delta，仅消费既有 @BizQuery。
type: page
title: "SPC 样本数据"
body:
  - type: data-source
    name: sampleData
    action: ajax
    args:
      url: '@query:ErpQaSpcSample__findPage'
      method: post
      data:
        query:
          limit: 200
      selection: id chartId subgroupNo sampleTime mean range stdDev defectCount inspectedCount defectRate isOutOfControl violatedRules

  - type: chart
    chartType: line
    title: "样本均值趋势"
    source: ${sampleData?.items ?? []}
    xAxis: { dataKey: subgroupNo }
    yAxis: { label: "均值" }
    legend: true
    height: 300
    series:
      - { name: "均值", dataRegionKey: mean }

  - type: crud
    className: m-3
    title: "样本记录"
    source: ${sampleData?.items ?? []}
    syncLocation: false
    columns:
      - name: chartId
        label: "控制图ID"
      - name: subgroupNo
        label: "子组号"
      - name: sampleTime
        label: "采样时间"
      - name: mean
        label: "均值"
      - name: range
        label: "极差"
      - name: stdDev
        label: "标准差"
      - name: defectCount
        label: "缺陷数"
      - name: inspectedCount
        label: "检验数"
      - name: isOutOfControl
        label: "失控"
        type: tpl
        tpl: '${isOutOfControl ? "<span class=\"label label-danger\">失控</span>" : "<span class=\"label label-success\">正常</span>"}'
      - name: violatedRules
        label: "违规规则"