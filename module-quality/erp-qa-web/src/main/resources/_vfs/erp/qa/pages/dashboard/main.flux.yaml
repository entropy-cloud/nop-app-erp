# 质量概览 dashboard（plan 2026-08-28-1600-1 Phase 1）。
# flux 原生重写：service → data-source + chart + crud。
# 数据源：ErpQaDashboard__getDashboardKpi / __getDashboardTrend / __findDefectTopN / __getSpcOutOfControlWarning / __getSpcControlChartData / __findCapaOverdueAlert。
type: page
title: 质量概览
body:
- type: form
  name: filterForm
  title: ""
  mode: inline
  wrapWithPanel: false
  className: m-3
  body:
  - type: input-date
    name: startDate
    label: 开始日期
    format: YYYY-MM-DD
    placeholder: 留空=本月1日
    clearable: true
  - type: input-date
    name: endDate
    label: 结束日期
    format: YYYY-MM-DD
    placeholder: 留空=今天
    clearable: true
  - type: button
    label: 刷新
    icon: refresh-cw
    onClick:
      action: refreshSource
      targetId: kpiData
      then:
        action: refreshSource
        targetId: trendData
        then:
          action: refreshSource
          targetId: defectData
          then:
            action: refreshSource
            targetId: spcWarningData
            then:
              action: refreshSource
              targetId: spcChartData
              then:
                action: refreshSource
                targetId: capaOverdueData
- type: data-source
  name: kpiData
  action: ajax
  args:
    url: '@query:ErpQaDashboard__getDashboardKpi'
    method: post
    data:
      startDate: "${filterForm?.startDate || null}"
      endDate: "${filterForm?.endDate || null}"
    selection: inspectionCount passRate rejectedCount openNcrCount
- type: grid
  className: m-3
  gap: sm
  columns: 4
  items:
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 本期质检数
      - type: text
        tag: h3
        className: font-bold
        text: "${kpiData?.inspectionCount ?? 0}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 合格率
      - type: text
        tag: h3
        className: text-success
        text: "${kpiData?.passRate ?? 0 | round:2}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 不合格数
      - type: text
        tag: h3
        className: text-danger
        text: "${kpiData?.rejectedCount ?? 0}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 开放 NCR 数
      - type: text
        tag: h3
        className: text-warning
        text: "${kpiData?.openNcrCount ?? 0}"
- type: data-source
  name: trendData
  action: ajax
  args:
    url: '@query:ErpQaDashboard__getDashboardTrend'
    method: post
    data:
      months: 12
    selection: month passRate
- type: chart
  chartType: line
  title: 合格率趋势（近12月）
  source: ${trendData ?? []}
  xAxis: { dataKey: month }
  yAxis: { label: 合格率 }
  legend: true
  height: 300
  series:
  - { name: 合格率, dataRegionKey: passRate }
- type: data-source
  name: defectData
  action: ajax
  args:
    url: '@query:ErpQaDashboard__findDefectTopN'
    method: post
    data:
      limit: 10
    selection: dispositionType count
- type: chart
  chartType: pie
  title: 不合格原因 TOP（按处置决定聚合）
  source: ${defectData ?? []}
  height: 300
- type: data-source
  name: spcWarningData
  action: ajax
  args:
    url: '@query:ErpQaDashboard__getSpcOutOfControlWarning'
    method: post
    selection: outOfControlChartCount includeInadequate inadequateCapabilityCount includeNcr openSpcNcrCount
- type: grid
  className: m-3
  gap: sm
  columns: 3
  items:
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: SPC 失控图数
      - type: text
        tag: h3
        className: text-danger
        text: "${spcWarningData?.outOfControlChartCount ?? 0}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 能力不足(INADEQUATE)图数
      - type: text
        tag: h3
        className: "${spcWarningData?.includeInadequate ? 'text-warning' : 'text-muted'}"
        text: "${spcWarningData?.inadequateCapabilityCount ?? 0}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 待处置 SPC NCR 数
      - type: text
        tag: h3
        className: "${spcWarningData?.includeNcr ? 'text-warning' : 'text-muted'}"
        text: "${spcWarningData?.openSpcNcrCount ?? 0}"
- type: data-source
  name: spcChartData
  action: ajax
  args:
    url: '@query:ErpQaDashboard__getSpcControlChartData'
    method: post
    data:
      chartId: "${filterForm?.chartId || null}"
    selection: chartName chartType ucl lcl cl samples{ subgroupNo mean defectRate defectCount inspectedCount isOutOfControl violatedRules }
  adaptor: |
    var d = payload.data || {};
    var result = d || {};
    var samples = result.samples || [];
    var ucl = result.ucl;
    var lcl = result.lcl;
    var cl = result.cl;
    var chartType = result.chartType || '';
    var isAttributes = chartType === 'P' || chartType === 'NP' || chartType === 'C' || chartType === 'U';
    var seriesData = samples.map(function(s){
      var v = isAttributes
        ? (s.defectRate != null ? s.defectRate : (s.inspectedCount ? s.defectCount / s.inspectedCount : 0))
        : s.mean;
      return { value: v, itemStyle: s.isOutOfControl ? {color: 'red'} : undefined };
    });
    var markLines = [];
    if (ucl != null) markLines.push({ yAxis: ucl, name: 'UCL', lineStyle: {color: 'red', type: 'dashed'}, label: {position: 'end', formatter: 'UCL'} });
    if (lcl != null) markLines.push({ yAxis: lcl, name: 'LCL', lineStyle: {color: 'red', type: 'dashed'}, label: {position: 'end', formatter: 'LCL'} });
    if (cl != null)  markLines.push({ yAxis: cl,  name: 'CL',  lineStyle: {color: 'green'}, label: {position: 'end', formatter: 'CL'} });
    var series = { type: 'line', data: seriesData };
    if (markLines.length > 0) series.markLine = { symbol: 'none', data: markLines };
    var yAxisName = isAttributes ? '缺陷率' : '均值';
    return {
      status: 0,
      msg: '',
      data: {
        chartName: result.chartName || '',
        chartType: chartType,
        xAxisData: samples.map(function(s){ return s.subgroupNo; }),
        yAxisName: yAxisName,
        series: [series]
      }
    };
- type: chart
  chartType: line
  title: "SPC 控制图：${spcChartData?.chartName ?? ''} (${spcChartData?.chartType ?? ''})"
  source: ${spcChartData?.series ?? []}
  xAxis: { dataKey: subgroupNo, label: 子组号 }
  yAxis: { label: "${spcChartData?.yAxisName ?? ''}" }
  height: 300
- type: data-source
  name: capaOverdueData
  action: ajax
  args:
    url: '@query:ErpQaDashboard__findCapaOverdueAlert'
    method: post
    selection: actionType dueDate status overdueDays
- type: crud
  title: CAPA 逾期预警
  source: ${capaOverdueData}
  syncLocation: false
  headerToolbar: []
  footerToolbar: []
  columns:
  - name: actionType
    label: 行动类型
  - name: dueDate
    label: 计划完成日
  - name: status
    label: 状态
  - name: overdueDays
    label: 逾期(天)
    type: number
