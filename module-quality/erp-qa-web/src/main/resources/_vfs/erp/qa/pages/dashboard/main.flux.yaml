# 质量概览 dashboard（plan 2026-08-28-1600-1 Phase 1）。
# flux 原生重写：service → data-source + chart + crud。
# 数据源：ErpQaDashboard__getDashboardKpi / __getDashboardTrend / __findDefectTopN / __getSpcOutOfControlWarning / __getSpcControlChartData / __findCapaOverdueAlert。
type: page
title: 质量概览
i18nEn: "Quality Overview"
body:
- type: form
  name: filterForm
  valuesPath: filterForm
  title: ""
  mode: inline
  wrapWithPanel: false
  className: m-3
  body:
  - type: input-date
    name: startDate
    label: 开始日期
    format: YYYY-MM-DD
    placeholder: 留空=本月1日
    i18nEn:
      label: "Start Date"
      placeholder: "Blank = 1st of current month"
    clearable: true
  - type: input-date
    name: endDate
    label: 结束日期
    format: YYYY-MM-DD
    placeholder: 留空=今天
    i18nEn:
      label: "End Date"
      placeholder: "Blank = today"
    clearable: true
  - type: button
    label: 刷新
    i18nEn: "Refresh"
    icon: refresh-cw
    onClick:
      action: refreshSource
      targetId: kpiData
      then:
        action: refreshSource
        targetId: trendData
        then:
          action: refreshSource
          targetId: defectData
          then:
            action: refreshSource
            targetId: spcWarningData
            then:
              action: refreshSource
              targetId: spcChartData
              then:
                action: refreshSource
                targetId: capaOverdueData
- type: data-source
  name: kpiData
  action: ajax
  args:
    url: '@query:ErpQaDashboard__getDashboardKpi'
    method: post
    data:
      startDate: "${filterForm?.startDate || null}"
      endDate: "${filterForm?.endDate || null}"
    selection: inspectionCount passRate rejectedCount openNcrCount
- type: grid
  className: m-3
  gap: sm
  columns: 4
  items:
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 本期质检数
        i18nEn: "Inspections This Period"
      - type: text
        tag: h3
        className: font-bold
        text: "${kpiData?.inspectionCount ?? 0}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 合格率
        i18nEn: "Pass Rate"
      - type: text
        tag: h3
        className: text-success
        text: "${ROUND((kpiData?.passRate ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 不合格数
        i18nEn: "Rejected Count"
      - type: text
        tag: h3
        className: text-danger
        text: "${kpiData?.rejectedCount ?? 0}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 开放 NCR 数
        i18nEn: "Open NCR Count"
      - type: text
        tag: h3
        className: text-warning
        text: "${kpiData?.openNcrCount ?? 0}"
- type: data-source
  name: trendData
  action: ajax
  args:
    url: '@query:ErpQaDashboard__getDashboardTrend'
    method: post
    data:
      months: 12
    selection: month passRate
- type: chart
  chartType: line
  title: 合格率趋势（近12月）
  i18nEn: "Pass Rate Trend (Last 12 Months)"
  source: ${trendData ?? []}
  xAxis: { dataKey: month }
  yAxis:
    label: 合格率
    i18nEn: "Pass Rate"
  legend: true
  height: 300
  series:
  - dataRegionKey: passRate
    name: 合格率
    i18nEn: "Pass Rate"
- type: data-source
  name: defectData
  action: ajax
  args:
    url: '@query:ErpQaDashboard__findDefectTopN'
    method: post
    data:
      limit: 10
    selection: dispositionType count
- type: chart
  chartType: pie
  title: 不合格原因 TOP（按处置决定聚合）
  i18nEn: "Top Defect Causes (Aggregated by Disposal Decision)"
  source: ${defectData ?? []}
  height: 300
- type: data-source
  name: spcWarningData
  action: ajax
  args:
    url: '@query:ErpQaDashboard__getSpcOutOfControlWarning'
    method: post
    selection: outOfControlChartCount includeInadequate inadequateCapabilityCount includeNcr openSpcNcrCount
- type: grid
  className: m-3
  gap: sm
  columns: 3
  items:
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: SPC 失控图数
        i18nEn: "Out-of-Control SPC Charts"
      - type: text
        tag: h3
        className: text-danger
        text: "${spcWarningData?.outOfControlChartCount ?? 0}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 能力不足(INADEQUATE)图数
        i18nEn: "Inadequate-Capability (INADEQUATE) Charts"
      - type: text
        tag: h3
        className: "${spcWarningData?.includeInadequate ? 'text-warning' : 'text-muted'}"
        text: "${spcWarningData?.inadequateCapabilityCount ?? 0}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 待处置 SPC NCR 数
        i18nEn: "SPC NCRs Pending Disposal"
      - type: text
        tag: h3
        className: "${spcWarningData?.includeNcr ? 'text-warning' : 'text-muted'}"
        text: "${spcWarningData?.openSpcNcrCount ?? 0}"
- type: data-source
  name: spcChartData
  action: ajax
  args:
    url: '@query:ErpQaDashboard__getSpcControlChartData'
    method: post
    data:
      chartId: "${filterForm?.chartId || null}"
    selection: chartName chartType ucl lcl cl samples{ subgroupNo mean defectRate defectCount inspectedCount isOutOfControl violatedRules }
  adaptor: "var d = payload.data || {};\nvar result = d || {};\nvar samples = result.samples || [];\nvar ucl = result.ucl;\nvar lcl = result.lcl;\nvar cl = result.cl;\nvar chartType = result.chartType || '';\nvar isAttributes = chartType === 'P' || chartType === 'NP' || chartType === 'C' || chartType === 'U';\nvar seriesData = samples.map(function(s){\n  var v = isAttributes\n    ? (s.defectRate != null ? s.defectRate : (s.inspectedCount ? s.defectCount / s.inspectedCount : 0))\n    : s.mean;\n  return { value: v, itemStyle: s.isOutOfControl ? {color: 'red'} : undefined };\n});\nvar markLines = [];\nif (ucl != null) markLines.push({ yAxis: ucl, name: 'UCL', lineStyle: {color: 'red', type: 'dashed'}, label: {position: 'end', formatter: 'UCL'} });\nif (lcl != null) markLines.push({ yAxis: lcl, name: 'LCL', lineStyle: {color: 'red', type: 'dashed'}, label: {position: 'end', formatter: 'LCL'} });\nif (cl != null)  markLines.push({ yAxis: cl,  name: 'CL',  lineStyle: {color: 'green'}, label: {position: 'end', formatter: 'CL'} });\nvar series = { type: 'line', data: seriesData };\nif (markLines.length > 0) series.markLine = { symbol: 'none', data: markLines };\nvar yAxisName = isAttributes ? '缺陷率' : '均值';\nreturn {\n  status: 0,\n  msg: '',\n  data: {\n    chartName: result.chartName || '',\n    chartType: chartType,\n    xAxisData: samples.map(function(s){ return s.subgroupNo; }),\n    yAxisName: yAxisName,\n    series: [series]\n  }\n};\n"
  i18nEn: "var d = payload.data || {};\nvar result = d || {};\nvar samples = result.samples || [];\nvar ucl = result.ucl;\nvar lcl = result.lcl;\nvar cl = result.cl;\nvar chartType = result.chartType || '';\nvar isAttributes = chartType === 'P' || chartType === 'NP' || chartType === 'C' || chartType === 'U';\nvar seriesData = samples.map(function(s){\n  var v = isAttributes\n    ? (s.defectRate != null ? s.defectRate : (s.inspectedCount ? s.defectCount / s.inspectedCount : 0))\n    : s.mean;\n  return { value: v, itemStyle: s.isOutOfControl ? {color: 'red'} : undefined };\n});\nvar markLines = [];\nif (ucl != null) markLines.push({ yAxis: ucl, name: 'UCL', lineStyle: {color: 'red', type: 'dashed'}, label: {position: 'end', formatter: 'UCL'} });\nif (lcl != null) markLines.push({ yAxis: lcl, name: 'LCL', lineStyle: {color: 'red', type: 'dashed'}, label: {position: 'end', formatter: 'LCL'} });\nif (cl != null)  markLines.push({ yAxis: cl,  name: 'CL',  lineStyle: {color: 'green'}, label: {position: 'end', formatter: 'CL'} });\nvar series = { type: 'line', data: seriesData };\nif (markLines.length > 0) series.markLine = { symbol: 'none', data: markLines };\nvar yAxisName = isAttributes ? 'Defect Rate' : 'Mean';\nreturn {\n  status: 0,\n  msg: '',\n  data: {\n    chartName: result.chartName || '',\n    chartType: chartType,\n    xAxisData: samples.map(function(s){ return s.subgroupNo; }),\n    yAxisName: yAxisName,\n    series: [series]\n  }\n};\n"
- type: chart
  chartType: line
  title: "SPC 控制图：${spcChartData?.chartName ?? ''} (${spcChartData?.chartType ?? ''})"
  i18nEn: "SPC Control Chart: ${spcChartData?.chartName ?? ''} (${spcChartData?.chartType ?? ''})"
  source: ${spcChartData?.series ?? []}
  xAxis:
    dataKey: subgroupNo
    label: 子组号
    i18nEn: "Subgroup No."
  yAxis: { label: "${spcChartData?.yAxisName ?? ''}" }
  height: 300
- type: data-source
  name: capaOverdueData
  action: ajax
  args:
    url: '@query:ErpQaDashboard__findCapaOverdueAlert'
    method: post
    selection: actionType dueDate status overdueDays
- type: crud
  title: CAPA 逾期预警
  i18nEn: "CAPA Overdue Alert"
  source: ${capaOverdueData}
  syncLocation: false
  headerToolbar: []
  footerToolbar: []
  columns:
  - name: actionType
    label: 行动类型
    i18nEn: "Action Type"
  - name: dueDate
    label: 计划完成日
    i18nEn: "Planned Completion Date"
  - name: status
    label: 状态
    i18nEn: "Status"
  - name: overdueDays
    label: 逾期(天)
    i18nEn: "Overdue (Days)"
    type: number
