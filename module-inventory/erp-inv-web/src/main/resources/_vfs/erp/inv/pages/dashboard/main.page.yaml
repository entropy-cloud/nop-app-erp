# 库存概览 dashboard（plan 2026-08-29-1913-1 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + chart + crud（缺料/滞销/批次效期预警）。
# 数据源：ErpInvDashboard__getDashboardKpi / __getDashboardTrend / __findWarehouseDistribution
#       / __findShortageAlert / __findSlowMovingAlert / __findBatchExpiryAlert。
type: page
title: "库存概览"
body:
  - type: form
    name: filterForm
    title: ""
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-date
        name: startDate
        label: "开始日期"
        format: YYYY-MM-DD
        placeholder: "留空=本月1日"
        clearable: true
      - type: input-date
        name: endDate
        label: "结束日期"
        format: YYYY-MM-DD
        placeholder: "留空=今天"
        clearable: true
      - type: button
        label: "刷新"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: kpiData
          then:
            action: refreshSource
            targetId: trendData
            then:
              action: refreshSource
              targetId: warehouseData
              then:
                action: refreshSource
                targetId: shortageData
                then:
                  action: refreshSource
                  targetId: slowMovingData
                  then:
                    action: refreshSource
                    targetId: batchExpiryData

  - type: data-source
    name: kpiData
    action: ajax
    args:
      url: '@query:ErpInvDashboard__getDashboardKpi'
      method: post
      data:
        startDate: "${filterForm?.startDate || null}"
        endDate: "${filterForm?.endDate || null}"
      selection: totalValue incomingQty outgoingQty turnoverRate

  - type: grid
    className: m-3
    gap: sm
    columns: 4
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 库存总值
              - type: text
                tag: span
                className: h3 text-primary
                text: "¥${kpiData?.totalValue ?? 0 | round:2}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 本期入库量
              - type: text
                tag: span
                className: h3 text-success
                text: "${kpiData?.incomingQty ?? 0 | round:2}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 本期出库量
              - type: text
                tag: span
                className: h3 text-danger
                text: "${kpiData?.outgoingQty ?? 0 | round:2}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: 库存周转率
              - type: text
                tag: span
                className: h3 font-bold
                text: "${kpiData?.turnoverRate ?? 0 | round:4}"

  - type: data-source
    name: trendData
    action: ajax
    args:
      url: '@query:ErpInvDashboard__getDashboardTrend'
      method: post
      data:
        months: 12
      selection: month netValueChange
  - type: chart
    chartType: bar
    title: "库存价值月度变动（近12月）"
    source: ${trendData ?? []}
    xAxis: { dataKey: month }
    yAxis: { label: "金额" }
    legend: true
    height: 300
    series:
      - { name: "净变动成本", dataRegionKey: netValueChange }

  - type: data-source
    name: warehouseData
    action: ajax
    args:
      url: '@query:ErpInvDashboard__findWarehouseDistribution'
      method: post
      selection: warehouseId warehouseName totalValue
  - type: chart
    chartType: pie
    title: "仓库库存价值分布"
    source: ${warehouseData ?? []}
    height: 300

  - type: data-source
    name: shortageData
    action: ajax
    args:
      url: '@query:ErpInvDashboard__findShortageAlert'
      method: post
      selection: materialName warehouseName availableQuantity safetyStock
  - type: crud
    name: shortageCrud
    className: m-3
    title: "缺料预警（availableQty < material.safetyStock）"
    source: ${shortageData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: materialName
        label: "物料"
      - name: warehouseName
        label: "仓库"
      - name: availableQuantity
        label: "可用量"
      - name: safetyStock
        label: "安全库存"

  - type: data-source
    name: slowMovingData
    action: ajax
    args:
      url: '@query:ErpInvDashboard__findSlowMovingAlert'
      method: post
      selection: materialName warehouseName totalQuantity lastOutDate
  - type: crud
    name: slowMovingCrud
    className: m-3
    title: "滞销库存预警（阈值经 erp-dash.inv-slow-moving-days 配置）"
    source: ${slowMovingData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: materialName
        label: "物料"
      - name: warehouseName
        label: "仓库"
      - name: totalQuantity
        label: "库存量"
      - name: lastOutDate
        label: "最后出库日"

  - type: data-source
    name: batchExpiryData
    action: ajax
    args:
      url: '@query:ErpInvDashboard__findBatchExpiryAlert'
      method: post
      selection: batchNo materialName warehouseName expiryDate remainingDays availableQuantity
  - type: crud
    name: batchExpiryCrud
    className: m-3
    title: "批次效期预警（阈值经 erp-dash.inv-batch-expiry-days 配置）"
    source: ${batchExpiryData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: batchNo
        label: "批次号"
      - name: materialName
        label: "物料"
      - name: warehouseName
        label: "仓库"
      - name: expiryDate
        label: "到期日"
      - name: remainingDays
        label: "剩余天数"
      - name: availableQuantity
        label: "可用量"