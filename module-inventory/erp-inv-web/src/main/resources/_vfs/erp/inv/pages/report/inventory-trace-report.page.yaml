# 库存追溯可视化报表（plan 2026-08-29-1913-1 Phase 1）。
# flux 原生重写：data-source → form → html。
# 数据源：ErpInvReport__renderHtml（报表渲染）。
# 下载按钮保留 /p/{ErpInvReport__download} 路径（plan 2026-07-12-0413-1 已修复）。
type: page
title: "库存追溯可视化报表"
body:
  - type: form
    name: filterForm
    title: ""
    mode: inline
    className: m-3
    body:
      - type: input-text
        name: batchNo
        label: "批次号"
        placeholder: "按批次追溯（优先）"
      - type: input-number
        name: materialId
        label: "物料ID"
        placeholder: "按物料过滤"
      - type: input-number
        name: warehouseId
        label: "仓库ID"
        placeholder: "按仓库过滤"
      - type: button
        label: "渲染报表"
        onClick:
          action: refreshSource
          targetId: reportHtmlData
      - type: button
        label: "下载 XLSX"
        actionType: download
        api:
          url: /p/ErpInvReport__download
          method: post
          responseType: blob
          data:
            reportName: "inventory-trace-report"
            renderType: "xlsx"
            data:
              batchNo: "${filterForm?.batchNo}"
              materialId: "${filterForm?.materialId}"
              warehouseId: "${filterForm?.warehouseId}"
      - type: button
        label: "下载 PDF"
        actionType: download
        api:
          url: /p/ErpInvReport__download
          method: post
          responseType: blob
          data:
            reportName: "inventory-trace-report"
            renderType: "pdf"
            data:
              batchNo: "${filterForm?.batchNo}"
              materialId: "${filterForm?.materialId}"
              warehouseId: "${filterForm?.warehouseId}"

  - type: data-source
    name: reportHtmlData
    action: ajax
    args:
      url: '@query:ErpInvReport__renderHtml'
      method: post
      data:
        reportName: "inventory-trace-report"
        data:
          batchNo: "${filterForm?.batchNo}"
          materialId: "${filterForm?.materialId}"
          warehouseId: "${filterForm?.warehouseId}"

  - type: html
    className: m-3
    html: "${reportHtmlData ?? ''}"