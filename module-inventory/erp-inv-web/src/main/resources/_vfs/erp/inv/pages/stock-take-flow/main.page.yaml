# 盘点流程管理（plan 2026-08-03-1232-4 Phase 2 + plan 2026-08-29-1913-1 Phase 1）。
# flux 原生重写：data-source → crud + form → 三个 button 调 mutation。
# 引导式流程驱动既有 inventory Facade mutation 链（零后端 delta）：
#   ErpInvStockTakeBizModel.startTake（DRAFT→CONFIRMED）→ completeTake（CONFIRMED→DONE）→ cancelTake。
# 注：completeTake（RC-R1.56 已实现）自动生成盘盈/盘亏差异移动单——独立移动单（relatedBillType=ERP_INV_STOCK_TAKE）
# 停 CONFIRMED 待库管员二次确认（移动单列表 complete 后差异才影响余额）；差异移动单跳过存货估值过账。
type: page
title: "盘点流程管理"
i18nEn: "Stock Take Flow Management"
body:
  - type: text
    className: m-3
    tag: div
    text: '<div class="alert alert-info"><strong>盘点三阶段流程</strong>：DRAFT（待盘点）→ 盘点中（CONFIRMED，startTake）→ DONE（已完成，completeTake）。完成时自动生成盘盈/盘亏移动单（独立单停 CONFIRMED 待库管员二次确认）。</div>'
    i18nEn: '<div class="alert alert-info"><strong>Stock Take Three-Phase Flow</strong>: DRAFT (pending stock take) → Counting (CONFIRMED, startTake) → DONE (completed, completeTake). On completion, stock-take gain/loss movement orders are generated automatically (standalone orders stay CONFIRMED pending warehouse keeper double confirmation).</div>'

  - type: data-source
    name: stockTakeData
    action: ajax
    args:
      url: '@query:ErpInvStockTake__findPage'
      method: post
      data:
        query:
          limit: 200
      selection: items{ id code businessDate docStatus remark }

  - type: crud
    name: stockTakeCrud
    className: m-3
    title: "盘点单"
    i18nEn: "Stock Take Order"
    source: ${stockTakeData?.items ?? []}
    syncLocation: false
    columns:
      - name: code
        label: "单号"
        i18nEn: "Doc No"
      - name: docStatus
        label: "状态"
        type: tpl
        tpl: '${docStatus == "DRAFT" ? "<span class=\"label label-default\">待盘点</span>" : (docStatus == "CONFIRMED" ? "<span class=\"label label-warning\">盘点中</span>" : (docStatus == "DONE" ? "<span class=\"label label-success\">已完成</span>" : "<span class=\"label\">" + (docStatus||"—") + "</span>"))}'
        i18nEn:
          label: "Status"
          tpl: '${docStatus == "DRAFT" ? "<span class=\"label label-default\">Pending Stock Take</span>" : (docStatus == "CONFIRMED" ? "<span class=\"label label-warning\">Stock Take In Progress</span>" : (docStatus == "DONE" ? "<span class=\"label label-success\">Completed</span>" : "<span class=\"label\">" + (docStatus||"—") + "</span>"))}'
      - name: businessDate
        label: "业务日期"
        i18nEn: "Business Date"
      - name: remark
        label: "备注"
        i18nEn: "Remark"
      - name: actions
        label: "操作"
        type: tpl
        tpl: '${docStatus == "DRAFT" ? "<span class=\"text-muted\">startTake →</span>" : (docStatus == "CONFIRMED" ? "<span class=\"text-muted\">completeTake →</span>" : (docStatus == "DONE" ? "<span class=\"text-success\">✓ 流程完成</span>" : ""))}'
        i18nEn:
          label: "Actions"
          tpl: '${docStatus == "DRAFT" ? "<span class=\"text-muted\">startTake →</span>" : (docStatus == "CONFIRMED" ? "<span class=\"text-muted\">completeTake →</span>" : (docStatus == "DONE" ? "<span class=\"text-success\">✓ Flow Complete</span>" : ""))}'

  - type: form
    name: actionForm
    valuesPath: actionForm
    title: "执行盘点操作"
    i18nEn: "Execute Stock Take Action"
    className: m-3
    mode: inline
    wrapWithPanel: false
    body:
      - type: input-number
        name: takeId
        label: "盘点单ID"
        placeholder: "输入盘点单ID"
        i18nEn:
          label: "Stock Take Order ID"
          placeholder: "Enter stock take order ID"
        required: true
      - type: button
        label: "开始盘点 (startTake)"
        variant: primary
        icon: "fa fa-play"
        onClick:
          action: ajax
          confirmText: "确认开始盘点？状态将翻转为盘点中（CONFIRMED）。"
          i18nEn:
            confirmText: "Confirm starting the stock take? Status will flip to Counting (CONFIRMED)."
          args:
            url: '/r/ErpInvStockTake__startTake'
            method: post
            data:
              takeId: "${actionForm?.takeId}"
          then:
            - action: refreshSource
              targetId: stockTakeData
        i18nEn:
          label: "Start Stock Take (startTake)"
      - type: button
        label: "完成盘点 (completeTake)"
        variant: secondary
        icon: "fa fa-check"
        onClick:
          action: ajax
          confirmText: "确认完成盘点？将自动生成盘盈/盘亏差异移动单（停 CONFIRMED 待库管员二次确认）。"
          i18nEn:
            confirmText: "Confirm completing the stock take? Stock-take gain/loss variance movement orders will be generated automatically (orders stay CONFIRMED pending warehouse keeper double confirmation)."
          args:
            url: '/r/ErpInvStockTake__completeTake'
            method: post
            data:
              takeId: "${actionForm?.takeId}"
          then:
            - action: refreshSource
              targetId: stockTakeData
        i18nEn:
          label: "Complete Stock Take (completeTake)"
      - type: button
        label: "取消盘点 (cancelTake)"
        variant: destructive
        icon: "fa fa-times"
        onClick:
          action: ajax
          confirmText: "确认取消盘点？"
          i18nEn:
            confirmText: "Confirm cancelling the stock take?"
          args:
            url: '/r/ErpInvStockTake__cancelTake'
            method: post
            data:
              takeId: "${actionForm?.takeId}"
          then:
            - action: refreshSource
              targetId: stockTakeData
        i18nEn:
          label: "Cancel Stock Take (cancelTake)"