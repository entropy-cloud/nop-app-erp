# 库存概览 dashboard（plan 2026-08-28-1600-1 Phase 1）。
# flux 原生重写：service → data-source + chart（recharts declarative）+ crud。
# 数据源：ErpInvDashboard__getDashboardKpi / __getDashboardTrend / __findWarehouseDistribution / __findShortageAlert / __findSlowMovingAlert / __findBatchExpiryAlert。
type: page
title: 库存概览
i18nEn: Inventory Overview
body:
- type: form
  name: filterForm
  valuesPath: filterForm
  title: ""
  mode: inline
  wrapWithPanel: false
  className: m-3
  body:
  - type: input-date
    name: startDate
    label: 开始日期
    format: YYYY-MM-DD
    placeholder: 留空=本月1日
    i18nEn:
      label: Start Date
      placeholder: Blank = first day of month
    clearable: true
  - type: input-date
    name: endDate
    label: 结束日期
    format: YYYY-MM-DD
    placeholder: 留空=今天
    i18nEn:
      label: End Date
      placeholder: Blank = today
    clearable: true
  - type: button
    label: 刷新
    i18nEn: Refresh
    icon: refresh-cw
    onClick:
      action: refreshSource
      targetId: kpiData
      then:
        action: refreshSource
        targetId: trendData
        then:
          action: refreshSource
          targetId: warehouseData
          then:
            action: refreshSource
            targetId: shortageData
            then:
              action: refreshSource
              targetId: slowMovingData
              then:
                action: refreshSource
                targetId: batchExpiryData
- type: data-source
  name: kpiData
  action: ajax
  args:
    url: '@query:ErpInvDashboard__getDashboardKpi'
    method: post
    data:
      startDate: "${filterForm?.startDate || null}"
      endDate: "${filterForm?.endDate || null}"
    selection: totalValue incomingQty outgoingQty turnoverRate
- type: grid
  className: m-3
  gap: sm
  columns: 4
  items:
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 库存总值
        i18nEn: Total Inventory Value
      - type: text
        tag: h3
        className: text-primary
        text: "¥${ROUND((kpiData?.totalValue ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 本期入库量
        i18nEn: Inbound Qty (Period)
      - type: text
        tag: h3
        className: text-success
        text: "${ROUND((kpiData?.incomingQty ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 本期出库量
        i18nEn: Outbound Qty (Period)
      - type: text
        tag: h3
        className: text-danger
        text: "${ROUND((kpiData?.outgoingQty ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 库存周转率
        i18nEn: Inventory Turnover Rate
      - type: text
        tag: h3
        className: font-bold
        text: "${ROUND((kpiData?.turnoverRate ?? 0), 4)}"
- type: data-source
  name: trendData
  action: ajax
  args:
    url: '@query:ErpInvDashboard__getDashboardTrend'
    method: post
    data:
      months: 12
    selection: month netValueChange
- type: chart
  chartType: bar
  title: 库存价值月度变动（近12月）
  source: ${trendData ?? []}
  xAxis: { dataKey: month }
  yAxis: { label: 金额 }
  i18nEn:
    title: Monthly Inventory Value Change (Last 12 Months)
    yAxis: Amount
  legend: true
  height: 300
  series:
  - dataRegionKey: netValueChange
    name: 净变动成本
    i18nEn: Net Cost Change
- type: data-source
  name: warehouseData
  action: ajax
  args:
    url: '@query:ErpInvDashboard__findWarehouseDistribution'
    method: post
    selection: warehouseId warehouseName totalValue
- type: chart
  chartType: pie
  title: 仓库库存价值分布
  i18nEn: Inventory Value Distribution by Warehouse
  source: ${warehouseData ?? []}
  height: 300
- type: data-source
  name: shortageData
  action: ajax
  args:
    url: '@query:ErpInvDashboard__findShortageAlert'
    method: post
    selection: materialName warehouseName availableQuantity safetyStock
- type: crud
  title: 缺料预警（availableQty < material.safetyStock）
  i18nEn: Material Shortage Alert (availableQty < material.safetyStock)
  source: ${shortageData}
  syncLocation: false
  headerToolbar: []
  footerToolbar: []
  columns:
  - name: materialName
    label: 物料
    i18nEn: Material
  - name: warehouseName
    label: 仓库
    i18nEn: Warehouse
  - name: availableQuantity
    label: 可用量
    i18nEn: Available Qty
  - name: safetyStock
    label: 安全库存
    i18nEn: Safety Stock
- type: data-source
  name: slowMovingData
  action: ajax
  args:
    url: '@query:ErpInvDashboard__findSlowMovingAlert'
    method: post
    selection: materialName warehouseName totalQuantity lastOutDate
- type: crud
  title: 滞销库存预警（阈值经 erp-dash.inv-slow-moving-days 配置）
  i18nEn: Slow-Moving Inventory Alert (threshold configured via erp-dash.inv-slow-moving-days)
  source: ${slowMovingData}
  syncLocation: false
  headerToolbar: []
  footerToolbar: []
  columns:
  - name: materialName
    label: 物料
    i18nEn: Material
  - name: warehouseName
    label: 仓库
    i18nEn: Warehouse
  - name: totalQuantity
    label: 库存量
    i18nEn: Stock Qty
  - name: lastOutDate
    label: 最后出库日
    i18nEn: Last Outbound Date
- type: data-source
  name: batchExpiryData
  action: ajax
  args:
    url: '@query:ErpInvDashboard__findBatchExpiryAlert'
    method: post
    selection: batchNo materialName warehouseName expiryDate remainingDays availableQuantity
- type: crud
  title: 批次效期预警（阈值经 erp-dash.inv-batch-expiry-days 配置）
  i18nEn: Batch Expiry Alert (threshold configured via erp-dash.inv-batch-expiry-days)
  source: ${batchExpiryData}
  syncLocation: false
  headerToolbar: []
  footerToolbar: []
  columns:
  - name: batchNo
    label: 批次号
    i18nEn: Batch No
  - name: materialName
    label: 物料
    i18nEn: Material
  - name: warehouseName
    label: 仓库
    i18nEn: Warehouse
  - name: expiryDate
    label: 到期日
    i18nEn: Expiry Date
  - name: remainingDays
    label: 剩余天数
    i18nEn: Remaining Days
  - name: availableQuantity
    label: 可用量
    i18nEn: Available Qty
