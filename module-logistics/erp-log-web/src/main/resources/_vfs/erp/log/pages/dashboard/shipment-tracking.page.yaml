# logistics 发运追踪时间线（F16 P2 复杂页面，plan 2026-07-22-1400-2 §Phase 2 + plan 2026-08-29-1913-1 Phase 1）。
# flux 原生重写：data-source → form → timeline。
# 数据源：ErpLogShipmentLog__findPage + ErpLogShipment__get（前端按 shipmentId 过滤后展示）。
# 字段名经实时仓库核实：actionType/executedAt/isSuccess/requestBody/responseBody/httpStatus/errorCode/errorMessage。
# 超期警告：estimatedDeliveryDate < now 红色标记。地图 = Non-Goal。
type: page
title: "发运追踪时间线"
remark: "选择发运单后，按 ErpLogShipmentLog 时间线展示物流网关交互事件（actionType/executedAt/isSuccess），失败事件显示 errorCode/errorMessage。超期未送达（estimatedDeliveryDate < 今天）红色标记。地图为 Non-Goal。"
body:
  - type: form
    name: filterForm
    title: "发运单选择"
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-number
        name: shipmentId
        label: "发运单ID"
        placeholder: "输入发运单主键"
        required: true
        clearable: true
      - type: button
        label: "查询时间线"
        icon: route
        onClick:
          action: refreshSource
          targetId: trackingData

  - type: data-source
    name: trackingData
    action: ajax
    args:
      url: '@query:ErpLogShipmentLog__findPage'
      method: post
      data:
        query:
          limit: 5000
      selection: id shipmentId actionType executedAt isSuccess httpStatus errorCode errorMessage requestBody responseBody

  - type: data-source
    name: shipmentInfo
    action: ajax
    args:
      url: '@query:ErpLogShipment__get'
      method: post
      data:
        id: "${filterForm?.shipmentId || null}"
      selection: id code estimatedDeliveryDate actualDeliveryDate status trackingNo carrierId totalParcels

  - type: text
    className: m-3
    tag: div
    visibleOn: "${shipmentInfo}"
    text: '<div class="panel panel-default"><div class="panel-body"><strong>${shipmentInfo?.code || "—"}</strong> · 追踪号: ${shipmentInfo?.trackingNo || "—"} · 状态: ${shipmentInfo?.status || "—"} · 包裹数: ${shipmentInfo?.totalParcels || 0} · 预计送达: ${shipmentInfo?.estimatedDeliveryDate || "—"} ${(shipmentInfo?.estimatedDeliveryDate && !shipmentInfo?.actualDeliveryDate && shipmentInfo?.estimatedDeliveryDate < today) ? "<span class=\"label label-danger\">超期未送达</span>" : ""}</div></div>'

  - type: text
    className: m-3
    tag: div
    visibleOn: "${!trackingData?.items?.length && !shipmentInfo}"
    text: '<div class="text-muted p-3">请输入有效的发运单ID后点击「查询时间线」。若无事件日志，说明该发运单尚未触发网关交互。</div>'

  - type: text
    className: m-3
    tag: div
    visibleOn: "${trackingData?.items?.length}"
    text: '<div class="text-muted m-b-sm">事件数：${trackingData?.items?.length || 0}（按 executedAt 倒序）</div>'

  - type: timeline
    className: m-3
    source: ${trackingData?.items ?? []}
    items:
      - time: "${executedAt}"
        title: "${'[' + (actionType || 'EVENT') + '] ' + (httpStatus != null ? 'HTTP ' + httpStatus + ' ' : '') + (isSuccess ? '成功' : '失败')}"
        detail: "${!isSuccess ? ((errorCode ? '错误码: ' + errorCode : '') + (errorMessage ? ' / 信息: ' + errorMessage : '')) : ''}"
        color: "${isSuccess ? (actionType === 'CREATE' ? '#3b82f6' : actionType === 'SEND' ? '#0ea5e9' : actionType === 'RECEIVE' ? '#22c55e' : actionType === 'ACK' ? '#8b5cf6' : actionType === 'STATUS_UPDATE' ? '#f59e0b' : actionType === 'DELIVER' ? '#16a34a' : '#6b7280') : '#ef4444'}"