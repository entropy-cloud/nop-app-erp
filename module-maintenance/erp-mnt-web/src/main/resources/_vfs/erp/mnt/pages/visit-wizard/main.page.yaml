# 维护访问执行向导（F12 Tier C + F16 successor，plan 2026-07-23-1145-1 + plan 2026-08-29-1913-2 Phase 1）。
#
# 引导式驱动既有 maintenance Facade mutation 链（零后端 delta，BizModel 状态机已就绪）：
#   __start(@BizMutation SCHEDULED→IN_PROGRESS + 设备联动) → __save(备件/结果字段) →
#   __complete(@BizMutation IN_PROGRESS→COMPLETED + 设备恢复) + __cancel(@BizMutation 非终态→CANCELLED)。
#
# 步骤映射：Step 1 维护信息确认（只读 + 开始执行）→ Step 2 备件消耗展示 → Step 3 执行结果录入 → Step 4 确认完成/取消。
# flux 原生重写：data-source → form → wizard-style 步骤。
type: page
title: "维护访问执行向导"
remark: "引导式驱动既有 __start → __save → __complete 链 + __cancel。零后端 delta，仅编排 BizModel 已审计 mutation。"
body:
  - type: data-source
    name: visitsData
    action: ajax
    args:
      url: '@query:ErpMntVisit__findPage'
      method: post
      data:
        query:
          limit: 200
      selection: id code status visitType visitDate equipmentId

  - type: form
    name: filterForm
    title: "选择维护访问"
    className: m-3
    mode: inline
    body:
      - type: select
        name: visitId
        label: "维护访问"
        required: true
        clearable: true
        placeholder: "选择要执行的维护访问"
        source: ${visitsData?.items ?? []}
        valueField: id
        labelField: "${code || ('visit-' + id)} · [${status}]"
      - type: button
        label: "进入向导"
        level: primary
        icon: "fa fa-arrow-right"
        onClick:
          action: refreshSource
          targetId: visitData
          then:
            action: refreshSource
            targetId: sparePartsData
        disabledOn: "${!filterForm?.visitId}"

  - type: data-source
    name: visitData
    action: ajax
    args:
      url: '@query:ErpMntVisit__get'
      method: post
      data:
        id: "${filterForm?.visitId}"
      selection: id code status visitType visitDate equipmentId assignedTo result remark startTime endTime totalMinutes completedAt completedBy

  - type: text
    className: m-3
    tag: div
    visibleOn: "${visitData}"
    text: '<div class="alert alert-info"><strong>维护访问：</strong>${visitData?.code || "—"}（${visitType || || "—"}）· <strong>状态：</strong><span class="label label-${visitData?.status == "COMPLETED" ? "success" : (visitData?.status == "CANCELLED" ? "default" : (visitData?.status == "IN_PROGRESS" ? "warning" : "info"))}">${visitData?.status || "—"}</span></div>'

  - type: steps
    className: m-3
    items:
      - { key: "info", label: "1. 维护信息确认" }
      - { key: "spare", label: "2. 备件消耗" }
      - { key: "result", label: "3. 执行结果" }
      - { key: "complete", label: "4. 确认完成" }

  # Step 1: 开始执行
  - type: wrapper
    className: m-3 p-3 border rounded"
    body:
      - type: text
        tag: h5
        text: "Step 1 · 维护信息确认"
      - type: text
        tag: div
        className: text-muted
        text: "调 __start 触发 SCHEDULED→IN_PROGRESS + 设备联动。"
      - type: button
        label: "开始执行"
        level: primary
        icon: "fa fa-play"
        actionType: ajax
        visibleOn: "${visitData?.status == 'SCHEDULED' || visitData?.status == 'DRAFT'}"
        confirmText: "确认开始执行此维护访问？状态将翻转为 IN_PROGRESS。"
        api:
          url: '@mutation:ErpMntVisit__start'
          method: post
          data:
            visitId: "${visitData?.id}"
        onEvent:
          after-success:
            action: refreshSource
            targetId: visitData

  # Step 2: 备件消耗展示
  - type: data-source
    name: sparePartsData
    action: ajax
    args:
      url: '@query:ErpMntSparePartUsage__findPage'
      method: post
      data:
        query:
          limit: 500
      selection: id code warehouseId totalAmount docStatus approveStatus posted

  - type: wrapper
    className: m-3 p-3 border rounded"
    body:
      - type: text
        tag: h5
        text: "Step 2 · 备件消耗展示"
      - type: text
        tag: div
        className: text-muted
        text: "SparePartUsage 是嵌套文档，仅展示。备件消耗创建经独立 CRUD 页面。"
      - type: crud
        title: "备件消耗列表"
        source: ${sparePartsData?.items ?? []}
        syncLocation: false
        headerToolbar: []
        footerToolbar: []
        columns:
          - name: code
            label: "编码"
          - name: warehouseId
            label: "仓库"
          - name: totalAmount
            label: "总金额"
          - name: docStatus
            label: "状态"
          - name: posted
            label: "过账"

  # Step 3: 执行结果录入
  - type: wrapper
    className: m-3 p-3 border rounded"
    visibleOn: "${visitData?.status == 'IN_PROGRESS'}"
    body:
      - type: text
        tag: h5
        text: "Step 3 · 执行结果录入"
      - type: form
        name: resultForm
        mode: normal
        body:
          - type: textarea
            name: result
            label: "执行结果"
            placeholder: "执行情况/发现"
          - type: textarea
            name: remark
            label: "备注"
            placeholder: "其他备注"
          - type: button
            label: "保存执行结果"
            level: primary
            icon: "fa fa-save"
            actionType: ajax
            api:
              url: '@mutation:ErpMntVisit__save'
              method: post
              data:
                id: "${visitData?.id}"
                result: "${resultForm?.result}"
                remark: "${resultForm?.remark}"
            onEvent:
              after-success:
                action: refreshSource
                targetId: visitData

  # Step 4: 完成或取消
  - type: wrapper
    className: m-3 p-3 border rounded"
    visibleOn: "${visitData?.status == 'IN_PROGRESS'}"
    body:
      - type: text
        tag: h5
        text: "Step 4 · 确认完成/取消"
      - type: button
        label: "确认完成"
        level: success
        icon: "fa fa-check"
        actionType: ajax
        confirmText: "确认完成此维护访问？状态将翻转为 COMPLETED + 设备恢复。"
        api:
          url: '@mutation:ErpMntVisit__complete'
          method: post
          data:
            visitId: "${visitData?.id}"
        onEvent:
          after-success:
            action: refreshSource
            targetId: visitData
      - type: button
        label: "取消"
        level: danger
        icon: "fa fa-times"
        actionType: ajax
        confirmText: "确认取消此维护访问？"
        api:
          url: '@mutation:ErpMntVisit__cancel'
          method: post
          data:
            visitId: "${visitData?.id}"
        onEvent:
          after-success:
            action: refreshSource
            targetId: visitData