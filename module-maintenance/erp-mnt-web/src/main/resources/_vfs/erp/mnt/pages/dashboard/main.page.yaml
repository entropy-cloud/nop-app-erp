# 维护概览 dashboard（plan 2026-08-29-1913-2 Phase 1）。
# flux 原生重写：data-source → KPI 卡 + OEE + chart + 2 crud。
# 数据源：ErpMntDashboard__getDashboardKpi / __getDashboardOeeKpi / __getEquipmentStatusDistribution
#       / __findEquipmentDowntimeAlert / __findMaintenanceOverdueAlert。
type: page
title: "维护概览"
i18nEn: "Maintenance Overview"
body:
  - type: form
    name: filterForm
    valuesPath: filterForm
    title: ""
    mode: inline
    wrapWithPanel: false
    className: m-3
    body:
      - type: input-date
        name: startDate
        label: "开始日期"
        format: YYYY-MM-DD
        placeholder: "留空=本月1日"
        i18nEn:
          label: "Start Date"
          placeholder: "Leave blank = 1st of current month"
        clearable: true
      - type: input-date
        name: endDate
        label: "结束日期"
        format: YYYY-MM-DD
        placeholder: "留空=今天"
        i18nEn:
          label: "End Date"
          placeholder: "Leave blank = today"
        clearable: true
      - type: button
        label: "刷新"
        i18nEn: "Refresh"
        icon: refresh-cw
        onClick:
          action: refreshSource
          targetId: kpiData
          then:
            action: refreshSource
            targetId: oeeData
          then:
            action: refreshSource
            targetId: statusData
          then:
            action: refreshSource
            targetId: downtimeData
          then:
            action: refreshSource
            targetId: overdueData

  - type: data-source
    name: kpiData
    action: ajax
    args:
      url: '@query:ErpMntDashboard__getDashboardKpi'
      method: post
      data:
        startDate: "${filterForm?.startDate || null}"
        endDate: "${filterForm?.endDate || null}"
      selection: equipmentTotal runningCount openRequestCount periodVisitCount

  - type: grid
    className: m-3
    gap: sm
    columns: 4
    items:
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "设备总数"
                i18nEn: "Equipment Total"
              - type: text
                tag: span
                className: h3 font-bold
                text: "${kpiData?.equipmentTotal ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "运行中设备"
                i18nEn: "Running Equipment"
              - type: text
                tag: span
                className: h3 text-success
                text: "${kpiData?.runningCount ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "待处理维护请求"
                i18nEn: "Pending Maintenance Requests"
              - type: text
                tag: span
                className: h3 text-warning
                text: "${kpiData?.openRequestCount ?? 0}"
      - colSpan: 1
        body:
          - type: card
            className: border rounded p-3
            body:
              - type: text
                tag: div
                className: text-muted
                text: "本期维护访问数"
                i18nEn: "Maintenance Visits This Period"
              - type: text
                tag: span
                className: h3 text-primary
                text: "${kpiData?.periodVisitCount ?? 0}"

  - type: data-source
    name: oeeData
    action: ajax
    args:
      url: '@query:ErpMntDashboard__getDashboardOeeKpi'
      method: post
      data:
        startDate: "${filterForm?.startDate || null}"
        endDate: "${filterForm?.endDate || null}"
      selection: oeeDisplay availabilityDisplay performanceDisplay qualityDisplay computedCount equipmentTotal

  - type: wrapper
    className: m-3 border rounded p-3
    body:
      - type: text
        tag: div
        className: text-muted
        text: "设备 OEE（可用率×性能×质量）"
        i18nEn: "Equipment OEE (Availability × Performance × Quality)"
      - type: text
        tag: span
        className: h3 text-danger
        text: "${oeeData?.oeeDisplay ?? '—'}"
      - type: text
        tag: div
        className: text-muted text-sm
        text: "可用率 ${oeeData?.availabilityDisplay ?? '—'} · 性能 ${oeeData?.performanceDisplay ?? '—'} · 质量 ${oeeData?.qualityDisplay ?? '—'} · 样本 ${oeeData?.computedCount ?? 0}/${oeeData?.equipmentTotal ?? 0} 台"
        i18nEn: "Availability ${oeeData?.availabilityDisplay ?? '—'} · Performance ${oeeData?.performanceDisplay ?? '—'} · Quality ${oeeData?.qualityDisplay ?? '—'} · Sample ${oeeData?.computedCount ?? 0}/${oeeData?.equipmentTotal ?? 0} units"

  - type: data-source
    name: statusData
    action: ajax
    args:
      url: '@query:ErpMntDashboard__getEquipmentStatusDistribution'
      selection: status count

  - type: chart
    chartType: pie
    title: "设备状态分布"
    i18nEn: "Equipment Status Distribution"
    source: ${statusData ?? []}
    height: 300
    series:
      - dataRegionKey: count
        name: "设备数"
        i18nEn: "Equipment Count"
        nameField: status

  - type: data-source
    name: downtimeData
    action: ajax
    args:
      url: '@query:ErpMntDashboard__findEquipmentDowntimeAlert'
      selection: equipmentCode equipmentName status

  - type: crud
    className: m-3
    title: "设备停机预警（状态=DOWN 且停机未恢复）"
    i18nEn: "Equipment Downtime Alert (status = DOWN and not yet recovered)"
    source: ${downtimeData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: equipmentCode
        label: "设备编码"
        i18nEn: "Equipment Code"
      - name: equipmentName
        label: "设备名称"
        i18nEn: "Equipment Name"
      - name: status
        label: "状态"
        i18nEn: "Status"

  - type: data-source
    name: overdueData
    action: ajax
    args:
      url: '@query:ErpMntDashboard__findMaintenanceOverdueAlert'
      selection: scheduleCode scheduleName equipmentId nextDueDate overdueDays

  - type: crud
    className: m-3
    title: "维护逾期预警（阈值经 erp-dash.mnt-maintenance-overdue-days 配置）"
    i18nEn: "Maintenance Overdue Alert (threshold configured via erp-dash.mnt-maintenance-overdue-days)"
    source: ${overdueData ?? []}
    syncLocation: false
    headerToolbar: []
    footerToolbar: []
    columns:
      - name: scheduleCode
        label: "计划编码"
        i18nEn: "Schedule Code"
      - name: scheduleName
        label: "计划名称"
        i18nEn: "Schedule Name"
      - name: equipmentId
        label: "设备ID"
        i18nEn: "Equipment ID"
      - name: nextDueDate
        label: "下次到期日"
        i18nEn: "Next Due Date"
      - name: overdueDays
        label: "逾期(天)"
        i18nEn: "Overdue (days)"