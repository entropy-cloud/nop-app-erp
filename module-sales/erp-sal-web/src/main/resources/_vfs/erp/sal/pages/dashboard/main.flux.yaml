# 销售概览 dashboard（plan 2026-08-28-1600-1 Phase 1）。
# flux 原生重写：service → data-source + chart（recharts declarative）+ crud。
# 数据源：ErpSalDashboard__getDashboardKpi / __getDashboardTrend / __findCustomerTopN / __findArOverdueAlert。
type: page
title: 销售概览
i18nEn: "Sales Overview"
body:
- type: form
  name: filterForm
  valuesPath: filterForm
  title: ""
  mode: inline
  wrapWithPanel: false
  className: m-3
  body:
  - type: input-date
    name: startDate
    label: 开始日期
    format: YYYY-MM-DD
    placeholder: 留空=本月1日
    i18nEn:
      label: "Start Date"
      placeholder: "Leave blank = first day of this month"
    clearable: true
  - type: input-date
    name: endDate
    label: 结束日期
    format: YYYY-MM-DD
    placeholder: 留空=今天
    i18nEn:
      label: "End Date"
      placeholder: "Leave blank = today"
    clearable: true
  - type: button
    label: 刷新
    i18nEn: "Refresh"
    icon: refresh-cw
    onClick:
      action: refreshSource
      targetId: kpiData
      then:
        action: refreshSource
        targetId: trendData
        then:
          action: refreshSource
          targetId: topNCustomerData
          then:
            action: refreshSource
            targetId: arOverdueData
- type: data-source
  name: kpiData
  action: ajax
  args:
    url: '@query:ErpSalDashboard__getDashboardKpi'
    method: post
    data:
      startDate: "${filterForm?.startDate || null}"
      endDate: "${filterForm?.endDate || null}"
    selection: salesAmount orderCount conversionRate arBalance
- type: grid
  className: m-3
  gap: sm
  columns: 4
  items:
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 本期销售额
        i18nEn: "Current Period Sales Amount"
      - type: text
        tag: h3
        className: text-success
        text: "¥${ROUND((kpiData?.salesAmount ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 本期订单量
        i18nEn: "Current Period Order Count"
      - type: text
        tag: h3
        className: font-bold
        text: "${kpiData?.orderCount ?? 0}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 订单→开票转化率
        i18nEn: "Order-to-Invoice Conversion Rate"
      - type: text
        tag: h3
        className: text-primary
        text: "${ROUND((kpiData?.conversionRate ?? 0), 2)}"
  - colSpan: 1
    body:
    - type: card
      className: border rounded p-3
      body:
      - type: text
        tag: div
        className: text-muted
        text: 应收余额
        i18nEn: "AR Balance"
      - type: text
        tag: h3
        className: text-warning
        text: "¥${ROUND((kpiData?.arBalance ?? 0), 2)}"
- type: data-source
  name: trendData
  action: ajax
  args:
    url: '@query:ErpSalDashboard__getDashboardTrend'
    method: post
    data:
      months: 12
    selection: month salesAmount
- type: chart
  chartType: line
  title: 销售趋势（近12月）
  i18nEn: "Sales Trend (Last 12 Months)"
  source: ${trendData ?? []}
  xAxis: { dataKey: month }
  yAxis:
    label: 金额
    i18nEn: "Amount"
  legend: true
  height: 300
  series:
  - dataRegionKey: salesAmount
    name: 销售额
    i18nEn: "Sales Amount"
- type: data-source
  name: topNCustomerData
  action: ajax
  args:
    url: '@query:ErpSalDashboard__findCustomerTopN'
    method: post
    data:
      limit: 10
    selection: customerId customerName salesAmount
- type: chart
  chartType: pie
  title: 客户 TOP10 销售占比
  i18nEn: "Customer Top 10 Sales Share"
  source: ${topNCustomerData ?? []}
  height: 300
- type: data-source
  name: arOverdueData
  action: ajax
  args:
    url: '@query:ErpSalDashboard__findArOverdueAlert'
    method: post
    selection: partnerName sourceBillCode openAmount ageDays
- type: crud
  title: 应收超期预警
  i18nEn: "AR Overdue Alert"
  source: ${arOverdueData}
  syncLocation: false
  headerToolbar: []
  footerToolbar: []
  columns:
  - name: partnerName
    label: 客户
    i18nEn: "Customer"
  - name: sourceBillCode
    label: 单据号
    i18nEn: "Document No."
  - name: openAmount
    label: 未结金额
    i18nEn: "Open Amount"
    type: number
    precision: 2
  - name: ageDays
    label: 账龄(天)
    i18nEn: "Aging (Days)"
    type: number
